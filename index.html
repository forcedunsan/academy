const exportJSON = (students, settings) => {
  const data = {
    version: '1.0',
    exportedAt: new Date().toISOString(),
    students,
    settings,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().split('T')[0];
  a.download = `수강료생성기_백업_${date}.json`;
  a.href = url;
  a.click();
  URL.revokeObjectURL(url);
  // 백업 시점 기록 (자동 백업 알림용)
  storage.set('tuition_last_backup_at', new Date().toISOString());
  storage.set('tuition_backup_snooze_until', '');
};

const importJSON = (file, onLoad) => {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.students || !Array.isArray(data.students)) {
        throw new Error('올바른 백업 파일이 아닙니다');
      }
      onLoad(data);
    } catch (err) {
      alert('가져오기 실패: ' + err.message);
    }
  };
  reader.readAsText(file);
};

// 모든 학생을 다음 주기로 이동 (퇴원생 제외, 월정액은 다음 달로)
const advanceAllStudents = (students, holidays, currentYearMonth) => {
  // 각 학생을 advanceOneStudent로 처리 (이력 저장 포함)
  return students.map(s => advanceOneStudent(s, holidays, currentYearMonth));
};

// 현재 주기를 이력 스냅샷으로 변환
const createCycleSnapshot = (student, holidays, currentYearMonth) => {
  const holidaySet = new Set((holidays || []).map(h => h.date));
  
  // 청구 총액 계산
  const tuitionSum = (student.subjects || []).reduce((sum, s) => sum + (Number(s.tuition) || 0), 0);
  const materialSum = (student.materials || []).reduce((sum, m) => sum + (Number(m.amount) || 0), 0);
  const totalAmount = tuitionSum + materialSum;
  
  // 기간 라벨 + 과목 스냅샷
  let periodLabel = '';
  const subjectSnapshots = [];
  
  if (student.isMonthly) {
    periodLabel = student.monthlyYearMonth || '';
    (student.subjects || []).forEach(sub => {
      subjectSnapshots.push({
        name: sub.name, label: sub.label,
        tuition: sub.tuition, totalSessions: sub.totalSessions,
        startDate: '', endDate: '', isMonthly: true,
      });
    });
  } else {
    const startDates = [];
    const endDates = [];
    (student.subjects || []).forEach(sub => {
      const sd = parseDate(sub.startDate);
      let ed = null;
      let schedule = []; // 실제 진행된 회차 일정 (이동·추가·삭제·사유 반영) — 월별 일정 조회용
      if (sd && sub.classDays?.length > 0) {
        const sessions = getClassSessions(sd, sub.classDays, sub.totalSessions, holidaySet, sub.skipHolidays);
        if (sessions.length > 0) {
          // 일정 변경이 반영된 실제 마지막 수업일로 이력 저장
          const csStr = formatDateStr(sessions[0].date);
          const ceStr = formatDateStr(sessions[sessions.length - 1].date);
          const { finals } = applyScheduleAdjustments(sessions, sub.adjustments, { cycleStartStr: csStr, cycleEndStr: ceStr, addFrom: sub.startDate, addTo: '', holidaySet, classDays: sub.classDays, skipHolidays: sub.skipHolidays });
          const lastStr = finals.length > 0 ? finals.map(f => f.dateStr).sort().pop() : ceStr;
          ed = parseDate(lastStr);
          schedule = finals.map(f => ({ num: f.num, date: f.dateStr, adjusted: !!(f.adjusted || f.holidayShifted), isExtra: !!f.isExtra, note: f.note || '' }));
        }
      }
      if (sd) startDates.push(sd);
      if (ed) endDates.push(ed);
      subjectSnapshots.push({
        name: sub.name, label: sub.label,
        tuition: sub.tuition, totalSessions: sub.totalSessions,
        startDate: sub.startDate,
        endDate: ed ? formatDateStr(ed) : '',
        isMonthly: false,
        schedule,
        makeups: (sub.makeups || []).map(m => ({ date: m.date, note: m.note || '' })),
        absences: (student.absences || []).filter(a => a.subjectId === sub.id).map(a => ({ date: a.date, note: a.note || '' })),
      });
    });
    if (startDates.length > 0) {
      const earliest = new Date(Math.min(...startDates.map(d => d.getTime())));
      const latest = endDates.length > 0 ? new Date(Math.max(...endDates.map(d => d.getTime()))) : earliest;
      periodLabel = `${earliest.getFullYear()}.${String(earliest.getMonth()+1).padStart(2,'0')}.${String(earliest.getDate()).padStart(2,'0')} ~ ${latest.getFullYear()}.${String(latest.getMonth()+1).padStart(2,'0')}.${String(latest.getDate()).padStart(2,'0')}`;
    }
  }
  
  // 납부 정보 (현재 달 기준)
  const ym = currentYearMonth || (student.isMonthly ? student.monthlyYearMonth : '');
  const payment = (student.payments && ym && student.payments[ym]) || { status: 'pending', paidDate: '' };
  
  return {
    id: uid(),
    savedDate: formatDateStr(new Date()),
    yearMonth: ym,
    periodLabel,
    subjects: subjectSnapshots,
    materials: (student.materials || []).map(m => ({ name: m.name, amount: m.amount })),
    tuitionSum,
    materialSum,
    totalAmount,
    payment: { status: payment.status, paidDate: payment.paidDate || '' },
  };
};

// 한 학생만 다음 주기로 이동 (advanceAllStudents의 단일 학생 버전)
const advanceOneStudent = (student, holidays, currentYearMonth) => {
  const holidaySet = new Set((holidays || []).map(h => h.date));
  
  if (student.isWithdrawn) return student;
  if (student.isSuspended) return student; // 휴원생은 주기 이동 안 함
  
  // 현재 주기를 이력에 저장
  const snapshot = createCycleSnapshot(student, holidays, currentYearMonth);
  const newHistory = [...(student.cycleHistory || []), snapshot];
  
  // 월정액 학생: 다음 달로
  if (student.isMonthly) {
    if (!student.monthlyYearMonth) return student;
    const [year, month] = student.monthlyYearMonth.split('-').map(Number);
    let newYear = year;
    let newMonth = month + 1;
    if (newMonth > 12) {
      newMonth = 1;
      newYear += 1;
    }
    return {
      ...student,
      monthlyYearMonth: `${newYear}-${String(newMonth).padStart(2, '0')}`,
      cycleHistory: newHistory,
    };
  }
  
  // 회차제: 다음 회차 시작일로
  return {
    ...student,
    cycleHistory: newHistory,
    subjects: (student.subjects || []).map(sub => {
      if (!sub.startDate || !sub.classDays || sub.classDays.length === 0) return sub;
      const sessions = getClassSessions(parseDate(sub.startDate), sub.classDays, sub.totalSessions, holidaySet, sub.skipHolidays);
      if (sessions.length === 0) return sub;
      // 일정 변경(이동·추가·삭제)이 반영된 실제 마지막 수업일 기준으로 다음 주기 시작 계산
      const csStr = formatDateStr(sessions[0].date);
      const ceStr = formatDateStr(sessions[sessions.length - 1].date);
      const { finals } = applyScheduleAdjustments(sessions, sub.adjustments, { cycleStartStr: csStr, cycleEndStr: ceStr, addFrom: sub.startDate, addTo: '', holidaySet, classDays: sub.classDays, skipHolidays: sub.skipHolidays });
      const lastStr = finals.length > 0 ? finals.map(f => f.dateStr).sort().pop() : ceStr;
      const endDate = parseDate(lastStr);
      const nextStart = getNextClassDay(endDate, sub.classDays, holidaySet);
      if (!nextStart) return sub;
      // 새 주기로 넘어가면 보강·일정변경 초기화 (지난 주기 것이므로)
      // 지금 요일·회차를 '지난 주기' 값으로 기록 → 새 주기에서 요일을 바꿔도 지난 진행 캘린더가 안 변함
      return { ...sub, startDate: formatDateStr(nextStart), adjustments: [], makeups: [], skipHolidays: [], prevClassDays: [...(sub.classDays || [])], prevTotalSessions: sub.totalSessions };
    }),
  };
};

// 학생의 익월 등록 마감일 계산 (일정 변경·휴원일 이동 반영) — 수강료 안내 알림용
const getRegistrationDeadline = (student, settings) => {
  if (student.isWithdrawn || student.isSuspended) return null;
  const holidaySet = new Set((settings.holidays || []).map(h => h.date));
  if (student.isMonthly) {
    if (!student.monthlyYearMonth) return null;
    const [y, m] = student.monthlyYearMonth.split('-').map(Number);
    if (!y || !m) return null;
    return new Date(y, m, 0); // 대상 월의 말일
  }
  const nextStarts = [];
  (student.subjects || []).forEach(sub => {
    if (!sub.startDate || !sub.classDays || sub.classDays.length === 0) return;
    const sessions = getClassSessions(parseDate(sub.startDate), sub.classDays, sub.totalSessions, holidaySet, sub.skipHolidays);
    if (sessions.length === 0) return;
    const csStr = formatDateStr(sessions[0].date);
    const ceStr = formatDateStr(sessions[sessions.length - 1].date);
    const { finals } = applyScheduleAdjustments(sessions, sub.adjustments, { cycleStartStr: csStr, cycleEndStr: ceStr, addFrom: sub.startDate, addTo: '', holidaySet, classDays: sub.classDays, skipHolidays: sub.skipHolidays });
    const lastStr = finals.length > 0 ? finals.map(f => f.dateStr).sort().pop() : ceStr;
    const nextStart = getNextClassDay(parseDate(lastStr), sub.classDays, holidaySet);
    if (nextStart) nextStarts.push(nextStart);
  });
  if (nextStarts.length === 0) return null;
  const earliest = new Date(Math.min(...nextStarts.map(d => d.getTime())));
  return addDays(earliest, -1);
};

// 💳 결제 수단 목록 (납부 현황 드롭다운)
const PAYMENT_METHODS = [
  '카드(일반)',
  '카드(캐시노트)',
  '카드(동네학원 어플)',
  '카드(백페이)',
  '카카오뱅크 입금',
  '동네학원 가상계좌',
  '현금',
];

// 📩 학부모께 보낼 수강료 안내 문자 만들기 (카톡·문자에 붙여넣기용)
const buildPaymentMessage = (student, settings, deadline, amount) => {
  const lines = [
    `[${settings.academyName}] ${student.name} 학생 등록 안내`,
    '',
    `안녕하세요, ${settings.academyName}입니다 😊`,
    `${student.name} 학생의 등록 기간이 되어 안내드립니다.`,
    '',
  ];
  if (deadline) lines.push(`· 등록 마감일: ${fmtKDate(deadline)}`);
  if (amount) lines.push(`· 수강료: ${fmtWon(amount)}`);
  if (settings.tuitionBankAccount) lines.push(`· 계좌: ${settings.tuitionBankName} ${settings.tuitionBankAccount} (예금주 ${settings.tuitionBankHolder})`);
  lines.push('', '항상 믿고 맡겨주셔서 감사합니다 🙏');
  return lines.join('\n');
};

const copyText = (text, okMsg) => {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => alert(okMsg || '📋 안내 문자가 복사됐어요!\n카톡 대화창에 붙여넣기(Ctrl+V) 하세요.')).catch(() => alert(text));
  } else {
    alert(text);
  }
};

// 알림 계산 (마감 임박 + 마감 지난 미납) — 배너·알림 게시판 공용
const computeTuitionAlerts = (students, settings) => {
  const REMIND_DAYS = 5;
  const todayStr = formatDateStr(new Date());
  const today = parseDate(todayStr);
  const todayYm = todayStr.slice(0, 7);
  const items = [];      // 마감 임박 (안내 보낼 때)
  const overdueUnpaid = []; // 마감 지남 + 미납
  (students || []).forEach(s => {
    const dl = getRegistrationDeadline(s, settings);
    if (!dl) return;
    const diff = Math.round((dl.getTime() - today.getTime()) / 86400000);
    const dlYm = formatDateStr(dl).slice(0, 7);
    const done = (p) => !!(p && (p.status === 'paid' || p.status === 'refunded')); // 완납·환불은 독촉 대상 아님
    const isPaid = (s.payments && (done(s.payments[todayYm]) || done(s.payments[dlYm]))) || false;
    const amount = (s.subjects || []).reduce((a, x) => a + (x.tuition || 0), 0) + (s.materials || []).reduce((a, x) => a + (x.amount || 0), 0);
    if (diff < 0 && diff >= -60 && !isPaid) {
      overdueUnpaid.push({ s, deadline: dl, diff, amount });
    } else if (diff <= REMIND_DAYS && diff >= -7) {
      items.push({ s, deadline: dl, diff, amount });
    }
  });
  items.sort((a, b) => a.diff - b.diff);
  overdueUnpaid.sort((a, b) => a.diff - b.diff);
  return { items, overdueUnpaid, REMIND_DAYS };
};

// ⏰ 수강료 안내 알림 배너 (등록 마감 5일 전부터) + 🔴 마감 지난 미납 학생
function TuitionReminderBanner({ students, settings, onGoStudent, onGoPayments }) {
  const todayStr = formatDateStr(new Date());
  const [dismissed, setDismissed] = useState(() => storage.get('tuition_remind_dismiss') === todayStr);

  const { items, overdueUnpaid, REMIND_DAYS } = computeTuitionAlerts(students, settings);

  if ((items.length === 0 && overdueUnpaid.length === 0) || dismissed) return null;

  const dismissToday = () => {
    storage.set('tuition_remind_dismiss', todayStr);
    setDismissed(true);
  };

  const ddayLabel = (diff) => {
    if (diff > 0) return { text: `D-${diff}`, cls: 'bg-amber-100 text-amber-800 border-amber-300' };
    if (diff === 0) return { text: '오늘 마감!', cls: 'bg-rose-600 text-white border-rose-700' };
    return { text: `${-diff}일 지남`, cls: 'bg-rose-100 text-rose-700 border-rose-300' };
  };

  return (
    <div className="mb-4 border-2 border-amber-400 bg-amber-50 rounded-lg overflow-hidden">
      <div className="flex items-center justify-between px-4 py-2 bg-amber-100">
        <span className="text-sm font-bold text-amber-900">
          ⏰ 수강료 알림
          {items.length > 0 && <span className="ml-2">마감 임박 <span className="text-rose-600">{items.length}명</span></span>}
          {overdueUnpaid.length > 0 && <span className="ml-2">· 🔴 마감 지난 미납 <span className="text-rose-600 font-extrabold">{overdueUnpaid.length}명</span></span>}
        </span>
        <button onClick={dismissToday} className="text-[11px] text-amber-700 hover:text-amber-900 underline">오늘 하루 그만 보기</button>
      </div>

      {/* 🔴 등록 마감일이 지났는데 미납인 학생 */}
      {overdueUnpaid.length > 0 && (
        <div className="px-4 py-2 space-y-1 bg-rose-50 border-b border-rose-200">
          {overdueUnpaid.map(({ s, deadline, diff, amount }) => (
            <div key={s.id} className="flex items-center gap-2 flex-wrap text-sm">
              <span className="text-[11px] font-bold px-2 py-0.5 rounded-full border bg-rose-600 text-white border-rose-700">미납 {-diff}일째</span>
              <span className="font-bold text-gray-800">{s.name}</span>
              <span className="text-xs text-gray-600">마감 <strong>{fmtKDate(deadline)}</strong> · <strong className="text-rose-700">{fmtWon(amount)}</strong></span>
              <span className="ml-auto flex gap-1">
                <button onClick={() => copyText(buildPaymentMessage(s, settings, deadline, amount))} className="px-2.5 py-1 bg-yellow-500 hover:bg-yellow-600 text-white text-[11px] rounded font-semibold" title="학부모께 보낼 안내 문자를 복사해요">📩 문자 복사</button>
                <button onClick={() => onGoStudent(s.id)} className="px-2.5 py-1 bg-amber-600 hover:bg-amber-700 text-white text-[11px] rounded font-semibold">📋 안내문</button>
                <button onClick={onGoPayments} className="px-2.5 py-1 bg-rose-600 hover:bg-rose-700 text-white text-[11px] rounded font-semibold">💰 납부 현황</button>
              </span>
            </div>
          ))}
        </div>
      )}

      {/* ⏰ 등록 마감 임박 (안내 보낼 때) */}
      {items.length > 0 && (
        <div className="px-4 py-2 space-y-1">
          {items.map(({ s, deadline, diff, amount }) => {
            const d = ddayLabel(diff);
            return (
              <div key={s.id} className="flex items-center gap-2 flex-wrap text-sm">
                <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full border ${d.cls}`}>{d.text}</span>
                <span className="font-bold text-gray-800">{s.name}</span>
                <span className="text-xs text-gray-600">등록 마감일: <strong>{fmtKDate(deadline)}</strong></span>
                <span className="ml-auto flex gap-1">
                  <button onClick={() => copyText(buildPaymentMessage(s, settings, deadline, amount))} className="px-2.5 py-1 bg-yellow-500 hover:bg-yellow-600 text-white text-[11px] rounded font-semibold" title="학부모께 보낼 안내 문자를 복사해요">📩 문자 복사</button>
                  <button onClick={() => onGoStudent(s.id)} className="px-2.5 py-1 bg-amber-600 hover:bg-amber-700 text-white text-[11px] rounded font-semibold">
                    📋 안내문 보기
                  </button>
                </span>
              </div>
            );
          })}
        </div>
      )}

      <div className="px-4 py-1.5 bg-amber-100/60 text-[10px] text-amber-700">
        💡 안내 후 <strong>"➡️ 다음 주기로 이동"</strong>하면 알림이 사라지고, 미납 알림은 <strong>납부완료 처리</strong>하면 사라집니다. 마감일 = 다음 주기 시작 전날 (일정 변경 반영).
      </div>
    </div>
  );
}

// 🔔 알림 게시판 — 배너를 닫았어도 언제든 다시 보는 창
function AlertBoardModal({ students, settings, onClose, onGoStudent, onGoPayments }) {

    if (diff > 0) return { text: `D-${diff}`, cls: 'bg-amber-100 text-amber-800 border-amber-300' };
    if (diff === 0) return { text: '오늘 마감!', cls: 'bg-rose-600 text-white border-rose-700' };
    return { text: `${-diff}일 지남`, cls: 'bg-rose-100 text-rose-700 border-rose-300' };
  };

  return (
    <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 overflow-y-auto" onClick={onClose}>
      <div className="bg-white rounded-xl shadow-2xl w-full max-w-xl my-8 max-h-[85vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
        <div className="invoice-navy text-white px-5 py-3 flex items-center justify-between sticky top-0 z-10">
          <h2 className="text-base font-bold">🔔 알림 게시판</h2>
          <button onClick={onClose} className="text-white/70 hover:text-white text-2xl leading-none">×</button>
        </div>
        <div className="p-4 space-y-4">
          {overdueUnpaid.length === 0 && items.length === 0 && (
            <div className="py-8 text-center text-gray-400 text-sm">
              🎉 지금은 알림이 없어요!<br />
              <span className="text-[11px]">등록 마감 {REMIND_DAYS}일 전 학생과 마감 지난 미납 학생이 여기에 표시됩니다.</span>
            </div>
          )}

          {overdueUnpaid.length > 0 && (
            <div>
              <div className="text-sm font-bold text-rose-700 mb-1.5">🔴 마감 지난 미납 학생 ({overdueUnpaid.length}명)</div>
              <div className="space-y-1 p-2 bg-rose-50 border border-rose-200 rounded">
                {overdueUnpaid.map(({ s, deadline, diff, amount }) => (
                  <div key={s.id} className="flex items-center gap-2 flex-wrap text-sm">
                    <span className="text-[11px] font-bold px-2 py-0.5 rounded-full border bg-rose-600 text-white border-rose-700">미납 {-diff}일째</span>
                    <span className="font-bold text-gray-800">{s.name}</span>
                    <span className="text-xs text-gray-600">마감 <strong>{fmtKDate(deadline)}</strong> · <strong className="text-rose-700">{fmtWon(amount)}</strong></span>
                    <span className="ml-auto flex gap-1">
                      <button onClick={() => copyText(buildPaymentMessage(s, settings, deadline, amount))} className="px-2.5 py-1 bg-yellow-500 hover:bg-yellow-600 text-white text-[11px] rounded font-semibold" title="학부모께 보낼 안내 문자를 복사해요">📩 문자 복사</button>
                      <button onClick={() => { onGoStudent(s.id); onClose(); }} className="px-2.5 py-1 bg-amber-600 hover:bg-amber-700 text-white text-[11px] rounded font-semibold">📋 안내문</button>
                      <button onClick={() => { onGoPayments(); onClose(); }} className="px-2.5 py-1 bg-rose-600 hover:bg-rose-700 text-white text-[11px] rounded font-semibold">💰 납부 현황</button>
                    </span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {items.length > 0 && (
            <div>
              <div className="text-sm font-bold text-amber-800 mb-1.5">⏰ 등록 마감 임박 — 안내 보낼 학생 ({items.length}명)</div>
              <div className="space-y-1 p-2 bg-amber-50 border border-amber-200 rounded">
                {items.map(({ s, deadline, diff, amount }) => {
                  const d = ddayLabel(diff);
                  return (
                    <div key={s.id} className="flex items-center gap-2 flex-wrap text-sm">
                      <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full border ${d.cls}`}>{d.text}</span>
                      <span className="font-bold text-gray-800">{s.name}</span>
                      <span className="text-xs text-gray-600">등록 마감일: <strong>{fmtKDate(deadline)}</strong></span>
                      <span className="ml-auto flex gap-1">
                        <button onClick={() => copyText(buildPaymentMessage(s, settings, deadline, amount))} className="px-2.5 py-1 bg-yellow-500 hover:bg-yellow-600 text-white text-[11px] rounded font-semibold" title="학부모께 보낼 안내 문자를 복사해요">📩 문자 복사</button>
                        <button onClick={() => { onGoStudent(s.id); onClose(); }} className="px-2.5 py-1 bg-amber-600 hover:bg-amber-700 text-white text-[11px] rounded font-semibold">📋 안내문 보기</button>

            안내 후 "➡️ 다음 주기로 이동"하면 마감 알림이, 납부완료 처리하면 미납 알림이 사라집니다.
          </p>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════
//  6. 학생 목록
// ═══════════════════════════════════════════════════

// ═══════════════════════════════════════════════════
//  📆 학생별 월별 일정 조회 (저장된 이력 + 현재 일정)
// ═══════════════════════════════════════════════════

function ScheduleHistoryModal({ student, settings, onClose, onUpdateStudent, startInEdit }) {
  if (!student) return null;
  const holidayMap = new Map((settings.holidays || []).map(h => [h.date, h.label]));

  // 모든 일정 항목 수집: 저장된 이력 우선, 현재 진행·계획 일정으로 보충
  const entryMap = new Map(); // 과목|날짜|종류 → 항목
  const addEntry = (e) => {
    const key = e.subjectName + '|' + e.date + '|' + (e.isMakeup ? 'm' : 's');
    if (!entryMap.has(key)) entryMap.set(key, e);
  };

  // 1) 저장된 이력 (다음 주기로 이동 시 자동 저장된 일정)
  const historySubjects = new Set(); // 일정 기록이 있는 과목 → 지난 주기는 역산 대신 기록을 신뢰
  (student.cycleHistory || []).forEach(h => {
    (h.subjects || []).forEach(hs => {
      if ((hs.schedule || []).length > 0) historySubjects.add(hs.name);
      (hs.schedule || []).forEach(s => addEntry({
        date: s.date, subjectName: hs.name, num: s.num,
        adjusted: !!s.adjusted, isExtra: !!s.isExtra, note: s.note || '',
        isMakeup: false,
        absent: (hs.absences || []).some(a => a.date === s.date),
        from: '기록', hId: h.id,
      }));
      (hs.makeups || []).forEach(m => addEntry({
        date: m.date, subjectName: hs.name, isMakeup: true, note: m.note || '', from: '기록', hId: h.id,
      }));
    });
  });

  // 2) 현재 진행·계획 일정 (실시간 계산)
  ['current', 'plan'].forEach(mode => {
    try {
      const { sessionMap } = buildSessionMap(student, settings, mode);
      sessionMap.forEach((items, date) => items.forEach(it => {
        // 지난 주기(진행)는 요일 패턴으로 역산한 추정치 — 정확한 기록이 있는 과목은 기록만 표시
        // (단, 보강은 새로 입력된 것일 수 있으니 표시 — 중복은 키로 자동 제거)
        if (mode === 'current' && historySubjects.has(it.subjectName) && !it.isMakeup) return;
        addEntry({
          date, subjectName: it.subjectName, num: it.sessionNum,
          adjusted: !!it.adjusted, isExtra: !!it.isExtra,
          note: it.isMakeup ? (it.makeupNote || '') : (it.note || ''),
          isMakeup: !!it.isMakeup, absent: !!it.absent, from: '현재',
        });
      }));
    } catch (e) { /* 일정 계산 불가 학생은 건너뜀 */ }
  });

  const entries = [...entryMap.values()];
  const byDate = new Map();
  entries.forEach(e => {
    if (!byDate.has(e.date)) byDate.set(e.date, []);
    byDate.get(e.date).push(e);
  });
  const months = [...new Set(entries.map(e => e.date.slice(0, 7)))].sort();

  const [ym, setYm] = useState(() => {
    const now = formatDateStr(new Date()).slice(0, 7);
    if (months.includes(now)) return now;
    const past = months.filter(m => m <= now);
    return past.length > 0 ? past[past.length - 1] : (months[0] || now);
  });

  // ✏️ 지난 일정 수정 모드
  const [editMode, setEditMode] = useState(!!startInEdit);
  const [selEntry, setSelEntry] = useState(null);
  const [editDate, setEditDate] = useState('');
  const [editNote, setEditNote] = useState('');
  const [addSubj, setAddSubj] = useState('');
  const [addDate, setAddDate] = useState('');
  const [addKind, setAddKind] = useState('session');
  const [addNote, setAddNote] = useState('');

  // 수정 가능한 지난 주기 목록 (이력 스냅샷의 과목들)
  const editTargets = [];
  (student.cycleHistory || []).forEach(h => {
    (h.subjects || []).forEach(hs => {
      if (hs.name) editTargets.push({ hId: h.id, name: hs.name, label: `${hs.name} (${h.periodLabel || h.yearMonth || '지난 주기'})` });
    });
  });

  const renumSchedule = (sch) => [...sch].sort((a, b) => (a.date || '').localeCompare(b.date || '')).map((s, i) => ({ ...s, num: i + 1 }));

  const updateHistory = (hId, subjName, updater) => {
    const newHist = (student.cycleHistory || []).map(h => {
      if (h.id !== hId) return h;
      return { ...h, subjects: (h.subjects || []).map(hs => hs.name === subjName ? updater(hs) : hs) };
    });
    onUpdateStudent({ cycleHistory: newHist });
  };

  const applyEdit = () => {
    const e = selEntry;
    if (!e) return;
    updateHistory(e.hId, e.subjectName, hs => {
      if (e.isMakeup) {
        return { ...hs, makeups: (hs.makeups || []).map(m => m.date === e.date ? { ...m, date: editDate || m.date, note: editNote } : m) };
      }
      let sch = (hs.schedule || []).map(s => (s.num === e.num && s.date === e.date)
        ? { ...s, date: editDate || s.date, adjusted: s.adjusted || (!!editDate && editDate !== e.date), note: editNote }
        : s);
      return { ...hs, schedule: renumSchedule(sch) };
    });
    setSelEntry(null);
  };

  const deleteEntry = () => {
    const e = selEntry;
    if (!e) return;
    if (!confirm(e.isMakeup ? '이 보강 기록을 삭제할까요?' : `${e.subjectName} ${e.num}회차 (${e.date}) 기록을 삭제할까요?`)) return;
    updateHistory(e.hId, e.subjectName, hs => {
      if (e.isMakeup) return { ...hs, makeups: (hs.makeups || []).filter(m => m.date !== e.date) };
      return { ...hs, schedule: renumSchedule((hs.schedule || []).filter(s => !(s.num === e.num && s.date === e.date))) };
    });
    setSelEntry(null);
  };

  const applyAdd = () => {
    if (!addSubj) { alert('추가할 과목(지난 주기)을 선택하세요'); return; }
    if (!addDate) { alert('날짜를 선택하세요'); return; }
    const sep = addSubj.indexOf('||');
    const hId = addSubj.slice(0, sep);
    const subjName = addSubj.slice(sep + 2);
    updateHistory(hId, subjName, hs => {
      if (addKind === 'makeup') return { ...hs, makeups: [...(hs.makeups || []), { date: addDate, note: addNote }] };
      return { ...hs, schedule: renumSchedule([...(hs.schedule || []), { num: 0, date: addDate, adjusted: false, isExtra: true, note: addNote }]) };
    });
    setAddDate(''); setAddNote('');
  };

  const clickEntry = (e) => {
    if (!editMode) return;
    if (e.from !== '기록') {
      alert('이 일정은 현재 주기(진행·계획)라 여기서 못 고쳐요.\n\n[학생 관리 → 편집 → 🖱️ 캘린더에서 일정 바로 수정]에서 고쳐주세요.\n여기서는 이미 넘긴 지난 일정만 수정합니다.');
      return;
    }
    setSelEntry(e);
    setEditDate(e.date);
    setEditNote(e.note || '');
  };
  const isSelected = (e) => selEntry && selEntry.hId === e.hId && selEntry.date === e.date && selEntry.isMakeup === e.isMakeup && selEntry.num === e.num;

  const ymIdx = months.indexOf(ym);
  const year = parseInt(ym.slice(0, 4));
  const month = parseInt(ym.slice(5, 7));
  const weeks = buildMonthWeeks(year, month);

  // 이 달 과목별 요약
  const monthEntries = entries.filter(e => e.date.slice(0, 7) === ym);
  const summary = new Map(); // 과목 → {nums:[], makeup:0, absent:0}
  monthEntries.forEach(e => {
    if (!summary.has(e.subjectName)) summary.set(e.subjectName, { nums: [], makeup: 0, absent: 0 });
    const s = summary.get(e.subjectName);
    if (e.isMakeup) s.makeup++;
    else { s.nums.push(e.num); if (e.absent) s.absent++; }
  });

  return (
    <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 overflow-y-auto" onClick={onClose}>
      <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl my-8 max-h-[90vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
        <div className="invoice-navy text-white px-5 py-3 flex items-center justify-between sticky top-0 z-10">
          <h2 className="text-base font-bold">📆 {student.name} 학생 · 월별 수강 일정</h2>
          <button onClick={onClose} className="text-white/70 hover:text-white text-2xl leading-none">×</button>
        </div>

        {months.length === 0 ? (
          <div className="p-8 text-center text-gray-400 text-sm">
            표시할 일정이 없습니다.<br />
            <span className="text-[11px]">과목에 시작일·요일이 입력되어 있어야 일정이 계산돼요.</span>
          </div>
        ) : (
          <div className="p-4">
            {/* 월 이동 */}
            <div className="flex items-center justify-center gap-2 mb-3">
              <button
                onClick={() => ymIdx > 0 && setYm(months[ymIdx - 1])}
                disabled={ymIdx <= 0}
                className={`px-3 py-1 rounded text-sm font-semibold ${ymIdx <= 0 ? 'bg-gray-100 text-gray-300' : 'bg-gray-100 hover:bg-gray-200 text-gray-700'}`}
              >◀ 이전 달</button>
              <select value={ym} onChange={(e) => setYm(e.target.value)} className="px-3 py-1 border rounded text-sm font-bold text-gray-800">
                {months.map(m => <option key={m} value={m}>{m.slice(0, 4)}년 {m.slice(5, 7)}월</option>)}
              </select>
              <button
                onClick={() => ymIdx < months.length - 1 && setYm(months[ymIdx + 1])}
                disabled={ymIdx >= months.length - 1}
                className={`px-3 py-1 rounded text-sm font-semibold ${ymIdx >= months.length - 1 ? 'bg-gray-100 text-gray-300' : 'bg-gray-100 hover:bg-gray-200 text-gray-700'}`}
              >다음 달 ▶</button>
              {editTargets.length > 0 && (
                <button
                  onClick={() => { setEditMode(!editMode); setSelEntry(null); }}
                  className={`px-3 py-1 rounded text-sm font-semibold ${editMode ? 'bg-purple-600 text-white' : 'bg-purple-100 hover:bg-purple-200 text-purple-700'}`}
                  title="다음 주기로 넘긴 뒤에도 지난 일정을 고칠 수 있어요"
                >✏️ {editMode ? '수정 끝내기' : '지난 일정 수정'}</button>
              )}
            </div>

            {/* 수정 모드: 선택 편집 패널 */}
            {editMode && selEntry && (
              <div className="mb-2 p-2 rounded border-2 border-purple-400 bg-purple-50 flex items-center gap-2 flex-wrap">
                <span className="text-xs font-bold text-purple-900">
                  {selEntry.isMakeup ? `🔵 ${selEntry.subjectName} 보강` : `📌 ${selEntry.subjectName} ${selEntry.num}회차`} · {selEntry.date}
                </span>
                <span className="flex items-center gap-1">
                  <span className="text-[11px] text-gray-600">날짜:</span>
                  <input type="date" value={editDate} onChange={(e) => setEditDate(e.target.value)} className="px-1.5 py-0.5 border rounded text-xs" />
                </span>
                <span className="flex items-center gap-1 flex-1 min-w-[140px]">
                  <span className="text-[11px] text-gray-600">사유:</span>
                  <input type="text" value={editNote} onChange={(e) => setEditNote(e.target.value)} placeholder="예: 제헌절 휴원" className="flex-1 px-1.5 py-0.5 border rounded text-xs" />
                </span>
                <span className="flex gap-1">
                  <button onClick={applyEdit} className="px-2 py-1 bg-purple-600 text-white text-[11px] rounded font-semibold">저장</button>
                  <button onClick={deleteEntry} className="px-2 py-1 bg-rose-600 text-white text-[11px] rounded font-semibold">🗑️ 삭제</button>
                  <button onClick={() => setSelEntry(null)} className="px-2 py-1 bg-gray-300 text-gray-700 text-[11px] rounded">취소</button>
                </span>
              </div>
            )}

            {/* 수정 모드: 지난 회차·보강 추가 */}
            {editMode && (
              <div className="mb-2 p-2 bg-purple-50 border border-purple-200 rounded">
                {!selEntry && (
                  <div className="text-[11px] text-purple-700 mb-1.5">💡 달력에서 <strong>기록된 회차를 클릭</strong>하면 날짜·사유를 고치거나 삭제할 수 있어요. 빠진 수업은 아래에서 추가하세요.</div>
                )}
                <div className="flex items-center gap-1.5 flex-wrap">
                  <span className="text-[11px] font-semibold text-purple-800">➕ 지난 일정 추가:</span>
                  <select value={addSubj} onChange={(e) => setAddSubj(e.target.value)} className="px-1.5 py-1 border rounded text-xs">
                    <option value="">과목(주기) 선택</option>
                    {editTargets.map((t, i) => <option key={i} value={t.hId + '||' + t.name}>{t.label}</option>)}
                  </select>
                  <select value={addKind} onChange={(e) => setAddKind(e.target.value)} className="px-1.5 py-1 border rounded text-xs">
                    <option value="session">수업 회차</option>
                    <option value="makeup">🔵 보강</option>
                  </select>
                  <input type="date" value={addDate} onChange={(e) => setAddDate(e.target.value)} className="px-1.5 py-1 border rounded text-xs" />
                  <input type="text" value={addNote} onChange={(e) => setAddNote(e.target.value)} placeholder="사유 (선택)" className="flex-1 min-w-[100px] px-1.5 py-1 border rounded text-xs" />
                  <button onClick={applyAdd} className="px-2.5 py-1 bg-purple-600 hover:bg-purple-700 text-white text-[11px] rounded font-semibold">추가</button>
                </div>
              </div>
            )}

            {/* 달력 */}
            <div className="grid grid-cols-7 gap-px bg-gray-300 border border-gray-300">
              {DAY_NAMES_KO.map((day, i) => (
                <div key={i} className="bg-gray-100 text-center text-[11px] font-semibold py-1" style={{ color: i === 0 ? '#dc2626' : i === 6 ? '#2563eb' : '#374151' }}>{day}</div>
              ))}
              {weeks.flat().map((date, idx) => {
                const dstr = formatDateStr(date);
                const isCurrentMonth = date.getMonth() === month - 1;
                const holiday = holidayMap.get(dstr);
                const dayEntries = (byDate.get(dstr) || []).slice().sort((a, b) => (a.subjectName || '').localeCompare(b.subjectName || '', 'ko'));
                return (
                  <div key={idx} className="flex flex-col items-center px-0.5 py-1 min-h-[56px] text-center" style={{ background: !isCurrentMonth ? '#f3f4f6' : holiday ? '#FEE2E2' : 'white', opacity: isCurrentMonth ? 1 : 0.4 }}>
                    <div className="text-[11px] leading-none" style={{ color: holiday ? '#dc2626' : date.getDay() === 0 ? '#dc2626' : date.getDay() === 6 ? '#2563eb' : '#111827', fontWeight: holiday ? 700 : 500 }}>{date.getDate()}</div>
                    {holiday && isCurrentMonth && <div className="text-[8px] text-red-600 font-bold leading-tight">{holiday}</div>}
                    {isCurrentMonth && dayEntries.map((e, i) => {
                      const color = resolveSubjectColor(e.subjectName, settings);
                      const clickable = editMode && e.from === '기록';
                      const selCls = isSelected(e) ? ' ring-2 ring-purple-500' : '';
                      if (e.isMakeup) {
                        return (
                          <React.Fragment key={i}>
                            <div onClick={() => clickEntry(e)} className={`text-[9px] font-extrabold leading-tight rounded px-0.5 mt-px${clickable ? ' cursor-pointer hover:opacity-70' : ''}${selCls}`} style={{ background: '#cffafe', color: '#0891b2' }}>🔵{e.subjectName}보강</div>
                            {e.note && <div className="text-[7px] leading-tight" style={{ color: '#0e7490', wordBreak: 'keep-all' }}>{e.note}</div>}
                          </React.Fragment>
                        );
                      }
                      return (
                        <React.Fragment key={i}>
                          <div onClick={() => clickEntry(e)} className={`text-[9px] font-extrabold leading-tight rounded px-0.5 mt-px${clickable ? ' cursor-pointer hover:opacity-70' : ''}${selCls}`} style={{ background: color.bg, color: e.absent ? '#dc2626' : color.badge, textDecoration: e.absent ? 'line-through' : 'none' }}>
                            {e.adjusted && '↪'}{e.isExtra && '➕'}{e.subjectName}{e.num}{e.absent && '결'}
                          </div>
                          {e.note && <div className="text-[7px] text-gray-500 leading-tight" style={{ wordBreak: 'keep-all' }}>{e.note}</div>}
                        </React.Fragment>
                      );
                    })}
                  </div>
                );
              })}
            </div>

            {/* 이 달 요약 */}
            {summary.size > 0 && (
              <div className="mt-3 p-3 bg-gray-50 border rounded">
                <div className="text-xs font-bold text-gray-700 mb-1.5">📊 {year}년 {String(month).padStart(2, '0')}월 요약</div>
                {[...summary.entries()].sort((a, b) => a[0].localeCompare(b[0], 'ko')).map(([name, s]) => {
                  const color = resolveSubjectColor(name, settings);
                  const nums = s.nums.sort((a, b) => a - b);
                  return (
                    <div key={name} className="flex items-center justify-between text-[11px] py-0.5">
                      <span className="font-bold" style={{ color: color.badge }}>{name}</span>
                      <span className="text-gray-600">
                        {nums.length}회 {nums.length > 0 && `(${nums.join('·')}회차)`}
                        {s.makeup > 0 && <span className="text-cyan-700 ml-1.5">보강 {s.makeup}회</span>}
                        {s.absent > 0 && <span className="text-rose-600 ml-1.5">결석 {s.absent}회</span>}
                      </span>
                    </div>
                  );
                })}
              </div>
            )}

            <p className="text-[10px] text-gray-400 mt-2 leading-relaxed">
              💡 지난 일정은 <strong>"➡️ 다음 주기로 이동"을 누른 시점의 실제 일정</strong>(이동·추가·삭제·사유 포함)이 자동 저장된 것입니다.
              이번 업데이트 이전에 넘긴 주기는 일정 기록이 없어 요일 패턴으로만 표시될 수 있어요.
            </p>
          </div>
        )}
      </div>
    </div>
  );
}
