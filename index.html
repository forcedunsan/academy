//  4. 회차 일정 미리보기 / 휴일 관리 컴포넌트
// ═══════════════════════════════════════════════════

function SchedulePreview({ subject, holidays, cycleHistory }) {
  const [expanded, setExpanded] = useState(false);
  if (!subject.startDate || !subject.classDays || subject.classDays.length === 0 || !subject.totalSessions) {
    return null;
  }
  const holidaySet = new Set((holidays || []).map(h => h.date));
  const holOpts = { holidaySet, classDays: subject.classDays, skipHolidays: subject.skipHolidays };
  const newStart = parseDate(subject.startDate);
  const newStartStr = formatDateStr(newStart);

  // 계획 주기 (이번 청구): 자동 계산 + 일정 변경(이동·추가·삭제·휴원일 자동 이동) 반영
  const planSessions = getClassSessions(newStart, subject.classDays, subject.totalSessions, holidaySet, subject.skipHolidays);
  let planFinals = [];
  if (planSessions.length > 0) {
    const cs = formatDateStr(planSessions[0].date);
    const ce = formatDateStr(planSessions[planSessions.length - 1].date);
    planFinals = applyScheduleAdjustments(planSessions, subject.adjustments, { cycleStartStr: cs, cycleEndStr: ce, addFrom: newStartStr, addTo: '', ...holOpts }).finals;
  }
  const planDateStrs = planFinals.map(f => f.dateStr).sort();
  const planStart = planDateStrs.length > 0 ? parseDate(planDateStrs[0]) : null;
  const planEnd = planDateStrs.length > 0 ? parseDate(planDateStrs[planDateStrs.length - 1]) : null;
  const planComplete = planSessions.length === subject.totalSessions;

  // 다음 주기 (등록 마감일 계산용) — 변경 반영된 실제 마지막 수업일 기준
  const nextNextStart = planEnd ? getNextClassDay(planEnd, subject.classDays, holidaySet) : null;

  // 진행 주기 (지난 주기): 저장된 실제 기록이 있으면 기록 기준, 없으면 역산 + 일정 변경 반영
  const prevDays = (subject.prevClassDays && subject.prevClassDays.length > 0) ? subject.prevClassDays : subject.classDays;
  const prevTotal = subject.prevTotalSessions || subject.totalSessions;
  let histSubj = null;
  {
    const hists = cycleHistory || [];
    for (let i = hists.length - 1; i >= 0; i--) {
      const hs = (hists[i].subjects || []).find(x => x.name === subject.name && (x.schedule || []).length > 0);
      if (hs) { histSubj = hs; break; }
    }
  }
  let currentFinals = [];
  if (histSubj) {
    currentFinals = histSubj.schedule.filter(s => s.date).map(s => ({ dateStr: s.date, num: s.num, adjusted: !!s.adjusted, isExtra: !!s.isExtra, note: s.note || '' }));
  } else if (!subject.isNew) {
    const currentSessions = getPreviousCycleSessions(newStart, prevDays, prevTotal, holidaySet, subject.skipHolidays);
    if (currentSessions.length > 0) {
      const cs = formatDateStr(currentSessions[0].date);
      const ce = formatDateStr(currentSessions[currentSessions.length - 1].date);
      currentFinals = applyScheduleAdjustments(currentSessions, subject.adjustments, { cycleStartStr: cs, cycleEndStr: ce, addFrom: cs, addTo: formatDateStr(addDays(newStart, -1)), ...holOpts, classDays: prevDays }).finals;
    }
  }
  const currentDateStrs = currentFinals.map(f => f.dateStr).sort();
  const currentStart = currentDateStrs.length > 0 ? parseDate(currentDateStrs[0]) : null;
  const currentEnd = currentDateStrs.length > 0 ? parseDate(currentDateStrs[currentDateStrs.length - 1]) : null;

  return (
    <div className="mt-3 p-3 bg-blue-50 border border-blue-200 rounded text-xs">
      <div className="flex items-center justify-between gap-2 mb-2">
        <span className="text-gray-700 font-semibold">📅 자동 계산 결과</span>
        <button
          onClick={() => setExpanded(!expanded)}
          className="text-blue-600 hover:underline"
        >
          {expanded ? '회차 목록 숨기기 ▲' : '회차 목록 보기 ▼'}
        </button>
      </div>

      {/* 진행 캘린더 (지난 주기) */}
      <div className="mb-2 p-2 bg-amber-50 border border-amber-200 rounded">
        <div className="flex items-center gap-2 mb-0.5">
          <span className="font-bold text-amber-700">📅 진행 캘린더 (지난 주기)</span>
          {histSubj && (
            <span className="text-[10px] text-amber-600 bg-amber-100 px-1.5 py-0.5 rounded">📜 저장된 기록 기준 · 아래 [📜 지난 일정 수정하기] 버튼으로 수정</span>
          )}
          {subject.isNew && (
            <span className="text-amber-600 bg-amber-100 px-1.5 py-0.5 rounded text-[10px]">
              🆕 신규 등록 → 진행 캘린더 생성 안 됨
            </span>
          )}
        </div>
        {!subject.isNew && currentStart && (
          <div className="text-amber-900">
            <span className="font-bold">{fmtKDate(currentStart)}</span>
            <span className="mx-1 text-amber-500">~</span>
            <span className="font-bold">{fmtKDate(currentEnd)}</span>
            <span className="ml-2 text-amber-700">({currentFinals.length}회차)</span>
          </div>
        )}
      </div>

      {/* 계획 캘린더 (이번 청구) */}
      <div className="mb-2 p-2 bg-rose-50 border border-rose-200 rounded">
        <div className="flex items-center gap-2 mb-0.5">
          <span className="font-bold text-rose-700">📆 계획 캘린더 (이번 청구 대상)</span>
          <span className="text-[10px] text-rose-600 bg-rose-100 px-1.5 py-0.5 rounded font-semibold">
            💰 수강료 청구 주기
          </span>
        </div>
        {planStart && (
          <>
            <div className="text-rose-900">
              <span className="font-bold">{fmtKDate(planStart)}</span>
              <span className="mx-1 text-rose-500">~</span>
              <span className="font-bold">{fmtKDate(planEnd)}</span>
              <span className="ml-2 text-rose-700">(총 {planFinals.length}회차 · 주 {subject.classDays.length}회)</span>
              {!planComplete && (
                <span className="ml-2 text-orange-600 font-semibold">
                  ⚠️ {subject.totalSessions}회 중 {planSessions.length}회만 계산됨
                </span>
              )}
            </div>
            {nextNextStart && (
              <div className="text-rose-700 mt-0.5">
                🔜 익월 등록 주기 시작: <span className="font-semibold">{fmtKDate(nextNextStart)}</span>
              </div>
            )}
          </>
        )}
      </div>

      {/* 회차 목록 */}
      {expanded && (
        <>
          {!subject.isNew && currentFinals.length > 0 && (
            <div className="mb-2">
              <div className="text-[10px] text-amber-700 font-semibold mb-1">진행 캘린더 회차:</div>
              <div className="grid grid-cols-3 md:grid-cols-4 gap-1">
                {currentFinals.map((f) => (
                  <div key={f.num} className="bg-amber-100 border border-amber-200 rounded px-1.5 py-0.5 text-[11px]">
                    <span className="text-amber-600">{f.num}회차</span>
                    <span className="ml-1 font-semibold text-amber-900">
                      {(f.adjusted || f.holidayShifted) && '↪'}{f.isExtra && '➕'}{f.dateStr.slice(5, 7)}/{f.dateStr.slice(8, 10)}
                    </span>
                    <span className="ml-0.5 text-amber-500 text-[10px]">({DAY_NAMES_KO[parseDate(f.dateStr).getDay()]})</span>
                  </div>
                ))}
              </div>
            </div>
          )}
          {planFinals.length > 0 && (
            <div>
              <div className="text-[10px] text-rose-700 font-semibold mb-1">계획 캘린더 회차:</div>
              <div className="grid grid-cols-3 md:grid-cols-4 gap-1">
                {planFinals.map((f) => (
                  <div key={f.num} className="bg-rose-100 border border-rose-200 rounded px-1.5 py-0.5 text-[11px]">
                    <span className="text-rose-600">{f.num}회차</span>
                    <span className="ml-1 font-semibold text-rose-900">
                      {(f.adjusted || f.holidayShifted) && '↪'}{f.isExtra && '➕'}{f.dateStr.slice(5, 7)}/{f.dateStr.slice(8, 10)}
                    </span>
                    <span className="ml-0.5 text-rose-500 text-[10px]">({DAY_NAMES_KO[parseDate(f.dateStr).getDay()]})</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

function HolidaysManager({ holidays, onChange }) {
  const [startDate, setStartDate] = useState('');
  const [endDate, setEndDate] = useState('');
  const [label, setLabel] = useState('');

  const add = () => {
    if (!startDate) return;
    const start = parseDate(startDate);
    const end = endDate ? parseDate(endDate) : start;
    if (!start || !end || end < start) return;
    const existing = new Set(holidays.map(h => h.date));
    const toAdd = [];
    let cur = new Date(start);
    while (cur <= end) {
      const dstr = formatDateStr(cur);
      if (!existing.has(dstr)) toAdd.push({ date: dstr, label: label || '휴일' });
      cur = addDays(cur, 1);
    }
    const updated = [...holidays, ...toAdd].sort((a, b) => a.date.localeCompare(b.date));
    onChange(updated);
    setStartDate('');
    setEndDate('');
    setLabel('');
  };

  const remove = (i) => onChange(holidays.filter((_, idx) => idx !== i));

  return (
    <div>
      <div className="flex gap-2 items-end flex-wrap mb-2">
        <div className="flex-1 min-w-[120px]">
          <label className="block text-[11px] text-gray-600 mb-0.5">시작일</label>
          <input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} className="input" />
        </div>
        <span className="text-gray-400 pb-2">~</span>
        <div className="flex-1 min-w-[120px]">
          <label className="block text-[11px] text-gray-600 mb-0.5">끝일 (선택)</label>
          <input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)} className="input" />
        </div>
        <div className="flex-1 min-w-[100px]">
          <label className="block text-[11px] text-gray-600 mb-0.5">라벨</label>
          <input type="text" value={label} onChange={(e) => setLabel(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && add()} className="input" placeholder="예: 설, 추석, 휴원" />
        </div>
        <button onClick={add} className="px-4 py-1.5 bg-green-600 text-white rounded text-sm font-semibold">+ 추가</button>
      </div>
      {holidays.length > 0 ? (
        <div className="flex flex-wrap gap-1 max-h-40 overflow-y-auto p-2 bg-gray-50 border rounded">
          {holidays.map((h, i) => (
            <span key={i} className="inline-flex items-center gap-1 bg-red-50 border border-red-200 rounded px-2 py-0.5 text-xs">
              <span className="text-gray-700 font-medium">{h.date}</span>
              <span className="text-red-600 font-semibold">{h.label}</span>
              <button onClick={() => remove(i)} className="text-red-400 hover:text-red-700 ml-0.5 text-base leading-none">×</button>
            </span>
          ))}
        </div>
      ) : (
        <div className="text-xs text-gray-400 italic">등록된 휴일 없음</div>
      )}
      <p className="text-[11px] text-gray-500 mt-2 leading-relaxed">
        💡 여기 등록한 날짜는 <strong>모든 학생의 회차 계산에서 자동 제외</strong>됩니다.<br/>
        공휴일(설·추석·어린이날 등), 학원 전체 휴원일 등록에 사용하세요.<br/>
        개별 학생 결석은 학생 편집에서 별도로 처리하면 됩니다.
      </p>
    </div>
  );
}

function SubjectColorsManager({ subjectColors, onChange, students }) {
  const [newName, setNewName] = useState('');

  // 등록된 과목 목록 + 학생 데이터에 있지만 등록 안 된 과목 자동 감지
  const usedSubjectNames = new Set();
  (students || []).forEach(s => (s.subjects || []).forEach(sub => {
    if (sub.name) usedSubjectNames.add(sub.name);
  }));
  const unregistered = Array.from(usedSubjectNames).filter(n => !subjectColors[n]);

  const add = () => {
    if (!newName.trim()) return;
    if (subjectColors[newName]) { alert('이미 등록된 과목명입니다'); return; }
    onChange({ ...subjectColors, [newName]: COLOR_PRESETS[0] });
    setNewName('');
  };

  const remove = (name) => {
    const { [name]: _, ...rest } = subjectColors;
    onChange(rest);
  };

  const updateColor = (name, preset) => {
    onChange({ ...subjectColors, [name]: preset });
  };

  const rename = (oldName, newName) => {
    if (!newName.trim() || oldName === newName) return;
    if (subjectColors[newName]) { alert('이미 등록된 과목명입니다'); return; }
    const entries = Object.entries(subjectColors);
    const newColors = {};
    for (const [k, v] of entries) {
      newColors[k === oldName ? newName : k] = v;
    }
    onChange(newColors);
  };

  return (
    <div>
      {/* 등록된 과목 목록 */}
      <div className="space-y-2 mb-3">
        {Object.entries(subjectColors).map(([name, color]) => (
          <SubjectColorRow
            key={name}
            name={name}
            color={color}
            onRename={(newName) => rename(name, newName)}
            onColorChange={(preset) => updateColor(name, preset)}
            onRemove={() => remove(name)}
          />
        ))}
        {Object.keys(subjectColors).length === 0 && (
          <div className="text-xs text-gray-400 italic p-3 text-center border border-dashed rounded">
            등록된 과목이 없습니다
          </div>
        )}
      </div>

      {/* 새 과목 추가 */}
      <div className="flex gap-2 items-center mb-2">
        <input
          type="text"
          value={newName}
          onChange={(e) => setNewName(e.target.value)}
          onKeyDown={(e) => e.key === 'Enter' && add()}
          placeholder="새 과목명 (예: 영어, 고등 수학, 내신 국어)"
          className="flex-1 px-2 py-1.5 border rounded text-sm"
        />
        <button onClick={add} className="px-3 py-1.5 bg-blue-600 text-white rounded text-sm font-semibold">+ 과목 추가</button>
      </div>

      {/* 학생 데이터엔 있지만 미등록인 과목 감지 */}
      {unregistered.length > 0 && (
        <div className="mt-3 p-2 bg-amber-50 border border-amber-300 rounded text-xs">
          <div className="font-semibold text-amber-800 mb-1">⚠️ 학생 등록 과목 중 색상 미지정:</div>
          <div className="flex flex-wrap gap-1">
            {unregistered.map(name => (
              <button
                key={name}
                onClick={() => onChange({ ...subjectColors, [name]: COLOR_PRESETS[Math.floor(Math.random() * COLOR_PRESETS.length)] })}
                className="px-2 py-0.5 bg-white border border-amber-400 rounded text-amber-800 hover:bg-amber-100"
              >
                + {name}
              </button>
            ))}
          </div>
          <div className="text-amber-700 mt-1">클릭하면 임의 색으로 바로 추가됩니다</div>
        </div>
      )}

      <p className="text-[11px] text-gray-500 mt-3 leading-relaxed">
        💡 등록한 과목명과 <strong>일치하거나 포함된 이름</strong>을 자동으로 매칭합니다.<br/>
        예) "영어"를 등록하면 학생 과목 "고등 영어", "중등 영어" 모두 이 색으로 표시됩니다.
      </p>
    </div>
  );
}

function SubjectColorRow({ name, color, onRename, onColorChange, onRemove }) {
  const [editing, setEditing] = useState(false);
  const [editName, setEditName] = useState(name);

  return (
    <div className="flex items-center gap-2 p-2 border rounded bg-gray-50">
      {/* 미리보기 */}
      <div
        style={{
          background: color.bg,
          color: color.badge,
          fontWeight: 800,
          padding: '4px 10px',
          borderRadius: '4px',
          fontSize: '12px',
          border: `2px solid ${color.badge}`,
          minWidth: '60px',
          textAlign: 'center',
        }}
      >
        {name}1
      </div>

      {/* 과목명 (편집 가능) */}
      {editing ? (
        <input
          type="text"
          value={editName}
          onChange={(e) => setEditName(e.target.value)}
          onBlur={() => { if (editName !== name) onRename(editName); setEditing(false); }}
          onKeyDown={(e) => { if (e.key === 'Enter') { if (editName !== name) onRename(editName); setEditing(false); } }}
          className="flex-1 px-2 py-1 border rounded text-sm"
          autoFocus
        />
      ) : (
        <button onClick={() => { setEditName(name); setEditing(true); }} className="flex-1 text-left text-sm font-medium text-gray-800 hover:underline px-2">
          {name}
        </button>
      )}

      {/* 색상 선택 */}
      <div className="flex gap-0.5 flex-wrap">
        {COLOR_PRESETS.map((preset, i) => (
          <button
            key={i}
            onClick={() => onColorChange(preset)}
            title={preset.name}
            style={{
              background: preset.bg,
              border: color.badge === preset.badge ? `2px solid ${preset.badge}` : '1px solid #d1d5db',
              width: '22px',
              height: '22px',
              borderRadius: '3px',
              cursor: 'pointer',
            }}
          >
            <span style={{ fontSize: '10px', color: preset.badge, fontWeight: 700 }}>
              {color.badge === preset.badge ? '✓' : ''}
            </span>
          </button>
        ))}
      </div>

      <button onClick={onRemove} className="text-red-400 hover:text-red-600 px-1 text-base leading-none" title="삭제">×</button>
    </div>
  );
}

function TuitionPresetsManager({ presets, onChange }) {
  const [editingId, setEditingId] = useState(null);

  const blankPreset = () => ({
    id: `preset-${Date.now()}`,
    name: '',
    subjectName: '',
    label: '',
    classDays: [1, 3, 5],
    totalSessions: 12,
    tuition: 0,
    materialLabel: '',
    materialAmount: 0,
  });

  const addPreset = () => {
    const p = blankPreset();
    onChange([...(presets || []), p]);
    setEditingId(p.id);
  };

  const updatePreset = (id, patch) => {
    onChange((presets || []).map(p => p.id === id ? { ...p, ...patch } : p));
  };

  const removePreset = (id) => {
    if (!confirm('이 프리셋을 삭제할까요?')) return;
    onChange((presets || []).filter(p => p.id !== id));
    if (editingId === id) setEditingId(null);
  };

  const toggleClassDay = (id, dow) => {
    const p = (presets || []).find(x => x.id === id);
    if (!p) return;
    const days = p.classDays || [];
    const newDays = days.includes(dow) ? days.filter(d => d !== dow) : [...days, dow].sort((a, b) => a - b);
    updatePreset(id, { classDays: newDays });
  };

  return (
    <div>
      <div className="space-y-2 mb-3">
        {(presets || []).length === 0 && (
          <div className="text-xs text-gray-400 italic p-3 text-center border border-dashed rounded">
            등록된 프리셋이 없습니다. "+ 새 프리셋 추가"로 만들어보세요.
          </div>
        )}
        {(presets || []).map((p) => (
          <div key={p.id} className="border rounded-lg bg-gray-50">
            {/* 요약 보기 (편집 중이 아닐 때) */}
            {editingId !== p.id ? (
              <div className="p-3 flex items-center gap-2 flex-wrap">
                <div className="flex-1 min-w-0">
                  <div className="font-semibold text-gray-800 text-sm">
                    {p.name || <span className="text-gray-400 italic">(이름 없음)</span>}
                  </div>
                  <div className="text-[11px] text-gray-600 mt-0.5">
                    {p.subjectName && <span className="mr-2">과목: <strong>{p.subjectName}</strong></span>}
                    <span className="mr-2">요일: {(p.classDays || []).map(d => DAY_NAMES_KO[d]).join('·') || '-'}</span>
                    <span className="mr-2">{p.totalSessions || 0}회</span>
                    <span className="text-blue-700 font-semibold">{fmtWon(p.tuition || 0)}</span>
                    {p.materialLabel && (
                      <span className="ml-2 text-gray-500">+ {p.materialLabel} {fmtWon(p.materialAmount || 0)}</span>
                    )}
                  </div>
                </div>
                <button onClick={() => setEditingId(p.id)} className="px-2 py-1 text-xs bg-gray-200 hover:bg-gray-300 rounded">편집</button>
                <button onClick={() => removePreset(p.id)} className="px-2 py-1 text-xs text-red-600 hover:bg-red-50 rounded">삭제</button>
              </div>
            ) : (
              <div className="p-3 space-y-2 bg-blue-50 border-2 border-blue-300 rounded-lg">
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-[11px] text-gray-700 font-semibold mb-0.5">프리셋 이름 (드롭다운 표시용)</label>
                    <input
                      type="text"
                      value={p.name || ''}
                      onChange={(e) => updatePreset(p.id, { name: e.target.value })}
                      placeholder="예: 고등 영어 · 주 3회"
                      className="w-full px-2 py-1 border rounded text-sm"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] text-gray-700 font-semibold mb-0.5">과목명 (색상 매칭)</label>
                    <input
                      type="text"
                      value={p.subjectName || ''}
                      onChange={(e) => updatePreset(p.id, { subjectName: e.target.value })}
                      placeholder="예: 영어"
                      className="w-full px-2 py-1 border rounded text-sm"
                    />
                  </div>
                </div>
                <div>
                  <label className="block text-[11px] text-gray-700 font-semibold mb-0.5">라벨 (안내문에 표시될 이름, 선택)</label>
                  <input
                    type="text"
                    value={p.label || ''}
                    onChange={(e) => updatePreset(p.id, { label: e.target.value })}
                    placeholder="예: 고등 영어"
                    className="w-full px-2 py-1 border rounded text-sm"
                  />
                </div>
                <div>
                  <label className="block text-[11px] text-gray-700 font-semibold mb-0.5">수업 요일</label>
                  <div className="flex gap-1 flex-wrap">
                    {DAY_NAMES_KO.map((day, i) => (
                      <button
                        key={i}
                        onClick={() => toggleClassDay(p.id, i)}
                        className={`px-2.5 py-1 rounded text-xs font-medium ${(p.classDays || []).includes(i) ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-600'}`}
                      >
                        {day}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block text-[11px] text-gray-700 font-semibold mb-0.5">총 회차</label>
                    <input
                      type="number"
                      min="1"
                      value={p.totalSessions || 12}
                      onChange={(e) => updatePreset(p.id, { totalSessions: parseInt(e.target.value) || 12 })}
                      className="w-full px-2 py-1 border rounded text-sm"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] text-gray-700 font-semibold mb-0.5">월 수강료 (원)</label>
                    <input
                      type="number"
                      min="0"
                      step="1000"
                      value={p.tuition || 0}
                      onChange={(e) => updatePreset(p.id, { tuition: parseInt(e.target.value) || 0 })}
                      className="w-full px-2 py-1 border rounded text-sm"
                    />
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-2 pt-1 border-t border-blue-200">
                  <div>
                    <label className="block text-[11px] text-gray-700 font-semibold mb-0.5">교재비 항목명 (선택)</label>
                    <input
                      type="text"
                      value={p.materialLabel || ''}
                      onChange={(e) => updatePreset(p.id, { materialLabel: e.target.value })}
                      placeholder="예: 영어 교재비"
                      className="w-full px-2 py-1 border rounded text-sm"
                    />
                  </div>
                  <div>
                    <label className="block text-[11px] text-gray-700 font-semibold mb-0.5">교재비 금액 (원)</label>
                    <input
                      type="number"
                      min="0"
                      step="1000"
                      value={p.materialAmount || 0}
                      onChange={(e) => updatePreset(p.id, { materialAmount: parseInt(e.target.value) || 0 })}
                      className="w-full px-2 py-1 border rounded text-sm"
                    />
                  </div>
                </div>
                <div className="flex justify-end gap-2 pt-1">
                  <button onClick={() => removePreset(p.id)} className="px-3 py-1 text-xs text-red-600 hover:bg-red-50 rounded">삭제</button>
                  <button onClick={() => setEditingId(null)} className="px-4 py-1 bg-blue-600 text-white rounded text-xs font-semibold">완료</button>
                </div>
              </div>
            )}
          </div>
        ))}
      </div>
      <button onClick={addPreset} className="w-full px-3 py-2 bg-green-600 text-white rounded text-sm font-semibold hover:bg-green-700">
        + 새 프리셋 추가
      </button>
      <p className="text-[11px] text-gray-500 mt-3 leading-relaxed">
        💡 프리셋을 만들어두면 학생 추가 시 드롭다운에서 선택만으로 <strong>과목·요일·수강료·교재비까지 한 번에 입력</strong>됩니다.<br/>
        자주 쓰는 조합(예: "고등 영어 주 3회", "중등 수학 주 2회")을 미리 등록해두세요.
      </p>
    </div>
  );
}

function AbsenceManager({ subjectId, subjectName, absences, onAdd, onRemove }) {
  const [date, setDate] = useState('');
  const [note, setNote] = useState('');

  const handleAdd = () => {
    if (!date) return;
    if (absences.some(a => a.date === date)) {
      alert('이미 등록된 결석 날짜입니다');
      return;
    }
    onAdd(date, note);
    setDate('');
    setNote('');
  };

  return (
    <div className="mt-2 p-2 bg-red-50 border border-red-200 rounded">
      <div className="flex items-center justify-between mb-1.5">
        <span className="text-xs font-semibold text-red-700">🚫 {subjectName} 개별 결석 기록 (진행 캘린더에 표시됨)</span>
        <span className="text-[10px] text-red-500">{absences.length}건</span>
      </div>
      <div className="flex gap-1 items-center flex-wrap">
        <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="flex-1 min-w-[120px] px-2 py-1 border rounded text-xs" />
        <input type="text" value={note} onChange={(e) => setNote(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleAdd()} placeholder="사유 (선택)" maxLength={15} className="flex-1 min-w-[80px] px-2 py-1 border rounded text-xs" />
        <button onClick={handleAdd} className="px-2 py-1 bg-red-600 text-white rounded text-xs font-medium">+ 결석</button>
      </div>
      {absences.length > 0 && (
        <div className="mt-1.5 flex flex-wrap gap-1">
          {absences.map((a, i) => (
            <span key={i} className="inline-flex items-center gap-1 bg-white border border-red-300 rounded px-1.5 py-0.5 text-[11px]">
              <span className="font-medium text-gray-700">{a.date.substring(5)}</span>
              {a.note && <span className="text-red-600 text-[10px]">({a.note})</span>}
              <button onClick={() => onRemove(a.date)} className="text-red-400 hover:text-red-700 leading-none ml-0.5">×</button>
            </span>
          ))}
        </div>
      )}
      <p className="text-[10px] text-red-500/70 mt-1">
        💡 결석 처리해도 <strong>회차 번호는 유지</strong>됩니다 (학부모께 "8회차 결석"이라고 정확히 표시)
      </p>
    </div>
  );
}

// 휴원일 무시 관리자 (학원 휴원일이지만 이 과목은 수업 진행)
function SkipHolidayManager({ subject, holidays, onUpdate }) {
  const skipList = subject.skipHolidays || [];
  const holidayList = (holidays || []).slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  
  const toggleSkip = (date) => {
    if (skipList.includes(date)) {
      onUpdate(skipList.filter(d => d !== date));
    } else {
      onUpdate([...skipList, date]);
    }
  };
  
  if (holidayList.length === 0) {
    return (
      <div className="border-2 border-orange-200 rounded-lg p-3 bg-orange-50/30">
        <div className="text-xs font-semibold text-orange-700 mb-1">📌 휴원일 무시 (이 과목만 수업한 날)</div>
        <p className="text-[11px] text-gray-500">등록된 학원 휴원일이 없습니다. ⚙️ 학원 정보 탭에서 휴원일을 추가하면 여기서 과목별로 무시 처리할 수 있어요.</p>
      </div>
    );
  }
  
  return (
    <div className="border-2 border-orange-200 rounded-lg overflow-hidden">
      <div className="px-3 py-2 bg-orange-50">
        <div className="text-xs font-semibold text-orange-700">📌 휴원일 무시 (이 과목만 수업한 날)</div>
        <div className="text-[11px] text-orange-600 mt-0.5">
          체크한 날짜는 이 과목에 한해 <strong>수업한 것으로 처리</strong>되어 회차에 포함됩니다.
        </div>
      </div>
      <div className="p-3 space-y-1.5 max-h-48 overflow-y-auto bg-white">
        {holidayList.map((h, i) => {
          const isSkipped = skipList.includes(h.date);
          return (
            <label key={i} className={`flex items-center gap-2 p-2 rounded cursor-pointer text-xs ${isSkipped ? 'bg-orange-100 border border-orange-300' : 'bg-gray-50 hover:bg-gray-100'}`}>
              <input
                type="checkbox"
                checked={isSkipped}
                onChange={() => toggleSkip(h.date)}
                className="w-4 h-4"
              />
              <span className="font-mono text-gray-700">{h.date}</span>
              {h.name && <span className="text-gray-500">({h.name})</span>}
              {isSkipped && <span className="ml-auto text-[10px] font-bold text-orange-700">✅ 수업함</span>}
            </label>
          );
        })}
      </div>
      {skipList.length > 0 && (
        <div className="px-3 py-2 bg-orange-50 border-t border-orange-200 text-[11px] text-orange-700">
          이 과목은 위 {skipList.length}일의 휴원일을 무시하고 정상 수업으로 처리합니다.
        </div>
      )}
    </div>
  );
}

// 회차 일정 변경 관리자 (수정/추가/삭제 모두 지원 - 진행/계획 모두 가능)
function ScheduleAdjustmentManager({ subject, holidays, onUpdate }) {
  const [mode, setMode] = useState(null); // null | 'modify' | 'add' | 'delete'
  const [originalDate, setOriginalDate] = useState(''); // 수정/삭제할 원래 날짜
  const [newDate, setNewDate] = useState('');
  const [note, setNote] = useState('');
  
  const adjustments = subject.adjustments || [];
  const holidaySet = new Set((holidays || []).map(h => h.date));
  
  // 원래 회차 일정 계산 (조정 전)
  const originalSessions = (subject.startDate && subject.classDays?.length > 0)
    ? getClassSessions(parseDate(subject.startDate), subject.classDays, subject.totalSessions, holidaySet, subject.skipHolidays)
    : [];
  
  // 지난 진행 회차 계산 (역산)
  const previousSessions = (subject.startDate && subject.classDays?.length > 0 && !subject.isNew)
    ? getPreviousCycleSessions(parseDate(subject.startDate), subject.classDays, subject.totalSessions, holidaySet, subject.skipHolidays)
    : [];
  
  // 날짜 → 회차 번호 매핑 (계획 + 진행 모두 포함)
  const dateToSession = new Map();
  originalSessions.forEach((s, i) => {
    dateToSession.set(formatDateStr(s.date), { num: i + 1, type: 'plan' });
  });
  previousSessions.forEach((s, i) => {
    const k = formatDateStr(s.date);
    if (!dateToSession.has(k)) {
      dateToSession.set(k, { num: i + 1, type: 'previous' });
    }
  });
  
  const resetForm = () => {
    setOriginalDate(''); setNewDate(''); setNote(''); setMode(null);
  };
  
  // 회차 수정 (날짜 변경): 원래 날짜 → 새 날짜
  const handleModify = () => {
    if (!originalDate) {
      alert('변경할 원래 날짜를 선택하세요');
      return;
    }
    if (!newDate) {
      alert('새 날짜를 선택하세요');
      return;
    }
    const info = dateToSession.get(originalDate);
    if (!info) {
      if (!confirm(`${originalDate}는 자동 계산된 회차 날짜가 아닙니다.\n그래도 추가 수업으로 처리할까요?`)) return;
      onUpdate([...adjustments, { type: 'add', date: newDate, note: note || `${originalDate} 변경` }]);
      resetForm();
      return;
    }
    const sessionNum = info.num;
    const existing = adjustments.find(a => (a.type === 'modify' || !a.type) && a.sessionNum === sessionNum && a.originalDate === originalDate);
    const newItem = { type: 'modify', sessionNum, originalDate, newDate, note };
    const newAdjustments = existing
      ? adjustments.map(a => ((a.type === 'modify' || !a.type) && a.sessionNum === sessionNum && a.originalDate === originalDate) ? newItem : a)
      : [...adjustments, newItem];
    onUpdate(newAdjustments);
    resetForm();
  };
  
  // 회차 추가
  const handleAddSession = () => {
    if (!newDate) {
      alert('추가할 날짜를 선택하세요');
      return;
    }
    onUpdate([...adjustments, { type: 'add', date: newDate, note: note || '추가 수업' }]);
    resetForm();
  };
  
  // 회차 삭제: 날짜로 선택
  const handleDeleteSession = () => {
    if (!originalDate) {
      alert('삭제할 날짜를 선택하세요');
      return;
    }
    const info = dateToSession.get(originalDate);
    if (!info) {
      alert(`${originalDate}는 자동 계산된 회차 날짜가 아닙니다.\n캘린더에 표시된 회차 날짜 중에서 선택해주세요.`);
      return;
    }
    onUpdate([...adjustments, { type: 'delete', sessionNum: info.num, originalDate, note: note || '수업 미진행' }]);
    resetForm();
  };
  
  const handleRemove = (idx) => {
    onUpdate(adjustments.filter((_, i) => i !== idx));
  };
  
  const dayLabels = ['일', '월', '화', '수', '목', '금', '토'];
  
  // 항목별 색상
  const typeStyle = {
    modify: { bg: 'bg-purple-100', border: 'border-purple-300', text: 'text-purple-800', label: '✏️ 수정' },
    add: { bg: 'bg-teal-100', border: 'border-teal-300', text: 'text-teal-800', label: '➕ 추가' },
    delete: { bg: 'bg-rose-100', border: 'border-rose-300', text: 'text-rose-800', label: '🗑️ 삭제' },
  };
  
  const sortedAdjustments = [...adjustments].map((a, idx) => ({ ...a, _idx: idx })).sort((a, b) => {
    const aKey = a.originalDate || a.date || '';
    const bKey = b.originalDate || b.date || '';
    return aKey.localeCompare(bKey);
  });
  
  // 자동 계산된 회차 목록 (참고용 표시)
  const sessionDateList = originalSessions.map((s, i) => ({
    num: i + 1,
    date: formatDateStr(s.date),
    day: dayLabels[s.date.getDay()],
  }));
  
  return (
    <div className="mt-2 p-2 bg-purple-50 border border-purple-200 rounded">
      <div className="flex items-center justify-between flex-wrap gap-2 mb-1">
        <div className="flex items-center gap-2">
          <span className="text-purple-800 text-xs font-semibold">📅 회차 일정 변경</span>
          {adjustments.length > 0 && (
            <span className="text-[10px] text-purple-600">{adjustments.length}건</span>
          )}
        </div>
        <div className="flex gap-1">
          <button onClick={() => setMode(mode === 'modify' ? null : 'modify')} className={`px-2 py-0.5 text-[11px] rounded ${mode === 'modify' ? 'bg-purple-700 text-white' : 'bg-purple-100 text-purple-700 hover:bg-purple-200'}`}>✏️ 수정</button>
          <button onClick={() => setMode(mode === 'add' ? null : 'add')} className={`px-2 py-0.5 text-[11px] rounded ${mode === 'add' ? 'bg-teal-700 text-white' : 'bg-teal-100 text-teal-700 hover:bg-teal-200'}`}>➕ 추가</button>
          <button onClick={() => setMode(mode === 'delete' ? null : 'delete')} className={`px-2 py-0.5 text-[11px] rounded ${mode === 'delete' ? 'bg-rose-700 text-white' : 'bg-rose-100 text-rose-700 hover:bg-rose-200'}`}>🗑️ 삭제</button>
        </div>
      </div>
      
      {/* 자동 계산 회차 미리보기 (수정/삭제 시 참고) */}
      {(mode === 'modify' || mode === 'delete') && (originalSessions.length > 0 || previousSessions.length > 0) && (
        <div className="mt-1 p-2 bg-gray-50 border border-gray-200 rounded space-y-2">
          {previousSessions.length > 0 && (
            <div>
              <div className="text-[11px] font-semibold text-amber-700 mb-1">📜 지난 진행 회차 (이미 진행된 일정)</div>
              <div className="flex flex-wrap gap-1">
                {previousSessions.map((s, i) => (
                  <span key={i} className="text-[10px] bg-amber-50 border border-amber-300 px-1.5 py-0.5 rounded">
                    {i + 1}회차: <strong>{formatDateStr(s.date).substring(5)} ({dayLabels[s.date.getDay()]})</strong>
                  </span>
                ))}
              </div>
            </div>
          )}
          {originalSessions.length > 0 && (
            <div>
              <div className="text-[11px] font-semibold text-blue-700 mb-1">📌 이번 계획 회차 (앞으로 진행)</div>
              <div className="flex flex-wrap gap-1">
                {originalSessions.map((s, i) => (
                  <span key={i} className="text-[10px] bg-blue-50 border border-blue-300 px-1.5 py-0.5 rounded">
                    {i + 1}회차: <strong>{formatDateStr(s.date).substring(5)} ({dayLabels[s.date.getDay()]})</strong>
                  </span>
                ))}
              </div>
            </div>
          )}
        </div>
      )}
      
      {/* 수정 폼 */}
      {mode === 'modify' && (
        <div className="mt-1 p-2 bg-white border border-purple-200 rounded space-y-1.5">
          <div className="text-[11px] text-purple-700 font-semibold">✏️ 회차 날짜 변경 (예: 화 → 금)</div>
          <div className="flex gap-1.5 flex-wrap items-center">
            <span className="text-[11px] text-gray-600">원래 날짜:</span>
            <input type="date" value={originalDate} onChange={(e) => setOriginalDate(e.target.value)} className="px-1.5 py-0.5 border rounded text-xs" />
            <span className="text-[11px] text-gray-500">→ 새 날짜:</span>
            <input type="date" value={newDate} onChange={(e) => setNewDate(e.target.value)} className="px-1.5 py-0.5 border rounded text-xs" />
            <input type="text" value={note} onChange={(e) => setNote(e.target.value)} placeholder="사유 (선택)" className="flex-1 min-w-[100px] px-1.5 py-0.5 border rounded text-xs" />
            <button onClick={handleModify} className="px-2 py-0.5 bg-purple-600 text-white text-[11px] rounded">저장</button>
          </div>
          {originalDate && (
            <div className="text-[10px] text-gray-600">
              {(() => {
                const info = dateToSession.get(originalDate);
                if (!info) return <span className="text-orange-600">⚠️ 이 날짜는 자동 계산 회차에 없습니다. 추가 수업으로 처리됩니다.</span>;
                const label = info.type === 'previous' ? '지난 진행' : '이번 계획';
                return <>위 회차 중 <strong>[{label}] {info.num}회차 ({originalDate})</strong>가 변경됩니다.</>;
              })()}
            </div>
          )}
        </div>
      )}
      
      {/* 추가 폼 */}
      {mode === 'add' && (
        <div className="mt-1 p-2 bg-white border border-teal-200 rounded space-y-1.5">
          <div className="text-[11px] text-teal-700 font-semibold">➕ 회차 추가 (예: 주2회 → 주3회로 추가 수업)</div>
          <div className="flex gap-1.5 flex-wrap items-center">
            <span className="text-[11px] text-gray-600">추가할 날짜:</span>
            <input type="date" value={newDate} onChange={(e) => setNewDate(e.target.value)} className="px-1.5 py-0.5 border rounded text-xs" />
            <input type="text" value={note} onChange={(e) => setNote(e.target.value)} placeholder="사유 (예: 보강·추가수업)" className="flex-1 min-w-[100px] px-1.5 py-0.5 border rounded text-xs" />
            <button onClick={handleAddSession} className="px-2 py-0.5 bg-teal-600 text-white text-[11px] rounded">저장</button>
          </div>
          <div className="text-[10px] text-teal-600">💡 자동 계산된 회차 외에 추가로 진행한 수업을 기록합니다. 회차 수가 늘어납니다.</div>
        </div>
      )}
      
      {/* 삭제 폼 */}
      {mode === 'delete' && (
        <div className="mt-1 p-2 bg-white border border-rose-200 rounded space-y-1.5">
          <div className="text-[11px] text-rose-700 font-semibold">🗑️ 회차 삭제 (예: 진행 안 한 회차 제거)</div>
          <div className="flex gap-1.5 flex-wrap items-center">
            <span className="text-[11px] text-gray-600">삭제할 날짜:</span>
            <input type="date" value={originalDate} onChange={(e) => setOriginalDate(e.target.value)} className="px-1.5 py-0.5 border rounded text-xs" />
            <input type="text" value={note} onChange={(e) => setNote(e.target.value)} placeholder="사유 (선택)" className="flex-1 min-w-[100px] px-1.5 py-0.5 border rounded text-xs" />
            <button onClick={handleDeleteSession} className="px-2 py-0.5 bg-rose-600 text-white text-[11px] rounded">저장</button>
          </div>
          {originalDate && (
            <div className="text-[10px] text-gray-600">
              {(() => {
                const info = dateToSession.get(originalDate);
                if (!info) return <span className="text-rose-600">⚠️ 이 날짜는 자동 계산 회차에 없습니다. 위 회차 목록에서 선택해주세요.</span>;
                const label = info.type === 'previous' ? '지난 진행' : '이번 계획';
                return <><strong>[{label}] {info.num}회차 ({originalDate})</strong>가 삭제됩니다.</>;
              })()}
            </div>
          )}
          <div className="text-[10px] text-rose-600">💡 이 회차는 회차 수에서 제외됩니다. 회차 수가 줄어듭니다.</div>
        </div>
      )}
      
      {/* 적용된 변경 목록 */}
      {adjustments.length > 0 && (
        <div className="mt-1.5 space-y-1">
          {sortedAdjustments.map((a) => {
            const t = a.type || 'modify';
            const style = typeStyle[t];
            return (
              <div key={a._idx} className={`flex items-center gap-1.5 ${style.bg} border ${style.border} rounded px-2 py-1 text-[11px] flex-wrap`}>
                <span className={`font-bold ${style.text}`}>{style.label}</span>
                {t === 'modify' && (
                  <>
                    <span className="text-gray-500 line-through">{a.originalDate?.substring(5)} ({dayLabels[parseDate(a.originalDate)?.getDay()]})</span>
                    <span className={style.text}>→</span>
                    <span className={`font-bold ${style.text}`}>{a.newDate?.substring(5)} ({dayLabels[parseDate(a.newDate)?.getDay()]})</span>
                  </>
                )}
                {t === 'add' && (
                  <span className={`font-bold ${style.text}`}>{a.date?.substring(5)} ({dayLabels[parseDate(a.date)?.getDay()]})</span>
                )}
                {t === 'delete' && (
                  <span className="text-gray-500 line-through">{a.originalDate?.substring(5)} ({dayLabels[parseDate(a.originalDate)?.getDay()]})</span>
                )}
                {a.note && <span className="text-gray-600 text-[10px]">({a.note})</span>}
                <button onClick={() => handleRemove(a._idx)} className="ml-auto text-gray-400 hover:text-gray-700">×</button>
              </div>
            );
          })}
        </div>
      )}
      <p className="text-[10px] text-purple-600/70 mt-1">
        💡 <strong>수정</strong>·<strong>삭제</strong>는 날짜를 직접 선택하세요. 진행/계획 캘린더 모두 반영됩니다.
      </p>
    </div>
  );
}

// 보강 일정 관리자
function MakeupManager({ subject, onUpdate }) {
  const [showForm, setShowForm] = useState(false);
  const [date, setDate] = useState('');
  const [note, setNote] = useState('');
  
  const makeups = subject.makeups || [];
  
  const handleAdd = () => {
    if (!date) {
      alert('보강 날짜를 선택하세요');
      return;
    }
    const exists = makeups.some(m => m.date === date);
    if (exists) {
      alert('해당 날짜에 이미 보강이 등록되어 있습니다');
      return;
    }
    onUpdate([...makeups, { date, note }]);
    setDate('');
    setNote('');
    setShowForm(false);
  };
  
  const handleRemove = (d) => {
    onUpdate(makeups.filter(m => m.date !== d));
  };
  
  const dayLabels = ['일', '월', '화', '수', '목', '금', '토'];
  
  return (
    <div className="mt-2 p-2 bg-emerald-50 border border-emerald-200 rounded">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <div className="flex items-center gap-2">
          <span className="text-emerald-800 text-xs font-semibold">🔵 보강 일정</span>
          {makeups.length > 0 && (
            <span className="text-[10px] text-emerald-600">{makeups.length}건</span>
          )}
        </div>
        <button
          onClick={() => setShowForm(!showForm)}
          className="px-2 py-0.5 bg-emerald-600 text-white text-[11px] rounded hover:bg-emerald-700"
        >
          {showForm ? '닫기' : '+ 보강 추가'}
        </button>
      </div>
      
      {showForm && (
        <div className="mt-2 p-2 bg-white border border-emerald-200 rounded">
          <div className="flex gap-1.5 flex-wrap items-center">
            <span className="text-[11px] text-gray-600">보강일:</span>
            <input
              type="date"
              value={date}
              onChange={(e) => setDate(e.target.value)}
              className="px-1.5 py-0.5 border rounded text-xs"
            />
            <input
              type="text"
              value={note}
              onChange={(e) => setNote(e.target.value)}
              placeholder="사유 (예: 4회차 보강)"
              className="flex-1 min-w-[120px] px-1.5 py-0.5 border rounded text-xs"
            />
            <button onClick={handleAdd} className="px-2 py-0.5 bg-emerald-600 text-white text-[11px] rounded">추가</button>
          </div>
        </div>
      )}
      
      {makeups.length > 0 && (
        <div className="mt-1.5 flex flex-wrap gap-1">
          {makeups.sort((a, b) => a.date.localeCompare(b.date)).map((m) => {
            const d = parseDate(m.date);
            return (
              <span key={m.date} className="inline-flex items-center gap-1 bg-white border border-emerald-300 rounded px-1.5 py-0.5 text-[11px]">
                <span className="font-bold text-emerald-700">🔵 {m.date.substring(5)} ({dayLabels[d.getDay()]})</span>
                {m.note && <span className="text-gray-600 text-[10px]">{m.note}</span>}
                <button onClick={() => handleRemove(m.date)} className="text-emerald-400 hover:text-emerald-700 ml-0.5">×</button>
              </span>
            );
          })}
        </div>
      )}
      <p className="text-[10px] text-emerald-600/70 mt-1">
        💡 보강 일정은 캘린더에 <strong>🔵 시안색 박스</strong>로 표시됩니다. 진행 캘린더 종료일과 계획 시작일 <strong>사이의 보강(예: 4/4)도 진행 캘린더에 표시</strong>됩니다.
      </p>
    </div>
  );
}

// ═══════════════════════════════════════════════════
//  캘린더 직접 수정 (날짜 클릭으로 이동·추가·삭제·보강)
// ═══════════════════════════════════════════════════

function InteractiveScheduleCalendar({ subject, holidays, absences, onUpdate, cycleHistory }) {
  const hasChanges = (subject.adjustments || []).length + (subject.makeups || []).length > 0;
  const [open, setOpen] = useState(hasChanges);
  const [sel, setSel] = useState(null); // {kind:'session'|'makeup'|'empty', ...}
  const [noteDraft, setNoteDraft] = useState('');
  const [extendBefore, setExtendBefore] = useState(0);
  const [extendAfter, setExtendAfter] = useState(0);

  const adjustments = subject.adjustments || [];
  const makeups = subject.makeups || [];
  const holidaySet = new Set((holidays || []).map(h => h.date));
  const holidayMap = new Map((holidays || []).map(h => [h.date, h.label]));
  const absentSet = new Set((absences || []).map(a => a.date));

  const canCalc = subject.startDate && subject.classDays && subject.classDays.length > 0 && subject.totalSessions > 0;
  if (!canCalc) return null;

  // 자동 회차 + 조정 적용 (표시 번호는 인쇄 캘린더와 동일한 규칙 = applyScheduleAdjustments)
  const newCycleStart = parseDate(subject.startDate);
  const newCycleStartStr = formatDateStr(newCycleStart);
  let planFinals = [], prevFinals = [], deletedRecs = [];

  const holOpts = { holidaySet, classDays: subject.classDays, skipHolidays: subject.skipHolidays };
  const planAuto = getClassSessions(newCycleStart, subject.classDays, subject.totalSessions, holidaySet, subject.skipHolidays);
  if (planAuto.length > 0) {
    const cs = formatDateStr(planAuto[0].date);
    const ce = formatDateStr(planAuto[planAuto.length - 1].date);
    const res = applyScheduleAdjustments(planAuto, adjustments, { cycleStartStr: cs, cycleEndStr: ce, addFrom: newCycleStartStr, addTo: '', ...holOpts });
    planFinals = res.finals;
    deletedRecs = deletedRecs.concat(res.deleted);
  }
  // 지난 주기: 저장된 기록이 있으면 여기서는 표시·수정하지 않음 (📆 일정의 수정 모드 담당)
  let histPrev = false;
  {
    const hists = cycleHistory || [];
    for (let i = hists.length - 1; i >= 0; i--) {
      if ((hists[i].subjects || []).some(x => x.name === subject.name && (x.schedule || []).length > 0)) { histPrev = true; break; }
    }
  }
  if (!subject.isNew && !histPrev) {
    const edPrevDays = (subject.prevClassDays && subject.prevClassDays.length > 0) ? subject.prevClassDays : subject.classDays;
    const edPrevTotal = subject.prevTotalSessions || subject.totalSessions;
    const prevAuto = getPreviousCycleSessions(newCycleStart, edPrevDays, edPrevTotal, holidaySet, subject.skipHolidays);
    if (prevAuto.length > 0) {
      const cs = formatDateStr(prevAuto[0].date);
      const ce = formatDateStr(prevAuto[prevAuto.length - 1].date);
      const res = applyScheduleAdjustments(prevAuto, adjustments, { cycleStartStr: cs, cycleEndStr: ce, addFrom: cs, addTo: formatDateStr(addDays(newCycleStart, -1)), ...holOpts, classDays: edPrevDays });
      prevFinals = res.finals;
      deletedRecs = deletedRecs.concat(res.deleted);
    }
  }
  // 삭제 레코드 중복 제거 (양쪽 주기에서 겹칠 일은 없지만 안전)
  const seenDel = new Set();
  deletedRecs = deletedRecs.filter(d => seenDel.has(d.srcIdx) ? false : (seenDel.add(d.srcIdx), true));

  // 날짜 → 표시 항목 맵
  const dateMap = new Map(); // dateStr → { prev:[f], plan:[f], makeups:[{idx, m}] }
  const ensure = (k) => { if (!dateMap.has(k)) dateMap.set(k, { prev: [], plan: [], makeups: [] }); return dateMap.get(k); };
  prevFinals.forEach(f => ensure(f.dateStr).prev.push(f));
  planFinals.forEach(f => ensure(f.dateStr).plan.push(f));
  makeups.forEach((m, idx) => { if (m.date) ensure(m.date).makeups.push({ idx, m }); });

  const allDateStrs = [...dateMap.keys()].sort();
  if (allDateStrs.length === 0) return null;

  // 표시할 달 범위 (± 확장 가능)
  const firstD = parseDate(allDateStrs[0]);
  const lastD = parseDate(allDateStrs[allDateStrs.length - 1]);
  const monthCursor = new Date(firstD.getFullYear(), firstD.getMonth() - extendBefore, 1);
  const monthEnd = new Date(lastD.getFullYear(), lastD.getMonth() + extendAfter, 1);
  const months = [];
  const mc = new Date(monthCursor);
  while (mc <= monthEnd) {
    months.push({ year: mc.getFullYear(), month: mc.getMonth() + 1 });
    mc.setMonth(mc.getMonth() + 1);
  }

  const fmtD = (ds) => `${ds.slice(5, 7)}/${ds.slice(8, 10)} (${DAY_NAMES_KO[parseDate(ds).getDay()]})`;

  const guardHoliday = (target) => {
    if (holidaySet.has(target) && !(subject.skipHolidays || []).includes(target)) {
      alert(`${fmtD(target)}은(는) 휴원일이라 수업을 넣을 수 없어요.\n(⚙️ 학원 설정 > 휴일에서 해제하거나 다른 날짜를 선택하세요)`);
      return true;
    }
    return false;
  };

  // ── 데이터 변경 핸들러 ──
  const moveSession = (f, target) => {
    if (guardHoliday(target)) return;
    let next;
    if (f.isExtra) {
      // 추가 수업(또는 살려낸 수정)의 날짜만 갱신
      next = adjustments.map((a, i) => i !== f.srcIdx ? a : (a.type === 'add' ? { ...a, date: target } : { ...a, newDate: target }));
    } else if (f.srcIdx >= 0) {
      // 기록이 있는 회차(이동됨 또는 사유만 저장됨): 원래 날짜로 되돌리면 레코드 제거(사유 있으면 유지), 아니면 새 날짜로 갱신
      const rec = adjustments[f.srcIdx];
      next = (target === f.originalDate && !(rec && rec.note))
        ? adjustments.filter((_, i) => i !== f.srcIdx)
        : adjustments.map((a, i) => i === f.srcIdx ? { ...a, newDate: target } : a);
    } else {
      next = [...adjustments, { type: 'modify', sessionNum: f.autoNum, originalDate: f.originalDate, newDate: target, note: '' }];
    }
    onUpdate({ adjustments: next });
    setSel(null);
  };

  const deleteSession = (f) => {
    let next;
    if (f.isExtra) {
      next = adjustments.filter((_, i) => i !== f.srcIdx);
    } else if (f.srcIdx >= 0) {
      next = adjustments.map((a, i) => i === f.srcIdx ? { type: 'delete', sessionNum: f.autoNum, originalDate: f.originalDate, note: a.note || '' } : a);
    } else {
      next = [...adjustments, { type: 'delete', sessionNum: f.autoNum, originalDate: f.originalDate, note: '' }];
    }
    onUpdate({ adjustments: next });
    setSel(null);
  };

  const revertSession = (f) => {
    if (f.srcIdx < 0) return;
    onUpdate({ adjustments: adjustments.filter((_, i) => i !== f.srcIdx) });
    setSel(null);
  };

  const restoreDeleted = (srcIdx) => {
    onUpdate({ adjustments: adjustments.filter((_, i) => i !== srcIdx) });
  };

  const addSession = (dateStr) => {
    if (guardHoliday(dateStr)) return;
    onUpdate({ adjustments: [...adjustments, { type: 'add', date: dateStr, note: '' }] });
    setSel(null);
  };

  const addMakeup = (dateStr) => {
    if (guardHoliday(dateStr)) return;
    if (makeups.some(m => m.date === dateStr)) { alert('해당 날짜에 이미 보강이 등록되어 있어요'); return; }
    onUpdate({ makeups: [...makeups, { date: dateStr, note: '' }] });
    setSel(null);
  };

  const moveMakeup = (idx, target) => {
    if (guardHoliday(target)) return;
    onUpdate({ makeups: makeups.map((m, i) => i === idx ? { ...m, date: target } : m) });
    setSel(null);
  };

  const deleteMakeup = (idx) => {
    onUpdate({ makeups: makeups.filter((_, i) => i !== idx) });
    setSel(null);
  };

  // 선택된 회차/보강에 사유 저장 (캘린더에 표시됨)
  const saveNote = () => {
    if (!sel) return;
    const text = noteDraft.trim();
    if (sel.kind === 'makeup') {
      onUpdate({ makeups: makeups.map((m, i) => i === sel.idx ? { ...m, note: text } : m) });
      setSel(null);
      return;
    }
    if (sel.kind !== 'session') return;
    const f = sel.f;
    let next;
    if (f.srcIdx >= 0) {
      next = adjustments.map((a, i) => i === f.srcIdx ? { ...a, note: text } : a);
      // 이동도 없고 사유도 지웠으면 레코드 자체를 정리
      const rec = next[f.srcIdx];
      if (!text && (rec.type === 'modify' || !rec.type) && rec.newDate === rec.originalDate) {
        next = next.filter((_, i) => i !== f.srcIdx);
      }
    } else {
      if (!text) { setSel(null); return; }
      // 자동 회차에 사유만 저장: 날짜 그대로의 수정 레코드를 만들어 메모를 담음
      next = [...adjustments, { type: 'modify', sessionNum: f.autoNum, originalDate: f.originalDate, newDate: f.dateStr, note: text }];
    }
    onUpdate({ adjustments: next });
    setSel(null);
  };

  const resetAll = () => {
    if (!confirm('이 과목의 일정 변경(이동·추가·삭제)과 보강을 모두 초기화할까요?\n자동 계산 일정으로 돌아갑니다.')) return;
    onUpdate({ adjustments: [], makeups: [] });
    setSel(null);
  };

  // ── 셀 클릭 ──
  const cellClick = (dateStr) => {
    const entry = dateMap.get(dateStr) || { prev: [], plan: [], makeups: [] };
    const hasSession = entry.prev.length > 0 || entry.plan.length > 0;
    // 이동 모드: 선택된 회차/보강을 클릭한 날짜로 이동 (수업이 이미 있는 날짜는 선택 전환)
    if (sel && (sel.kind === 'session' || sel.kind === 'makeup') && sel.dateStr !== dateStr && !hasSession) {
      if (sel.kind === 'session') moveSession(sel.f, dateStr);
      else moveMakeup(sel.idx, dateStr);
      return;
    }
    if (sel && sel.dateStr === dateStr) { setSel(null); return; }
    if (hasSession) {
      const f = entry.plan[0] || entry.prev[0];
      setNoteDraft(f.note || '');
      setSel({ kind: 'session', cycle: entry.plan[0] ? 'plan' : 'prev', f, dateStr });
      return;
    }
    if (entry.makeups.length > 0) {
      setNoteDraft(entry.makeups[0].m.note || '');
      setSel({ kind: 'makeup', idx: entry.makeups[0].idx, dateStr });
      return;
    }
    setNoteDraft('');
    setSel({ kind: 'empty', dateStr });
  };

  const totalChanges = adjustments.length + makeups.length;

  return (
    <div className="mt-2 border-2 border-blue-300 rounded-lg overflow-hidden">
      <button
        type="button"
        onClick={() => { setOpen(!open); setSel(null); }}
        className="w-full flex items-center justify-between px-3 py-2 bg-blue-100 hover:bg-blue-200 transition"
      >
        <span className="text-sm font-bold text-blue-900">
          🖱️ 캘린더에서 일정 바로 수정
          {totalChanges > 0 && <span className="ml-2 text-[11px] bg-blue-600 text-white px-1.5 py-0.5 rounded-full">{totalChanges}건 변경됨</span>}
        </span>
        <span className="text-blue-700 text-xs">{open ? '접기 ▲' : '열기 ▼ (클릭으로 이동·추가·삭제·보강)'}</span>
      </button>

      {open && (
        <div className="p-2 bg-white">
          {/* 사용법 안내 */}
          <div className="mb-2 p-2 bg-gray-50 border border-gray-200 rounded text-[11px] text-gray-600 leading-relaxed">
            💡 <strong>회차를 클릭</strong> → 원하는 <strong>빈 날짜를 클릭</strong>하면 그 날로 이동해요. ·
            <strong> 빈 날짜를 클릭</strong>하면 수업·보강을 추가할 수 있어요. ·
            선택 후 <strong>삭제</strong> 버튼으로 회차를 뺄 수 있고, <strong>💬 사유</strong>를 적으면 캘린더 회차 아래에 표시돼요. ·
            휴원일이 새로 등록되면 겹친 회차는 <strong>다음 수업일로 자동 이동</strong>됩니다.
          </div>

          {histPrev && (
            <div className="mb-2 p-2 bg-amber-50 border border-amber-200 rounded text-[11px] text-amber-800">
              📜 이 과목의 <strong>지난 주기 일정은 기록으로 저장</strong>되어 있어요. 여기서는 <strong>이번 계획만</strong> 수정하고,
              지난 일정은 이 캘린더 아래의 <strong>[📜 지난 일정 수정하기]</strong> 버튼으로 고쳐주세요.
            </div>
          )}

          {/* 선택 배너 */}
          {sel && (
            <div className="mb-2 p-2 rounded border-2 border-blue-400 bg-blue-50 flex items-center gap-2 flex-wrap sticky top-0 z-10">
              {sel.kind === 'session' && (
                <>
                  <span className="text-xs font-bold text-blue-900">
                    📌 {sel.cycle === 'plan' ? '계획' : '진행'} {sel.f.num}회차 · {fmtD(sel.dateStr)} 선택됨
                    {sel.f.adjusted && !sel.f.holidayShifted && <span className="ml-1 text-amber-700">(↪ {fmtD(sel.f.originalDate)}에서 이동된 회차)</span>}
                    {sel.f.holidayShifted && <span className="ml-1 text-red-600">(⚠️ 휴원일과 겹쳐 자동 이동됨)</span>}
                    {sel.f.isExtra && <span className="ml-1 text-teal-700">(➕ 추가된 수업)</span>}
                  </span>
                  <span className="text-[11px] text-blue-700">→ 옮길 날짜를 클릭하세요</span>
                  <span className="flex gap-1 ml-auto">
                    <button onClick={() => deleteSession(sel.f)} className="px-2 py-1 bg-rose-600 text-white text-[11px] rounded font-semibold">🗑️ 이 회차 삭제</button>
                    {sel.f.srcIdx >= 0 && (
                      <button onClick={() => revertSession(sel.f)} className="px-2 py-1 bg-amber-500 text-white text-[11px] rounded font-semibold">↩️ 원래대로</button>
                    )}
                    <button onClick={() => setSel(null)} className="px-2 py-1 bg-gray-300 text-gray-700 text-[11px] rounded">취소</button>
                  </span>
                  <span className="flex items-center gap-1 w-full mt-1">
                    <span className="text-[11px] text-gray-600 whitespace-nowrap">💬 사유:</span>
                    <input
                      type="text"
                      value={noteDraft}
                      onChange={(e) => setNoteDraft(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && saveNote()}
                      placeholder="예: 제헌절 휴원, 학교 행사 → 캘린더 회차 아래에 표시됩니다"
                      className="flex-1 min-w-[120px] px-1.5 py-0.5 border border-blue-300 rounded text-xs"
                    />
                    <button onClick={saveNote} className="px-2 py-1 bg-blue-600 text-white text-[11px] rounded font-semibold whitespace-nowrap">사유 저장</button>
                  </span>
                </>
              )}
              {sel.kind === 'makeup' && (
                <>
                  <span className="text-xs font-bold text-cyan-800">🔵 보강 · {fmtD(sel.dateStr)} 선택됨</span>
                  <span className="text-[11px] text-blue-700">→ 옮길 날짜를 클릭하세요</span>
                  <span className="flex gap-1 ml-auto">
                    <button onClick={() => deleteMakeup(sel.idx)} className="px-2 py-1 bg-rose-600 text-white text-[11px] rounded font-semibold">🗑️ 보강 삭제</button>
                    <button onClick={() => setSel(null)} className="px-2 py-1 bg-gray-300 text-gray-700 text-[11px] rounded">취소</button>
                  </span>
                  <span className="flex items-center gap-1 w-full mt-1">
                    <span className="text-[11px] text-gray-600 whitespace-nowrap">💬 사유:</span>
                    <input
                      type="text"
                      value={noteDraft}
                      onChange={(e) => setNoteDraft(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && saveNote()}
                      placeholder="예: 6회차 결석 보강 → 캘린더 보강 아래에 표시됩니다"
                      className="flex-1 min-w-[120px] px-1.5 py-0.5 border border-cyan-300 rounded text-xs"
                    />
                    <button onClick={saveNote} className="px-2 py-1 bg-cyan-600 text-white text-[11px] rounded font-semibold whitespace-nowrap">사유 저장</button>
                  </span>
                </>
              )}
              {sel.kind === 'empty' && (
                <>
                  <span className="text-xs font-bold text-gray-800">📅 {fmtD(sel.dateStr)}</span>
                  <span className="flex gap-1 ml-auto">
                    <button onClick={() => addSession(sel.dateStr)} className="px-2 py-1 bg-teal-600 text-white text-[11px] rounded font-semibold">➕ 이 날 수업 추가</button>
                    <button onClick={() => addMakeup(sel.dateStr)} className="px-2 py-1 bg-cyan-600 text-white text-[11px] rounded font-semibold">🔵 이 날 보강 추가</button>
                    <button onClick={() => setSel(null)} className="px-2 py-1 bg-gray-300 text-gray-700 text-[11px] rounded">취소</button>
                  </span>
                </>
              )}
            </div>
          )}

          {/* 범례 + 달 확장 */}
          <div className="flex items-center justify-between flex-wrap gap-1 mb-1">
            <div className="flex items-center gap-2 flex-wrap text-[10px] text-gray-600">
              <span><span className="inline-block w-2.5 h-2.5 rounded-sm align-middle mr-0.5" style={{ background: '#fbbf24' }}></span>진행(지난 주기)</span>
              <span><span className="inline-block w-2.5 h-2.5 rounded-sm align-middle mr-0.5" style={{ background: '#fb7185' }}></span>계획(이번 청구)</span>
              <span>↪ 이동됨</span>
              <span>➕ 추가</span>
              <span>🔵 보강</span>
              <span className="text-red-600">■ 휴원일</span>
            </div>
            <div className="flex gap-1">
              <button onClick={() => setExtendBefore(extendBefore + 1)} className="px-1.5 py-0.5 text-[10px] bg-gray-100 border rounded hover:bg-gray-200">◀ 이전 달</button>
              <button onClick={() => setExtendAfter(extendAfter + 1)} className="px-1.5 py-0.5 text-[10px] bg-gray-100 border rounded hover:bg-gray-200">다음 달 ▶</button>
            </div>
          </div>

          {/* 월별 캘린더 */}
          {months.map(({ year, month }) => {
            const weeks = buildMonthWeeks(year, month);
            return (
              <div key={`${year}-${month}`} className="mb-2">
                <div className="text-xs font-bold text-gray-800 text-center mb-0.5">{year}년 {String(month).padStart(2, '0')}월</div>
                <div className="grid grid-cols-7 gap-px bg-gray-300 border border-gray-300">
                  {DAY_NAMES_KO.map((day, i) => (
                    <div key={i} className="bg-gray-100 text-center text-[10px] font-semibold py-0.5" style={{ color: i === 0 ? '#dc2626' : i === 6 ? '#2563eb' : '#374151' }}>{day}</div>
                  ))}
                  {weeks.flat().map((date, idx) => {
                    const dstr = formatDateStr(date);
                    const isCurrentMonth = date.getMonth() === month - 1;
                    const holiday = holidayMap.get(dstr);
                    const entry = dateMap.get(dstr);
                    const isSelected = sel && sel.dateStr === dstr;
                    const moving = sel && (sel.kind === 'session' || sel.kind === 'makeup');
                    return (
                      <div
                        key={idx}
                        onClick={() => isCurrentMonth && cellClick(dstr)}
                        className={`relative flex flex-col items-center px-0.5 py-0.5 min-h-[46px] text-center select-none ${isCurrentMonth ? 'cursor-pointer' : ''} ${isSelected ? 'ring-2 ring-inset ring-blue-500' : ''} ${moving && isCurrentMonth && !isSelected ? 'hover:bg-blue-100' : isCurrentMonth ? 'hover:bg-gray-100' : ''}`}
                        style={{ background: !isCurrentMonth ? '#f3f4f6' : holiday ? '#FEE2E2' : isSelected ? '#dbeafe' : 'white', opacity: isCurrentMonth ? 1 : 0.4 }}
                      >
                        <div className="text-[10px] leading-none" style={{ color: holiday ? '#dc2626' : date.getDay() === 0 ? '#dc2626' : date.getDay() === 6 ? '#2563eb' : '#111827', fontWeight: holiday ? 700 : 500 }}>{date.getDate()}</div>
                        {holiday && isCurrentMonth && <div className="text-[8px] text-red-600 font-bold leading-tight">{holiday}</div>}
                        {isCurrentMonth && entry && entry.prev.map((f, i) => (
                          <React.Fragment key={`p${i}`}>
                            <div className="text-[9px] font-extrabold leading-tight rounded px-0.5 mt-px" style={{ background: '#fef3c7', color: absentSet.has(f.dateStr) || (f.originalDate && absentSet.has(f.originalDate)) ? '#dc2626' : '#b45309', textDecoration: absentSet.has(f.dateStr) || (f.originalDate && absentSet.has(f.originalDate)) ? 'line-through' : 'none' }}>
                              {(f.adjusted || f.holidayShifted) && '↪'}{f.isExtra && '➕'}{f.num}
                            </div>
                            {f.note && <div className="text-[7px] text-gray-500 leading-tight" style={{ wordBreak: 'keep-all' }}>{f.note}</div>}
                          </React.Fragment>
                        ))}
                        {isCurrentMonth && entry && entry.plan.map((f, i) => (
                          <React.Fragment key={`f${i}`}>
                            <div className="text-[9px] font-extrabold leading-tight rounded px-0.5 mt-px" style={{ background: '#ffe4e6', color: '#be123c' }}>
                              {(f.adjusted || f.holidayShifted) && '↪'}{f.isExtra && '➕'}{f.num}
                            </div>
                            {f.note && <div className="text-[7px] text-gray-500 leading-tight" style={{ wordBreak: 'keep-all' }}>{f.note}</div>}
                          </React.Fragment>
                        ))}
                        {isCurrentMonth && entry && entry.makeups.map((mk, i) => (
                          <React.Fragment key={`m${i}`}>
                            <div className="text-[9px] font-extrabold leading-tight rounded px-0.5 mt-px" style={{ background: '#cffafe', color: '#0891b2' }}>🔵보강</div>
                            {mk.m.note && <div className="text-[7px] leading-tight" style={{ color: '#0e7490', wordBreak: 'keep-all' }}>{mk.m.note}</div>}
                          </React.Fragment>
                        ))}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}

          {/* 삭제된 회차 복원 */}
          {deletedRecs.length > 0 && (
            <div className="mt-1 p-2 bg-rose-50 border border-rose-200 rounded">
              <span className="text-[11px] font-semibold text-rose-700 mr-2">🗑️ 삭제된 회차:</span>
              {deletedRecs.map((d) => (
                <span key={d.srcIdx} className="inline-flex items-center gap-1 bg-white border border-rose-300 rounded px-1.5 py-0.5 text-[11px] mr-1">
                  <span className="line-through text-gray-500">{fmtD(d.originalDate)}</span>
                  <button onClick={() => restoreDeleted(d.srcIdx)} className="text-rose-600 hover:underline font-semibold">복원</button>
                </span>
              ))}
            </div>
          )}

          {/* 전체 초기화 */}
          {totalChanges > 0 && (
            <div className="mt-1 text-right">
              <button onClick={resetAll} className="text-[11px] text-gray-500 hover:text-rose-600 underline">⟲ 일정 변경 전체 초기화</button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// 지난 주기 이력 뷰어
function CycleHistoryViewer({ history, onDelete }) {
  const [expanded, setExpanded] = useState(false);
  const sorted = [...history].sort((a, b) => (b.savedDate || '').localeCompare(a.savedDate || ''));
  
  return (
    <div className="border-2 border-indigo-200 rounded-lg overflow-hidden">
      <button
        type="button"
        onClick={() => setExpanded(!expanded)}
        className="w-full flex items-center justify-between px-4 py-3 bg-indigo-50 hover:bg-indigo-100 transition"
      >
        <span className="font-bold text-indigo-800 text-sm">
          📜 지난 주기 이력 ({history.length}건)
        </span>
        <span className="text-indigo-600 text-sm">{expanded ? '▲ 접기' : '▼ 펼치기'}</span>

      {expanded && (
        <div className="p-3 space-y-2 bg-white max-h-80 overflow-y-auto">
          {sorted.map((h) => (
            <div key={h.id} className="border border-gray-200 rounded-lg p-3 bg-gray-50">
              <div className="flex items-center justify-between mb-2">
                <div className="flex items-center gap-2 flex-wrap">
                  <span className="font-bold text-gray-800 text-sm">{h.periodLabel || h.yearMonth || '기간 미상'}</span>
                  <span className={`text-[10px] px-1.5 py-0.5 rounded font-semibold ${h.payment?.status === 'paid' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                    {h.payment?.status === 'paid' ? `✅ 완납${h.payment.paidDate ? ` (${h.payment.paidDate})` : ''}` : '❌ 미납'}
                  </span>
                </div>
                <button
                  type="button"
                  onClick={() => onDelete(h.id)}
                  className="text-gray-400 hover:text-red-600 text-xs"
                  title="이력 삭제"
                >
                  🗑️
                </button>
              </div>
              
              {/* 과목별 정보 */}
              <div className="space-y-1 mb-2">
                {(h.subjects || []).map((sub, i) => (
                  <div key={i} className="flex items-center justify-between text-[11px] text-gray-600 bg-white rounded px-2 py-1">
                    <span>
                      <strong className="text-gray-800">{sub.label || sub.name}</strong>
                      {!sub.isMonthly && sub.startDate && (
                        <span className="text-gray-400 ml-1">
                          {sub.startDate?.substring(5)} ~ {sub.endDate?.substring(5)} ({sub.totalSessions}회)
                        </span>
                      )}
                    </span>
                    <span className="font-semibold">{fmtWon(sub.tuition)}</span>
                  </div>
                ))}
                {(h.materials || []).map((m, i) => (
                  <div key={`m${i}`} className="flex items-center justify-between text-[11px] text-gray-500 px-2">
                    <span>📚 {m.name}</span>
                    <span>{fmtWon(m.amount)}</span>
                  </div>
                ))}
              </div>
              
              <div className="flex items-center justify-between pt-2 border-t border-gray-200">
                <span className="text-[10px] text-gray-400">저장일: {h.savedDate}</span>
                <span className="text-sm font-bold text-indigo-700">총 {fmtWon(h.totalAmount)}</span>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

//  5. 학생 편집 폼

function StudentForm({ student, onSave, onCancel, defaultSettings }) {
  const [data, setData] = useState(student || {
    id: uid(),
    name: '',
    schoolName: '',
    grade: '',
    parentContact: '',
    note: '',
    enrollDate: '',
    periodDisplay: '',
    isWithdrawn: false,
    withdrawnDate: '',
    isSuspended: false,
    suspendStart: '',
    suspendEnd: '',
    isMonthly: false,
    monthlyYearMonth: '',
    suspendHistory: [],
    subjects: [],
    materials: [],
  });
  const [gapStart, setGapStart] = useState('');
  const [gapEnd, setGapEnd] = useState('');

  const updateField = (field, value) => setData({ ...data, [field]: value });

  // 📜 지난 일정(저장된 기록) 수정 창 — 편집 화면 안에서 바로 열기
  const [showHistoryEdit, setShowHistoryEdit] = useState(false);
  const hasHistFor = (name) => (data.cycleHistory || []).some(h => (h.subjects || []).some(hs => hs.name === name && (hs.schedule || []).length > 0));

  const addSubject = () => setData({
    ...data,
    subjects: [...(data.subjects || []), {
      id: uid(),
      name: '',
      label: '',
      labelNote: '',
      startDate: formatDateStr(new Date()),
      classDays: defaultSettings?.classDayDefault || [2, 4, 5],
      sessionsPerWeek: 3,
      totalSessions: defaultSettings?.sessionsDefault || 12,
      tuition: 0,
      isNew: true, // 신규 등록 (지난 주기 없음)
      adjustments: [], // 회차별 날짜 변경 [{ sessionNum, originalDate, newDate, note }]
      makeups: [],     // 보강 일정 [{ date, note }]
      skipHolidays: [], // 휴원일 무시 (이 과목만 수업) ['2026-06-03', ...]
    }],
  });

  // 프리셋에서 과목 + (선택적으로) 교재비를 한 번에 추가
  const addSubjectFromPreset = (preset) => {
    if (!preset) return;
    const newSubject = {
      id: uid(),
      name: preset.subjectName || '',
      label: preset.label || '',
      labelNote: '',
      startDate: formatDateStr(new Date()),
      classDays: preset.classDays || (defaultSettings?.classDayDefault || [2, 4, 5]),
      sessionsPerWeek: (preset.classDays || []).length || 3,
      totalSessions: preset.totalSessions || 12,
      tuition: preset.tuition || 0,
      isNew: true,
    };
    // 교재비가 프리셋에 있으면 자동 추가 (중복 제거)
    let updatedMaterials = data.materials || [];
    if (preset.materialLabel && preset.materialAmount > 0) {
      const exists = updatedMaterials.some(m => m.label === preset.materialLabel);
      if (!exists) {
        updatedMaterials = [...updatedMaterials, {
          id: uid(),
          label: preset.materialLabel,
          note: '',
          amount: preset.materialAmount,
        }];
      }
    }
    setData({
      ...data,
      subjects: [...(data.subjects || []), newSubject],
      materials: updatedMaterials,
    });
  };

  const updateSubject = (id, patch) => setData({
    ...data,
    subjects: (data.subjects || []).map(s => s.id === id ? { ...s, ...patch } : s),
  });

  const removeSubject = (id) => setData({
    ...data,
    subjects: (data.subjects || []).filter(s => s.id !== id),
  });

  const toggleSubjectDay = (subId, day) => {
    const sub = data.subjects.find(s => s.id === subId);
    if (!sub) return;
    const has = sub.classDays.includes(day);
    const newDays = has ? sub.classDays.filter(d => d !== day) : [...sub.classDays, day].sort();
    updateSubject(subId, { classDays: newDays, sessionsPerWeek: newDays.length });
  };

  const addMaterial = () => setData({
    ...data,
    materials: [...(data.materials || []), { id: uid(), label: '', note: '', amount: 0 }],
  });

  const updateMaterial = (id, patch) => setData({
    ...data,
    materials: (data.materials || []).map(m => m.id === id ? { ...m, ...patch } : m),
  });

  const removeMaterial = (id) => setData({
    ...data,
    materials: (data.materials || []).filter(m => m.id !== id),
  });

  const handleSave = () => {
    if (!data.name.trim()) { alert('학생 이름을 입력하세요'); return; }
    onSave(data);
  };

  return (
    <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 overflow-y-auto">
      <div className="bg-white rounded-xl shadow-2xl w-full max-w-3xl my-8 max-h-[90vh] overflow-y-auto">
        {/* 헤더 */}
        <div className="invoice-navy text-white px-6 py-4 flex items-center justify-between sticky top-0 z-10">
          <h2 className="text-lg font-bold">{student ? '학생 정보 수정' : '새 학생 추가'}</h2>
          <button onClick={onCancel} className="text-white/70 hover:text-white text-2xl">×</button>
        </div>

        <div className="p-6 space-y-5">
          {/* 기본 정보 */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div>
              <label className="block text-xs font-semibold text-gray-700 mb-1">학생 이름 *</label>
              <input type="text" value={data.name} onChange={(e) => updateField('name', e.target.value)} className="w-full px-3 py-2 border rounded text-sm" />
            </div>
            <div>
              <label className="block text-xs font-semibold text-gray-700 mb-1">학부모 연락처 (선택)</label>
              <input type="text" value={data.parentContact || ''} onChange={(e) => updateField('parentContact', e.target.value)} className="w-full px-3 py-2 border rounded text-sm" placeholder="010-0000-0000" />
            </div>
            <div>
              <label className="block text-xs font-semibold text-gray-700 mb-1">학교명 (선택)</label>
              <input type="text" value={data.schoolName || ''} onChange={(e) => updateField('schoolName', e.target.value)} className="w-full px-3 py-2 border rounded text-sm" placeholder="예: 둔산중학교" />
            </div>
            <div>
              <label className="block text-xs font-semibold text-gray-700 mb-1">학년 (선택)</label>
              <input type="text" value={data.grade || ''} onChange={(e) => updateField('grade', e.target.value)} className="w-full px-3 py-2 border rounded text-sm" placeholder="예: 2학년" />
            </div>
            <div>
              <label className="block text-xs font-semibold text-gray-700 mb-1">🏫 첫 등원일 (선택)</label>
              <input type="date" value={data.enrollDate || ''} onChange={(e) => updateField('enrollDate', e.target.value)} className="w-full px-3 py-2 border rounded text-sm" />
              <p className="text-[10px] text-gray-400 mt-0.5">학원에 처음 등원한 날 — 납부 현황에서 이 날 이전 달에는 표시 안 됨</p>

      {/* 지난 일정 수정 창 (수정 모드로 바로 열림 — 여기서 고친 내용은 [저장] 시 함께 저장) */}
      {showHistoryEdit && (
        <ScheduleHistoryModal
          student={data}
          settings={defaultSettings}
          startInEdit={true}
          onClose={() => setShowHistoryEdit(false)}
          onUpdateStudent={(patch) => setData({ ...data, ...patch })}
        />
      )}
    </div>
  );
}

//  5-2. 데이터 내보내기·가져오기 유틸
