// 📜 학생 한 명의 전체 납부 이력 (월별) — 바로 수정 가능
function PaymentHistoryModal({ student, onClose, onUpdate }) {
  const [newYm, setNewYm] = useState('');
  if (!student) return null;
  // 납부 기록이 있는 달 + 주기 이력이 있는 달을 모두 모음
  const monthSet = new Set(Object.keys(student.payments || {}));
  (student.cycleHistory || []).forEach(h => { if (h.yearMonth) monthSet.add(h.yearMonth); });
  const currentAmount = (student.subjects || []).reduce((a, x) => a + (x.tuition || 0), 0) + (student.materials || []).reduce((a, x) => a + (x.amount || 0), 0);
  const nowYm = formatDateStr(new Date()).slice(0, 7);

  const rows = [...monthSet].sort().reverse().map(ym => {
    const p = (student.payments || {})[ym];
    const hists = (student.cycleHistory || []).filter(h => h.yearMonth === ym);
    const hist = hists.length > 0 ? hists[hists.length - 1] : null;
    return {
      ym,
      period: hist ? hist.periodLabel : '',
      amount: hist ? hist.totalAmount : (ym === nowYm ? currentAmount : null),
      status: p ? p.status : (hist && hist.payment ? hist.payment.status : 'pending'),
      paidDate: (p && p.paidDate) || (hist && hist.payment && hist.payment.paidDate) || '',
      dueDate: (p && p.dueDate) || '',
      method: (p && p.method) || '',
      note: (p && p.note) || '',
    };
  });
  const paidTotal = rows.filter(r => r.status === 'paid' && r.amount).reduce((a, r) => a + r.amount, 0);

  return (
    <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 overflow-y-auto" onClick={onClose}>
      <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl my-8 max-h-[85vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
        <div className="invoice-navy text-white px-5 py-3 flex items-center justify-between sticky top-0 z-10">
          <h2 className="text-base font-bold">
            📜 {student.name} · 납부 이력
            {(student.isWithdrawn || student.isSuspended) && (
              <span className="ml-2 text-[10px] px-1.5 py-0.5 bg-white/20 rounded">{student.isWithdrawn ? '퇴원' : '휴원'}</span>
            )}
          </h2>
          <button onClick={onClose} className="text-white/70 hover:text-white text-2xl leading-none">×</button>
        </div>
        <div className="p-4">
          {rows.length === 0 && (
            <div className="py-6 text-center text-gray-400 text-sm">납부 기록이 아직 없습니다.<br /><span className="text-[11px]">아래에서 달을 골라 지난 기록을 직접 추가할 수 있어요.</span></div>
          )}
          {rows.length > 0 && (
            <table className="w-full text-sm">
              <thead className="bg-gray-50 border-b">
                <tr>
                  <th className="px-2 py-1.5 text-left font-semibold text-gray-700">월</th>
                  <th className="px-2 py-1.5 text-left font-semibold text-gray-700">청구 기간 · 메모</th>
                  <th className="px-2 py-1.5 text-right font-semibold text-gray-700">금액</th>
                  <th className="px-2 py-1.5 text-center font-semibold text-gray-700">청구일</th>
                  <th className="px-2 py-1.5 text-center font-semibold text-gray-700">상태</th>
                  <th className="px-2 py-1.5 text-center font-semibold text-gray-700">납부일</th>
                </tr>
              </thead>
              <tbody>
                {rows.map(r => (
                  <tr key={r.ym} className={`border-b ${r.status === 'paid' ? 'bg-green-50/40' : ''}`}>
                    <td className="px-2 py-1.5 font-bold text-gray-800 whitespace-nowrap align-top">{r.ym.slice(0, 4)}.{r.ym.slice(5, 7)}</td>
                    <td className="px-2 py-1.5 text-[11px] text-gray-500 align-top">
                      {r.period || '—'}
                      <input
                        type="text"
                        value={r.note}
                        onChange={(e) => onUpdate(r.ym, { note: e.target.value })}
                        placeholder="메모"
                        className="mt-0.5 w-full px-1.5 py-0.5 border rounded text-[11px]"
                      />
                    </td>
                    <td className="px-2 py-1.5 text-right text-gray-700 whitespace-nowrap align-top">{r.amount != null ? fmtWon(r.amount) : '—'}</td>
                    <td className="px-2 py-1.5 text-center align-top">
                      <input
                        type="date"
                        value={r.dueDate || ''}
                        onChange={(e) => onUpdate(r.ym, { dueDate: e.target.value })}
                        className="text-[11px] px-1 py-0.5 border rounded"
                        title="교습비 청구일"
                      />
                    </td>
                    <td className="px-2 py-1.5 text-center align-top">
                      <select
                        value={r.status === 'paid' ? 'paid' : r.status === 'refunded' ? 'refunded' : 'pending'}
                        onChange={(e) => onUpdate(r.ym, e.target.value === 'paid'
                          ? { status: 'paid', paidDate: r.paidDate || formatDateStr(new Date()) }
                          : e.target.value === 'pending'
                            ? { status: 'pending', paidDate: '' }
                            : { status: 'refunded' })}
                        className={`text-[11px] font-bold px-1.5 py-0.5 rounded border cursor-pointer ${r.status === 'paid' ? 'text-green-700 bg-green-100 border-green-300' : r.status === 'refunded' ? 'text-purple-700 bg-purple-100 border-purple-300' : 'text-rose-700 bg-rose-100 border-rose-300'}`}
                      >
                        <option value="pending">미납</option>
                        <option value="paid">✓ 완납</option>
                        <option value="refunded">↩ 환불</option>
                      </select>
                      <select
                        value={r.method || ''}
                        onChange={(e) => onUpdate(r.ym, { method: e.target.value })}
                        className={`mt-1 block mx-auto text-[10px] px-1 py-0.5 border rounded max-w-[110px] ${r.method ? 'text-gray-700' : 'text-gray-400'}`}
                        title="결제 수단"
                      >
                        <option value="">수단 —</option>
                        {PAYMENT_METHODS.map(m => <option key={m} value={m}>{m}</option>)}
                      </select>
                    </td>
                    <td className="px-2 py-1.5 text-center align-top">
                      <input
                        type="date"
                        value={r.paidDate || ''}
                        onChange={(e) => onUpdate(r.ym, { paidDate: e.target.value })}
                        className="text-[11px] px-1 py-0.5 border rounded"
                      />
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}

          {/* 지난 달 기록 직접 추가 */}
          <div className="mt-3 p-2 bg-indigo-50 border border-indigo-200 rounded flex items-center gap-2 flex-wrap">
            <span className="text-[11px] font-semibold text-indigo-800">➕ 지난 달 기록 추가:</span>
            <input type="month" value={newYm} onChange={(e) => setNewYm(e.target.value)} className="px-2 py-1 border rounded text-xs" />
            <button
              onClick={() => {
                if (!newYm) { alert('추가할 달을 선택하세요'); return; }
                if (monthSet.has(newYm)) { alert('이미 목록에 있는 달이에요. 표에서 바로 수정하세요.'); return; }
                onUpdate(newYm, { status: 'pending', paidDate: '', note: '' });
                setNewYm('');
              }}
              className="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-700 text-white text-[11px] rounded font-semibold"
            >추가</button>
            <span className="text-[10px] text-indigo-600">예: 작년 12월 납부 기록을 지금 넣고 싶을 때</span>
          </div>

          {rows.length > 0 && (
            <div className="mt-2 text-right text-xs text-gray-600">
              완납 합계: <strong className="text-green-700">{fmtWon(paidTotal)}</strong>
            </div>
          )}
          <p className="text-[10px] text-gray-400 mt-1">상태·납부일·메모는 여기서 바로 수정되고 자동 저장됩니다. 청구 기간·금액은 "다음 주기로 이동" 시 저장된 이력 기준이라 이력 없는 달은 — 로 표시될 수 있어요.</p>
        </div>
      </div>
    </div>
  );
}

function PaymentTab({ students, setStudents, privacyMode, settings }) {
  const pmask = (val, suffix = '') => privacyMode ? '•••' : `${val.toLocaleString()}${suffix}`;
  const [yearMonth, setYearMonth] = useState(() => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  });
  const [filter, setFilter] = useState('all');
  const [search, setSearch] = useState('');
  const [includeInactive, setIncludeInactive] = useState(false); // 퇴원·휴원생 포함 (이력 조회용)
  const [historyStudent, setHistoryStudent] = useState(null);

  const getPayment = (s) => (s.payments && s.payments[yearMonth]) || { status: 'pending', paidDate: '', note: '' };
  const getAmount = (s) => (s.subjects || []).reduce((a, x) => a + (x.tuition || 0), 0) + (s.materials || []).reduce((a, x) => a + (x.amount || 0), 0);

  const updatePayment = (studentId, patch) => {
    setStudents(students.map(s => {
      if (s.id !== studentId) return s;
      const current = getPayment(s);
      return {
        ...s,
        payments: {
          ...(s.payments || {}),
          [yearMonth]: { ...current, ...patch },
        },
      };
    }));
  };

  // 임의의 달 납부 기록 수정 (납부 이력 모달에서 사용 — 지난 달 추가·수정)
  const updatePaymentForMonth = (studentId, ym, patch) => {
    setStudents(students.map(s => {
      if (s.id !== studentId) return s;
      const current = (s.payments && s.payments[ym]) || { status: 'pending', paidDate: '', note: '' };
      return {
        ...s,
        payments: {
          ...(s.payments || {}),
          [ym]: { ...current, ...patch },
        },
      };
    }));
  };

  // ⚡ 자동 청구일: "지금 보고 있는 달"에 해당하는 주기의 시작일을 찾아줌
  const autoDueForMonth = (s) => {
    const starts = [];
    (s.subjects || []).forEach(sub => { if (sub.startDate) starts.push(sub.startDate); });
    (s.cycleHistory || []).forEach(h => (h.subjects || []).forEach(hs => { if (hs.startDate) starts.push(hs.startDate); }));
    // 1순위: 이 달에 시작한 주기의 시작일 (= 그 주기 청구 기준일)
    const inMonth = starts.filter(d => d.slice(0, 7) === yearMonth).sort();
    if (inMonth.length > 0) return inMonth[0];
    // 2순위: 등록 마감일이 이 달에 있으면 그 날
    const dl = getRegistrationDeadline(s, settings || DEFAULT_SETTINGS);
    if (dl && formatDateStr(dl).slice(0, 7) === yearMonth) return formatDateStr(dl);
    return null;
  };

  // 상태 변경: 미납 / 납부완료 / 환불
  const setPayStatus = (s, st) => {
    const current = getPayment(s);
    updatePayment(s.id, {
      status: st,
      paidDate: st === 'paid' ? (current.paidDate || formatDateStr(new Date())) : (st === 'pending' ? '' : current.paidDate),
    });
  };

  const markAllPaid = () => {
    if (!confirm(`${yearMonth} 기준으로 표시된 학생 전원을 납부완료로 변경합니다. 진행하시겠습니까?`)) return;
    const today = formatDateStr(new Date());
    setStudents(students.map(s => {
      if (!filtered.some(f => f.id === s.id)) return s;
      return {
        ...s,
        payments: {
          ...(s.payments || {}),
          [yearMonth]: { status: 'paid', paidDate: today, note: getPayment(s).note || '' },
        },
      };
    }));
  };

  // 선택한 달에 등록(재원)했던 학생인지 판단 — 그 달 이전에 온 적 없거나 퇴원 이후인 학생은 제외
  const prevYmOf = (ym) => {
    const [y, m] = ym.split('-').map(Number);
    const d = new Date(y, m - 2, 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  };
  // 실제 내용이 있는 납부 기록인지 (실수 클릭으로 생긴 빈 기록은 무시)
  const isRealPayment = (p) => !!(p && (p.status === 'paid' || p.status === 'refunded' || p.paidDate || p.dueDate || p.method || (p.note && p.note.trim())));
  // 그 달 전체가 휴원(쉼) 기간에 포함되는지 — 과거 휴원 기록 + 현재 휴원 모두 확인
  const isMonthInRestGap = (s, ym) => {
    const gaps = [...(s.suspendHistory || [])];
    if (s.isSuspended && s.suspendStart) gaps.push({ start: s.suspendStart, end: s.suspendEnd || '' });
    if (gaps.length === 0) return false;
    const [yy, mm] = ym.split('-').map(Number);
    const monthStart = ym + '-01';
    const monthEnd = formatDateStr(new Date(yy, mm, 0));
    // 달 전체가 쉼 기간 안에 있을 때만 제외 (일부만 걸친 달은 청구 대상일 수 있어 표시)
    return gaps.some(g => g && g.start && g.start <= monthStart && (g.end || '9999-12-31') >= monthEnd);
  };
  const isEnrolledInMonth = (s, ym) => {
    if (s.payments && isRealPayment(s.payments[ym])) return true; // 그 달에 실제 납부 기록이 있으면 표시
    if (isMonthInRestGap(s, ym)) return false; // 통째로 쉰 달은 제외
    // 첫 등원일이 입력되어 있으면 그게 기준 (가장 정확)
    if (s.enrollDate) {
      if (ym < s.enrollDate.slice(0, 7)) return false;
      if (s.isWithdrawn && s.withdrawnDate && ym > s.withdrawnDate.slice(0, 7)) return false;
      return true;
    }
    const known = [];
    Object.keys(s.payments || {}).forEach(k => { if (isRealPayment(s.payments[k])) known.push(k); });
    (s.cycleHistory || []).forEach(h => {
      if (h.yearMonth) known.push(h.yearMonth);
      (h.subjects || []).forEach(hs => { if (hs.startDate) known.push(hs.startDate.slice(0, 7)); });
    });
    (s.subjects || []).forEach(sub => {
      if (sub.startDate) {
        const m = sub.startDate.slice(0, 7);
        known.push(sub.isNew ? m : prevYmOf(m)); // 신규가 아니면 지난 주기(약 한 달 전)부터 재원으로 간주
      }
    });
    if (known.length === 0) return true; // 판단할 정보가 없으면 표시
    const first = known.sort()[0];
    if (ym < first) return false; // 등록 전 달
    if (s.isWithdrawn && s.withdrawnDate && ym > s.withdrawnDate.slice(0, 7)) return false; // 퇴원 다음 달부터 제외
    return true;
  };

  // 재원생만 대상 (퇴원·휴원생은 납부 대상 아님 — 통계 기준). 선택한 달 재원생만.
  const activeStudents = students.filter(s => !s.isWithdrawn && !s.isSuspended && isEnrolledInMonth(s, yearMonth));

  // 목록은 옵션에 따라 퇴원·휴원생 포함 (과거 납부 이력 조회용) — 역시 그 달 재원생만
  const listBase = includeInactive ? students.filter(s => isEnrolledInMonth(s, yearMonth)) : activeStudents;
  const filtered = sortStudentsByName(listBase.filter(s => {
    if (search && !s.name.includes(search)) return false;
    const st = getPayment(s).status || 'pending';
    if (filter === 'paid') return st === 'paid';
    if (filter === 'unpaid') return st !== 'paid' && st !== 'refunded';
    if (filter === 'refunded') return st === 'refunded';
    return true;
  }));

  const stOf = (s) => getPayment(s).status || 'pending';
  const paidCount = activeStudents.filter(s => stOf(s) === 'paid').length;
  const refundedCount = activeStudents.filter(s => stOf(s) === 'refunded').length;
  const unpaidCount = activeStudents.length - paidCount - refundedCount;
  const paidAmount = activeStudents.filter(s => stOf(s) === 'paid').reduce((sum, s) => sum + getAmount(s), 0);
  const unpaidAmount = activeStudents.filter(s => stOf(s) !== 'paid' && stOf(s) !== 'refunded').reduce((sum, s) => sum + getAmount(s), 0);

  const copyUnpaidList = () => {
    const unpaid = sortStudentsByName(activeStudents.filter(s => stOf(s) !== 'paid' && stOf(s) !== 'refunded'));
    if (unpaid.length === 0) { alert('미납자 없음'); return; }
    const text = unpaid.map(s => `${s.name} - ${fmtWon(getAmount(s))}`).join('\n');
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => alert(`미납자 ${unpaid.length}명 목록이 클립보드에 복사되었습니다`));
    } else {
      alert(text);
    }
  };

  return (
    <div className="space-y-4">
      {/* 필터·검색 */}
      <div className="bg-white border rounded-lg p-4 flex gap-3 items-end flex-wrap">
        <div>
          <label className="block text-[11px] text-gray-500 mb-0.5">납부 대상 월</label>
          <input type="month" value={yearMonth} onChange={(e) => setYearMonth(e.target.value)} className="px-3 py-1.5 border rounded text-sm" />
        </div>
        <div>
          <label className="block text-[11px] text-gray-500 mb-0.5">검색</label>
          <input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="학생 이름..." className="px-3 py-1.5 border rounded text-sm" />
        </div>
        <div>
          <label className="block text-[11px] text-gray-500 mb-0.5">필터</label>
          <div className="flex gap-1">
            {[['all', '전체'], ['paid', '✓ 납부완료'], ['unpaid', '⚠ 미납'], ['refunded', '↩ 환불']].map(([k, l]) => (
              <button key={k} onClick={() => setFilter(k)} className={`px-3 py-1.5 rounded text-xs font-semibold transition ${filter === k ? 'invoice-navy text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}>
                {l}
              </button>
            ))}
          </div>
        </div>
        <label className="flex items-center gap-1.5 text-xs text-gray-600 cursor-pointer pb-1.5">
          <input type="checkbox" checked={includeInactive} onChange={(e) => setIncludeInactive(e.target.checked)} className="w-4 h-4" />
          퇴원·휴원 포함
        </label>
        <div className="flex-1"></div>
        <div className="flex gap-1">
          <button onClick={copyUnpaidList} className="px-3 py-1.5 bg-orange-500 text-white rounded text-xs font-semibold hover:bg-orange-600">📋 미납자 목록 복사</button>
          <button onClick={markAllPaid} className="px-3 py-1.5 bg-green-600 text-white rounded text-xs font-semibold hover:bg-green-700">✓ 표시된 전원 납부완료</button>
        </div>
      </div>

      {/* 통계 */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
        <StatCard title="이 달 재원생" value={privacyMode ? '••• ' : `${activeStudents.length}명`} color="blue" />
        <StatCard title="납부 완료" value={privacyMode ? '•••' : `${paidCount}명 · ${fmtWon(paidAmount)}`} color="green" />
        <StatCard title="미납" value={privacyMode ? '•••' : `${unpaidCount}명 · ${fmtWon(unpaidAmount)}${refundedCount > 0 ? ` (환불 ${refundedCount}명)` : ''}`} color="red" />
        <StatCard title="납부율" value={`${activeStudents.length === 0 ? 0 : Math.round((paidCount / activeStudents.length) * 100)}%`} color="orange" />
      </div>

      {/* 학생 목록 */}
      <div className="bg-white rounded-lg border overflow-hidden">
        <table className="w-full text-sm">
          <thead className="bg-gray-50 border-b">
            <tr>
              <th className="px-3 py-2 text-left font-semibold text-gray-700">학생</th>
              <th className="px-3 py-2 text-right font-semibold text-gray-700">납부액</th>
              <th className="px-3 py-2 text-center font-semibold text-gray-700">청구일 <span className="font-normal text-[10px] text-gray-400">(⚡=자동)</span></th>
              <th className="px-3 py-2 text-center font-semibold text-gray-700">상태</th>
              <th className="px-3 py-2 text-center font-semibold text-gray-700">납부일</th>
              <th className="px-3 py-2 text-center font-semibold text-gray-700">결제 수단</th>
              <th className="px-3 py-2 text-left font-semibold text-gray-700">메모</th>
              <th className="px-3 py-2 text-center font-semibold text-gray-700">이력</th>
            </tr>
          </thead>
          <tbody>
            {filtered.length === 0 && (
              <tr><td colSpan="8" className="px-3 py-8 text-center text-gray-400">해당 조건의 학생이 없습니다</td></tr>
            )}
            {filtered.map((s) => {
              const p = getPayment(s);
              const amount = getAmount(s);
              const st = p.status || 'pending';
              const isPaid = st === 'paid';
              return (
                <tr key={s.id} className={`border-b transition hover:bg-indigo-50 ${isPaid ? 'bg-green-50/40' : st === 'refunded' ? 'bg-purple-50/40' : ''} ${(s.isWithdrawn || s.isSuspended) ? 'opacity-70' : ''}`}>
                  <td className="px-3 py-2 font-semibold text-gray-800">
                    {s.name}
                    {s.isWithdrawn && <span className="ml-1.5 text-[9px] px-1.5 py-0.5 bg-rose-100 text-rose-700 rounded font-semibold">퇴원</span>}
                    {s.isSuspended && !s.isWithdrawn && <span className="ml-1.5 text-[9px] px-1.5 py-0.5 bg-amber-100 text-amber-700 rounded font-semibold">휴원</span>}
                  </td>
                  <td className="px-3 py-2 text-right font-medium text-gray-700">{fmtWon(amount)}</td>
                  <td className="px-3 py-2 text-center">
                    <div className="flex items-center gap-1 justify-center">
                      <input
                        type="date"
                        value={p.dueDate || ''}
                        onChange={(e) => updatePayment(s.id, { dueDate: e.target.value })}
                        className="text-xs px-1.5 py-0.5 border rounded"
                        title="교습비 청구일 (직접 수정 가능)"
                      />
                      <button
                        onClick={() => {
                          const due = autoDueForMonth(s);
                          if (!due) { alert(`${yearMonth.slice(5)}월에 해당하는 주기 일정을 찾지 못했어요.\n청구일을 직접 선택해주세요.`); return; }
                          updatePayment(s.id, { dueDate: due });
                        }}
                        className="px-1.5 py-0.5 text-xs bg-amber-100 hover:bg-amber-200 text-amber-700 rounded font-bold"
                        title="보고 있는 달의 주기 시작일로 자동 입력"
                      >⚡</button>
                    </div>
                  </td>
                  <td className="px-3 py-2 text-center">
                    <select
                      value={st}
                      onChange={(e) => setPayStatus(s, e.target.value)}
                      className={`px-2 py-1 rounded text-xs font-bold border cursor-pointer ${isPaid ? 'bg-green-600 text-white border-green-700' : st === 'refunded' ? 'bg-purple-100 text-purple-700 border-purple-300' : 'bg-red-50 text-red-700 border-red-300'}`}
                    >
                      <option value="pending">미납</option>
                      <option value="paid">✓ 납부완료</option>
                      <option value="refunded">↩ 환불</option>
                    </select>
                  </td>
                  <td className="px-3 py-2 text-center">
                    <input type="date" value={p.paidDate || ''} onChange={(e) => updatePayment(s.id, { paidDate: e.target.value })} className="text-xs px-1.5 py-0.5 border rounded" />
                  </td>
                  <td className="px-3 py-2 text-center">
                    <select
                      value={p.method || ''}
                      onChange={(e) => updatePayment(s.id, { method: e.target.value })}
                      className={`text-xs px-1.5 py-1 border rounded max-w-[150px] ${p.method ? 'text-gray-800' : 'text-gray-400'}`}
                      title="결제 수단"
                    >
                      <option value="">— 선택 —</option>
                      {PAYMENT_METHODS.map(m => <option key={m} value={m}>{m}</option>)}
                    </select>
                  </td>
                  <td className="px-3 py-2">
                    <input type="text" value={p.note || ''} onChange={(e) => updatePayment(s.id, { note: e.target.value })} placeholder="메모 (선택)" className="w-full px-2 py-1 text-xs border rounded" />
                  </td>
                  <td className="px-3 py-2 text-center">
                    <div className="flex gap-1 justify-center">
                      <button onClick={() => setHistoryStudent(s)} className="px-2 py-1 text-xs bg-indigo-100 hover:bg-indigo-200 text-indigo-700 rounded font-semibold" title="이 학생의 전체 납부 이력 보기">📜</button>
                      {!isPaid && (
                        <button
                          onClick={() => copyText(buildPaymentMessage(s, settings || DEFAULT_SETTINGS, getRegistrationDeadline(s, settings || DEFAULT_SETTINGS), amount))}
                          className="px-2 py-1 text-xs bg-yellow-100 hover:bg-yellow-200 text-yellow-700 rounded font-semibold"
                          title="학부모께 보낼 안내 문자 복사"
                        >📩</button>
                      )}
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {historyStudent && (
        <PaymentHistoryModal
          student={students.find(x => x.id === historyStudent.id) || historyStudent}
          onClose={() => setHistoryStudent(null)}
          onUpdate={(ym, patch) => updatePaymentForMonth(historyStudent.id, ym, patch)}
        />
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════
//  ☁️ 로그인 화면
// ═══════════════════════════════════════════════════

function LoginScreen({ onLoggedIn, onOffline }) {
  const [email, setEmail] = useState('');
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const [mode, setMode] = useState('login'); // 'login' | 'signup'

  const doLogin = async () => {
    if (!email.trim() || !pw) { setErr('이메일과 비밀번호를 입력하세요'); return; }
    setBusy(true); setErr('');
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pw });
      if (error) { setErr('로그인 실패 — 이메일 또는 비밀번호를 확인하세요'); setBusy(false); return; }
      onLoggedIn(data.user);
    } catch (e) {
      setErr('서버 연결에 실패했어요. 인터넷 연결을 확인하세요.');
      setBusy(false);
    }
  };

  // 처음 계정 만들기 (원장님이 명단에 추가해둔 이메일만 실제 사용 가능)
  const doSignup = async () => {
    if (!email.trim() || !pw) { setErr('이메일과 비밀번호를 입력하세요'); return; }
    if (pw.length < 6) { setErr('비밀번호는 6자 이상으로 만들어주세요'); return; }
    setBusy(true); setErr('');
    try {
      const { data, error } = await sb.auth.signUp({ email: email.trim(), password: pw });
      if (error) {
        setErr(error.message && error.message.includes('disabled')
          ? '지금은 새 가입이 막혀 있어요. 원장님께 문의하세요.'
          : '계정 만들기 실패 — 이미 있는 이메일이면 [로그인]으로 시도해보세요');
        setBusy(false);
        return;
      }
      if (data.session && data.user) { onLoggedIn(data.user); return; }
      // 이메일 확인이 켜져 있는 경우
      setBusy(false);
      setMode('login');
      setErr('✅ 계정이 만들어졌어요! 이메일 확인이 필요하면 받은 메일의 링크를 눌러주세요.');
    } catch (e) {
      setErr('서버 연결에 실패했어요. 인터넷 연결을 확인하세요.');
      setBusy(false);
    }
  };

  // 비밀번호 재설정 메일 보내기
  const doForgot = async () => {
    const target = email.trim() || prompt('비밀번호를 재설정할 이메일을 입력하세요');
    if (!target) return;
    try {
      await sb.auth.resetPasswordForEmail(target, { redirectTo: 'https://forcedunsan.github.io/academy/' });
      alert('📧 ' + target + ' 로 재설정 메일을 보냈어요.\n메일의 링크를 누르면 새 비밀번호를 만들 수 있습니다.\n(메일이 안 오면 스팸함도 확인해주세요)');
    } catch (e) {
      alert('메일 발송에 실패했어요. 잠시 후 다시 시도해주세요.');
    }
  };

  return (
    <div className="min-h-screen invoice-navy wave-bg flex items-center justify-center p-4">
      <div className="w-full max-w-sm">
        <div className="text-center mb-6">
          <div className="invoice-gold-text text-[11px] tracking-[0.25em] font-semibold mb-2">THE FORCE DUNSAN ACADEMY</div>
          <h1 className="text-white text-2xl font-bold">수강료 안내 생성기</h1>
          <p className="text-white/60 text-xs mt-2">학원에서 발급받은 계정으로 로그인하세요</p>
        </div>
        <div className="bg-white rounded-xl shadow-2xl p-6 space-y-3">
          <div className="flex rounded-lg overflow-hidden border border-gray-200">
            <button onClick={() => { setMode('login'); setErr(''); }} className={`flex-1 py-2 text-sm font-bold transition ${mode === 'login' ? 'bg-blue-600 text-white' : 'bg-gray-50 text-gray-500 hover:bg-gray-100'}`}>로그인</button>
            <button onClick={() => { setMode('signup'); setErr(''); }} className={`flex-1 py-2 text-sm font-bold transition ${mode === 'signup' ? 'bg-emerald-600 text-white' : 'bg-gray-50 text-gray-500 hover:bg-gray-100'}`}>처음 계정 만들기</button>
          </div>
          {mode === 'signup' && (
            <p className="text-[11px] text-emerald-700 bg-emerald-50 border border-emerald-200 rounded p-2 leading-relaxed">
              원장님이 <strong>계정 명단에 추가해둔 이메일</strong>로 비밀번호를 만들어 시작하세요.
            </p>
          )}
          <div>
            <label className="block text-xs font-semibold text-gray-700 mb-1">이메일</label>
            <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && (mode === 'login' ? doLogin() : doSignup())} className="w-full px-3 py-2.5 border rounded text-sm" placeholder="name@example.com" autoFocus />
          </div>
          <div>
            <label className="block text-xs font-semibold text-gray-700 mb-1">비밀번호</label>
            <input type="password" value={pw} onChange={(e) => setPw(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && (mode === 'login' ? doLogin() : doSignup())} className="w-full px-3 py-2.5 border rounded text-sm" placeholder="••••••••" />
          </div>
          {err && <div className={`text-xs font-semibold rounded p-2 ${err.startsWith('✅') ? 'text-emerald-700 bg-emerald-50 border border-emerald-200' : 'text-rose-600 bg-rose-50 border border-rose-200'}`}>{err}</div>}
          {mode === 'login' ? (
            <button onClick={doLogin} disabled={busy} className={`w-full py-2.5 rounded text-sm font-bold text-white transition ${busy ? 'bg-gray-400' : 'bg-blue-600 hover:bg-blue-700'}`}>
              {busy ? '로그인 중…' : '로그인'}
            </button>
          ) : (
            <button onClick={doSignup} disabled={busy} className={`w-full py-2.5 rounded text-sm font-bold text-white transition ${busy ? 'bg-gray-400' : 'bg-emerald-600 hover:bg-emerald-700'}`}>
              {busy ? '만드는 중…' : '계정 만들고 시작하기'}
            </button>
          )}
          <div className="text-center">
            <button onClick={doForgot} className="text-[11px] text-gray-400 hover:text-gray-600 underline">비밀번호를 잊었어요</button>
          </div>
          <p className="text-[10px] text-gray-400 text-center leading-relaxed">
            로그인하면 학생·납부 데이터가 서버에 안전하게 저장되고<br />다른 선생님과 실시간으로 공유됩니다.
          </p>
        </div>
        <div className="text-center mt-4">
          <button onClick={onOffline} className="text-[11px] text-white/50 hover:text-white/80 underline">
            로그인 없이 이 컴퓨터에서만 사용 (공유 안 됨)
          </button>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════
//  8. 메인 앱
// ═══════════════════════════════════════════════════

function App() {
  const [tab, setTab] = useState('invoices');
  const [privacyMode, setPrivacyMode] = useState(() => {
    try {
      return storage.get('tuition_privacy') === 'true';
    } catch { return false; }
  });
  // 프라이버시 모드 저장
  useEffect(() => {
    try { storage.set('tuition_privacy', privacyMode ? 'true' : 'false'); } catch {}
  }, [privacyMode]);
  const [students, setStudents] = useState(() => {
    try {
      const s = storage.get('tuition_students');
      if (s) return JSON.parse(s);
    } catch {}
    return [SAMPLE_STUDENT];
  });
  const [settings, setSettings] = useState(() => {
    try {
      const s = storage.get('tuition_settings');
      if (s) return { ...DEFAULT_SETTINGS, ...JSON.parse(s) };
    } catch {}
    return DEFAULT_SETTINGS;
  });
  const [selectedId, setSelectedId] = useState(students[0]?.id || null);
  const [editingStudent, setEditingStudent] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [scheduleStudentId, setScheduleStudentId] = useState(null); // 📆 월별 일정 조회 대상

  // ── ☁️ 클라우드 동기화 상태 ──
  const [cloudUser, setCloudUser] = useState(sb ? undefined : null); // undefined=확인 중, null=미로그인
  const [offlineMode, setOfflineMode] = useState(() => storage.get('tuition_offline_mode') === 'true');
  const [syncStatus, setSyncStatus] = useState('');
  const lastServerStampRef = useRef(null);
  const suppressPushRef = useRef(true); // 서버에서 불러온 직후 재업로드 방지
  const pushTimerRef = useRef(null);
  const channelRef = useRef(null); // 실시간 채널
  const [allowedInfo, setAllowedInfo] = useState(null); // null=확인 중, 'denied'=허용 안 됨, {email, is_admin}
  const isAdmin = !!(allowedInfo && allowedInfo !== 'denied' && allowedInfo.is_admin);
  const cloudReady = !!(cloudUser && allowedInfo && allowedInfo !== 'denied');

  // 로그인 세션 확인 (앱 시작 시 1회) + 비밀번호 재설정 링크 처리
  useEffect(() => {
    if (!sb || offlineMode) { setCloudUser(null); return; }
    sb.auth.getSession().then(({ data }) => {
      setCloudUser(data && data.session ? data.session.user : null);
    }).catch(() => setCloudUser(null));
    const { data: sub } = sb.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        const np = prompt('🔑 새 비밀번호를 입력하세요 (6자 이상)');
        if (np) sb.auth.updateUser({ password: np }).then(({ error }) => alert(error ? '변경 실패: ' + error.message : '✅ 비밀번호가 변경되었습니다. 이제 새 비밀번호로 로그인됩니다.'));
      }
      if (session && session.user) setCloudUser(session.user);
    });
    return () => { try { sub.subscription.unsubscribe(); } catch (e) {} };
  }, []);

  // 허용 명단 확인 (앱 내 계정 관리) — 명단 표가 아직 없으면(구 버전 서버) 그냥 통과
  useEffect(() => {
    if (!cloudUser) return;
    sb.from('allowed_emails').select('email,is_admin').eq('email', cloudUser.email).then(({ data, error }) => {
      if (error) { setAllowedInfo({ email: cloudUser.email, is_admin: false, legacy: true }); return; }
      setAllowedInfo(data && data.length > 0 ? data[0] : 'denied');
    }).catch(() => setAllowedInfo({ email: cloudUser.email, is_admin: false, legacy: true }));
  }, [cloudUser]);

  // 서버 데이터를 화면에 적용
  const applyServerData = (row) => {
    suppressPushRef.current = true;
    lastServerStampRef.current = row.updated_at;
    const d = row.data || {};
    if (Array.isArray(d.students)) setStudents(d.students);
    if (d.settings) setSettings({ ...DEFAULT_SETTINGS, ...d.settings });
  };

  // 서버에서 불러오기 (최초 1회 + 60초마다 + 창 포커스 시)
  const pullFromCloud = async (isFirst) => {
    if (!sb || !cloudUser) return;
    try {
      const { data: rows, error } = await sb.from('academy_state').select('*').eq('id', 1);
      if (error) throw error;
      if (!rows || rows.length === 0) {
        // 서버가 비어있음 → 이 컴퓨터의 데이터를 최초 업로드
        const { error: e2 } = await sb.from('academy_state').insert({ id: 1, data: { students, settings }, updated_by: cloudUser.email || '' });
        if (e2) throw e2;
        const { data: r2 } = await sb.from('academy_state').select('updated_at').eq('id', 1);
        if (r2 && r2[0]) lastServerStampRef.current = r2[0].updated_at;
        setSyncStatus('saved');
        return;
      }
      const row = rows[0];
      if (isFirst) {
        // 클라우드 도입 전 이 컴퓨터 데이터를 1회 자동 백업해둠 (만약을 위해)
        if (!storage.get('tuition_precloud_backup')) {
          storage.set('tuition_precloud_backup', storage.get('tuition_students') || '[]');
        }
        // 안전장치: 서버보다 이 컴퓨터에 학생이 훨씬 많으면 (실수로 빈 컴퓨터가 먼저 올린 경우) 물어봄
        const serverStudents = (row.data && Array.isArray(row.data.students)) ? row.data.students : [];
        const localReal = students.filter(s => s.id !== 'sample1');
        if (localReal.length >= serverStudents.length + 3) {
          const uploadLocal = confirm(
            `서버에 저장된 학생은 ${serverStudents.length}명인데, 이 컴퓨터에는 ${localReal.length}명이 있어요.\n\n` +
            `[확인] = 이 컴퓨터 데이터를 서버에 올려서 공유 (데이터가 많은 쪽 기준 — 권장)\n` +
            `[취소] = 서버 데이터로 이 화면을 덮어쓰기`
          );
          if (uploadLocal) {
            const { error: e3 } = await sb.from('academy_state').upsert({ id: 1, data: { students, settings }, updated_at: new Date().toISOString(), updated_by: cloudUser.email || '' });
            if (e3) throw e3;
            const { data: r3 } = await sb.from('academy_state').select('updated_at').eq('id', 1);
            if (r3 && r3[0]) lastServerStampRef.current = r3[0].updated_at;
            setSyncStatus('saved');
            return;
          }
        }
        applyServerData(row);
        setSyncStatus('saved');
      } else if (row.updated_at !== lastServerStampRef.current && !pushTimerRef.current) {
        // 다른 사람이 고친 내용 반영 (내가 저장 대기 중일 때는 건너뜀)
        applyServerData(row);
      }
    } catch (e) {
      console.log('[클라우드 불러오기 실패]', e);
      setSyncStatus('error');
    }
  };

  // 로그인 + 허용 확인되면 불러오기 시작 (60초 폴링은 실시간이 놓칠 때의 안전망)
  useEffect(() => {
    if (!cloudReady) return;
    pullFromCloud(true);
    const iv = setInterval(() => pullFromCloud(false), 60000);
    const onFocus = () => pullFromCloud(false);
    window.addEventListener('focus', onFocus);
    return () => { clearInterval(iv); window.removeEventListener('focus', onFocus); };
  }, [cloudReady]);

  // ⚡ 실시간 반영: 다른 사람이 저장하면 즉시 신호를 받아 바로 불러옴
  useEffect(() => {
    if (!cloudReady) return;
    const ch = sb.channel('academy-sync');
    ch.on('broadcast', { event: 'changed' }, (msg) => {
      if (msg && msg.payload && msg.payload.by === cloudUser.email) return; // 내 저장 신호는 무시
      pullFromCloud(false);
    }).subscribe();
    channelRef.current = ch;
    return () => { try { sb.removeChannel(ch); } catch (e) {} channelRef.current = null; };
  }, [cloudReady]);

  // 데이터가 바뀌면 서버에 자동 저장 (1.5초 묶어서) + 저장 후 실시간 신호 발송
  useEffect(() => {
    if (!sb || !cloudReady) return;
    if (suppressPushRef.current) { suppressPushRef.current = false; return; }
    setSyncStatus('saving');
    if (pushTimerRef.current) clearTimeout(pushTimerRef.current);
    pushTimerRef.current = setTimeout(async () => {
      pushTimerRef.current = null;
      try {
        const { error } = await sb.from('academy_state').upsert({ id: 1, data: { students, settings }, updated_at: new Date().toISOString(), updated_by: cloudUser.email || '' });
        if (error) throw error;
        const { data: r2 } = await sb.from('academy_state').select('updated_at').eq('id', 1);
        if (r2 && r2[0]) lastServerStampRef.current = r2[0].updated_at;
        setSyncStatus('saved');
        // ⚡ 다른 화면들에게 "바뀌었어요" 신호 → 즉시 반영됨
        if (channelRef.current) {
          try { channelRef.current.send({ type: 'broadcast', event: 'changed', payload: { by: cloudUser.email } }); } catch (e) {}
        }
      } catch (e) {
        console.log('[클라우드 저장 실패]', e);
        setSyncStatus('error');
      }
    }, 1500);
  }, [students, settings, cloudReady]);
  const [showBulkImport, setShowBulkImport] = useState(false);
  const [backupReminder, setBackupReminder] = useState(null); // null | {daysSinceBackup}

  useEffect(() => { storage.set('tuition_students', JSON.stringify(students)); }, [students]);
  useEffect(() => { storage.set('tuition_settings', JSON.stringify(settings)); }, [settings]);
  
  // 색상 테마 적용 (settings.colorTheme 변경 시)
  useEffect(() => {
    applyColorTheme(settings.colorTheme || 'navy');
  }, [settings.colorTheme]);

  // 자동 백업 알림 체크 (앱 시작 시 1회)
  useEffect(() => {
    // 학생 데이터 없으면 알림 안 띄움
    if (students.length === 0) return;

    // 스누즈 확인
    const snoozeUntil = storage.get('tuition_backup_snooze_until');
    if (snoozeUntil && new Date(snoozeUntil) > new Date()) return;

    const lastBackup = storage.get('tuition_last_backup_at');
    if (!lastBackup) {
      // 한 번도 백업 안 했는데 학생은 있음 → 알림
      setBackupReminder({ daysSinceBackup: null });
      return;
    }

    const daysAgo = Math.floor((Date.now() - new Date(lastBackup).getTime()) / (1000 * 60 * 60 * 24));
    if (daysAgo >= 7) {
      setBackupReminder({ daysSinceBackup: daysAgo });
    }
  }, []); // 앱 마운트 시 1회만 실행

  const handleAddStudent = () => { setEditingStudent(null); setShowForm(true); };
  const handleEditStudent = (id) => { setEditingStudent(students.find(s => s.id === id)); setShowForm(true); };
  const handleDeleteStudent = (id) => {
    setStudents(students.filter(s => s.id !== id));
    if (selectedId === id) setSelectedId(students.find(s => s.id !== id)?.id || null);
  };
  const handleDuplicateStudent = (id) => {
    const orig = students.find(s => s.id === id);
    if (!orig) return;
    const copy = JSON.parse(JSON.stringify(orig));
    copy.id = uid();
    copy.name = orig.name + ' (복사)';
    copy.subjects = (copy.subjects || []).map(s => ({ ...s, id: uid() }));
    copy.materials = (copy.materials || []).map(m => ({ ...m, id: uid() }));
    setStudents([...students, copy]);
  };
  // 퇴원·휴원 학생 복귀 (정보·이력·납부 기록은 그대로 유지되어 있음)
  const handleRestoreStudent = (id) => {
    const t = students.find(s => s.id === id);
    if (!t) return;
    const label = t.isWithdrawn ? '퇴원' : '휴원';
    if (!confirm(`${t.name} 학생을 ${label} 해제하고 재원생으로 복귀시킬까요?\n\n과목·일정 이력·납부 기록은 그대로 살아납니다.`)) return;
    // 쉬었던 기간을 자동 기록 → 납부 현황에서 그 기간의 달은 빠짐
    const today = formatDateStr(new Date());
    const gap = t.isSuspended && t.suspendStart
      ? { start: t.suspendStart, end: t.suspendEnd || today }
      : (t.isWithdrawn && t.withdrawnDate ? { start: t.withdrawnDate, end: today } : null);
    setStudents(students.map(s => s.id === id ? {
      ...s,
      isWithdrawn: false, withdrawnDate: '', isSuspended: false, suspendStart: '', suspendEnd: '',
      suspendHistory: gap ? [...(s.suspendHistory || []), gap] : (s.suspendHistory || []),
    } : s));
    alert(`✅ ${t.name} 학생이 복귀되었습니다.${gap ? `\n\n😴 쉬었던 기간(${gap.start} ~ ${gap.end})이 자동 기록되어 납부 현황에서 그 기간의 달은 빠집니다.` : ''}\n\n📌 학생 편집에서 각 과목의 "이번 청구 주기 첫 수업일"을 복귀 후 첫 수업 날짜로 바꿔주세요.`);
  };
  const handleSaveStudent = (data) => {
    if (students.find(s => s.id === data.id)) {
      setStudents(students.map(s => s.id === data.id ? data : s));
    } else {
      setStudents([...students, data]);
      setSelectedId(data.id);
    }
    setShowForm(false);
    setEditingStudent(null);
  };

  const handleBulkImport = (newStudents) => {
    const existingNames = new Set(students.map(s => s.name));
    const toAdd = newStudents
      .filter(s => !existingNames.has(s.name))
      .map(s => ({
        id: uid(),
        name: s.name,
        schoolName: '',
        grade: '',
        parentContact: s.parentContact || '',
        note: '',
        periodDisplay: '',
        subjects: [],
        materials: [],
      }));
    const skipped = newStudents.length - toAdd.length;
    setStudents([...students, ...toAdd]);
    setShowBulkImport(false);
    let msg = `✅ ${toAdd.length}명 추가 완료`;
    if (skipped > 0) msg += `\n(동일 이름 ${skipped}명 건너뜀)`;
    msg += `\n\n각 학생의 과목·수강료는 편집해서 입력해주세요.`;
    alert(msg);
  };

  const handleExportJSON = () => {
    exportJSON(students, settings);
    setBackupReminder(null); // 백업 완료되면 알림 숨김
  };

  const handleBackupNow = () => {
    handleExportJSON();
  };

  const handleSnoozeBackup = () => {
    const snoozeUntil = new Date();
    snoozeUntil.setDate(snoozeUntil.getDate() + 1);
    storage.set('tuition_backup_snooze_until', snoozeUntil.toISOString());
    setBackupReminder(null);
  };

  const handleDismissBackupReminder = () => {
    const snoozeUntil = new Date();
    snoozeUntil.setDate(snoozeUntil.getDate() + 1);
    storage.set('tuition_backup_snooze_until', snoozeUntil.toISOString());
    setBackupReminder(null);
  };

  const handleImportJSON = (file) => {
    importJSON(file, (data) => {
      if (!confirm(`가져올 데이터:\n• 학생 ${data.students.length}명\n• 설정 포함\n\n현재 데이터를 덮어씁니다. 계속하시겠습니까?\n\n💡 먼저 현재 데이터를 백업으로 내보내두는 것을 권장합니다.`)) return;
      setStudents(data.students);
      if (data.settings) setSettings({ ...DEFAULT_SETTINGS, ...data.settings });
      setSelectedId(data.students[0]?.id || null);
      alert(`✅ 복원 완료: 학생 ${data.students.length}명`);
    });
  };

  const handleAdvanceAll = () => {
    const nowYM = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; })();
    const advanced = advanceAllStudents(students, settings.holidays, nowYM);
    const changes = [];
    students.forEach((orig, i) => {
      const nw = advanced[i];
      (orig.subjects || []).forEach((s, j) => {
        const ns = nw.subjects?.[j];
        if (ns && s.startDate !== ns.startDate) {
          changes.push(`${orig.name} ${s.name}: ${s.startDate} → ${ns.startDate}`);
        }
      });
    });
    if (changes.length === 0) {
      alert('변경할 학생이 없습니다. (모든 과목의 시작일 정보가 없거나 계산 불가)');
      return;
    }
    const preview = changes.slice(0, 8).join('\n') + (changes.length > 8 ? `\n\n... 외 ${changes.length - 8}건` : '');
    if (!confirm(`${changes.length}건의 시작일을 다음 주기로 이동합니다.\n\n미리보기:\n${preview}\n\n✅ 이동 전 현재 주기는 자동으로 이력에 저장됩니다.\n\n진행하시겠습니까?\n\n💡 이동 후에도 지난 일정·납부 기록은 [학생 관리 → 📆 일정]의 ✏️ 수정 모드에서 고칠 수 있습니다.`)) return;
    setStudents(advanced);
    alert(`✅ ${changes.length}건 업데이트 완료\n각 학생의 지난 주기가 이력에 저장되었습니다.`);
  };
  
  const handleAdvanceOne = (studentId) => {
    const target = students.find(s => s.id === studentId);
    if (!target) return;
    
    if (target.isWithdrawn) {
      alert('퇴원 학생은 다음 주기로 이동할 수 없습니다.');
      return;
    }
    if (target.isSuspended) {
      alert('휴원 학생은 다음 주기로 이동할 수 없습니다. 복귀 후 휴원 해제 후 진행해주세요.');
      return;
    }
    
    const nowYM = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; })();
    const advanced = advanceOneStudent(target, settings.holidays, nowYM);
    
    // 변경 내역 미리보기 생성
    const changes = [];
    if (target.isMonthly) {
      if (target.monthlyYearMonth !== advanced.monthlyYearMonth) {
        changes.push(`${target.name}: ${target.monthlyYearMonth || '미설정'} → ${advanced.monthlyYearMonth} (월정액)`);
      }
    } else {
      (target.subjects || []).forEach((s, j) => {
        const ns = advanced.subjects?.[j];
        if (ns && s.startDate !== ns.startDate) {
          changes.push(`${s.name}: ${s.startDate} → ${ns.startDate}`);
        }
      });
    }
    
    if (changes.length === 0) {
      alert(`${target.name} 학생의 시작일/대상월 정보가 없거나 계산할 수 없습니다.`);
      return;
    }
    
    const preview = changes.join('\n');
    const msg = `▶ ${target.name} 학생을 다음 주기로 이동합니다.\n\n미리보기:\n${preview}\n\n✅ 이동 전 현재 주기는 자동으로 이력에 저장됩니다.\n\n진행하시겠습니까?\n\n💡 이동 후에도 지난 일정·납부 기록은 [학생 관리 → 📆 일정]의 ✏️ 수정 모드에서 고칠 수 있습니다.`;
    
    if (!confirm(msg)) return;
    
    setStudents(students.map(s => s.id === studentId ? advanced : s));
    alert(`✅ ${target.name} 학생이 다음 주기로 이동되었습니다.`);
  };

  // 🔔 알림 게시판 (배너를 닫아도 언제든 다시 보기)
  const [showAlertBoard, setShowAlertBoard] = useState(false);
  const alertsNow = computeTuitionAlerts(students, settings);
  const alertCount = alertsNow.items.length + alertsNow.overdueUnpaid.length;

  // ☁️ 로그인 화면 (오프라인 모드가 아니면 로그인 필요)
  if (sb && !offlineMode) {
    if (cloudUser === undefined) {
      return (
        <div className="min-h-screen invoice-navy flex items-center justify-center">
          <div className="text-white/70 text-sm">☁️ 서버 연결 확인 중…</div>
        </div>
      );
    }
    if (cloudUser === null) {
      return (
        <LoginScreen
          onLoggedIn={(u) => setCloudUser(u)}
          onOffline={() => { storage.set('tuition_offline_mode', 'true'); setOfflineMode(true); }}
        />
      );
    }
    if (allowedInfo === 'denied') {
      return (
        <div className="min-h-screen invoice-navy flex items-center justify-center p-4">
          <div className="bg-white rounded-xl shadow-2xl p-6 max-w-sm text-center">
            <div className="text-3xl mb-2">🚫</div>
            <h2 className="font-bold text-gray-800 mb-2">아직 사용 허가가 없는 계정이에요</h2>
            <p className="text-sm text-gray-600 leading-relaxed mb-4">
              <strong>{cloudUser.email}</strong><br />
              원장님께 이 이메일을 <strong>계정 명단에 추가</strong>해 달라고 요청하세요.<br />
              (학원 정보 탭 → 👥 계정 관리)
            </p>
            <button
              onClick={async () => { await sb.auth.signOut(); location.reload(); }}
              className="px-4 py-2 bg-gray-700 text-white rounded text-sm font-semibold"
            >다른 계정으로 로그인</button>
          </div>
        </div>
      );
    }
  }

  return (
    <div className="min-h-screen">
      {/* 상단 헤더 */}
      <header className="invoice-navy text-white shadow-lg no-print">
        <div className="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between flex-wrap gap-2">
          <div>
            <div className="invoice-gold-text text-[10px] tracking-[0.25em] font-semibold">
              {settings.academyNameEn}
            </div>
            <h1 className="text-lg font-bold">{settings.academyName} · 수강료 안내 생성기</h1>
          </div>
          <div className="flex items-center gap-3">
            {sb && cloudUser && (
              <div className="flex items-center gap-1.5 text-[10px]">
                <span className={syncStatus === 'error' ? 'text-rose-300 font-bold' : 'text-white/60'} title={cloudUser.email}>
                  {syncStatus === 'saving' ? '☁️ 저장 중…' : syncStatus === 'error' ? '⚠️ 저장 실패 (인터넷 확인)' : '☁️ 동기화됨'}
                </span>
                <button
                  onClick={async () => { if (confirm('로그아웃할까요?')) { await sb.auth.signOut(); location.reload(); } }}
                  className="underline text-white/50 hover:text-white"
                  title={cloudUser.email}
                >로그아웃</button>
              </div>
            )}
            {sb && !cloudUser && offlineMode && (
              <button
                onClick={() => { storage.set('tuition_offline_mode', ''); location.reload(); }}
                className="text-[10px] underline text-white/50 hover:text-white"
                title="로그인하면 다른 선생님과 데이터가 공유됩니다"
              >☁️ 로그인하기</button>
            )}
            <button
              onClick={() => setShowAlertBoard(true)}
              className="relative px-3 py-1.5 rounded-full text-xs font-semibold bg-white/15 text-white/90 hover:bg-white/25 transition"
              title="알림 게시판 — 마감 임박·미납 학생을 언제든 다시 볼 수 있어요"
            >
              🔔 알림
              {alertCount > 0 && (
                <span className="absolute -top-1.5 -right-1.5 bg-rose-500 text-white text-[10px] font-bold rounded-full min-w-[18px] h-[18px] flex items-center justify-center px-1">{alertCount}</span>
              )}
            </button>
            <button
              onClick={() => setPrivacyMode(!privacyMode)}
              className={`px-3 py-1.5 rounded-full text-xs font-semibold transition flex items-center gap-1.5 ${privacyMode ? 'bg-rose-500 text-white' : 'bg-white/15 text-white/90 hover:bg-white/25'}`}
              title={privacyMode ? '프라이버시 모드 ON - 학생수·매출 숨김 (클릭하면 해제)' : '프라이버시 모드 OFF - 정보 표시 중 (클릭하면 숨김)'}
            >
              {privacyMode ? '🔒 비공개 모드' : '🔓 공개 모드'}
            </button>
            <div className="text-xs invoice-gold-text">
              {privacyMode ? '학생 관리 중' : `학생 ${students.length}명 관리 중`}
            </div>
          </div>
        </div>
        <nav className="max-w-7xl mx-auto px-4 flex gap-1">
          {[
            { id: 'invoices', label: '📋 수강료 안내문' },
            { id: 'students', label: '👥 학생 관리' },
            { id: 'payments', label: '💰 납부 현황' },
            { id: 'reports', label: '📊 통계·리포트' },
            { id: 'notice', label: '📢 공지사항' },
            { id: 'policy', label: '📜 수강 원칙' },
            { id: 'settings', label: '⚙️ 학원 정보' },
          ].map(t => (
            <button key={t.id} onClick={() => setTab(t.id)} className={`px-4 py-2 text-sm font-medium rounded-t-md transition ${tab === t.id ? 'bg-gray-100 text-gray-800' : 'text-white/80 hover:bg-white/10'}`}>
              {t.label}
            </button>
          ))}
        </nav>
      </header>

      <main className="max-w-7xl mx-auto p-4">
        {backupReminder && (
          <BackupReminder
            daysSinceBackup={backupReminder.daysSinceBackup}
            onBackupNow={handleBackupNow}
            onSnooze={handleSnoozeBackup}
            onDismiss={handleDismissBackupReminder}
          />
        )}
        <TuitionReminderBanner
          students={students}
          settings={settings}
          onGoStudent={(id) => { setSelectedId(id); setTab('invoices'); }}
          onGoPayments={() => setTab('payments')}
        />

        {tab === 'students' && (
          <StudentListTab
            students={students}
            onAdd={handleAddStudent}
            onEdit={handleEditStudent}
            onDelete={handleDeleteStudent}
            onDuplicate={handleDuplicateStudent}
            onSelect={(id) => { setSelectedId(id); setTab('invoices'); }}
            selectedId={selectedId}
            onBulkImport={() => setShowBulkImport(true)}
            onExportJSON={handleExportJSON}
            onImportJSON={handleImportJSON}
            onAdvanceAll={handleAdvanceAll}
            onAdvanceOne={handleAdvanceOne}
            onShowSchedule={(id) => setScheduleStudentId(id)}
            onRestore={handleRestoreStudent}
          />
        )}
        {scheduleStudentId && (
          <ScheduleHistoryModal
            student={students.find(s => s.id === scheduleStudentId)}
            settings={settings}
            onClose={() => setScheduleStudentId(null)}
            onUpdateStudent={(patch) => setStudents(students.map(s => s.id === scheduleStudentId ? { ...s, ...patch } : s))}
          />
        )}
        {showAlertBoard && (
          <AlertBoardModal
            students={students}
            settings={settings}
            onClose={() => setShowAlertBoard(false)}
            onGoStudent={(id) => { setSelectedId(id); setTab('invoices'); }}
            onGoPayments={() => setTab('payments')}
          />
        )}
        {tab === 'invoices' && (
          <InvoiceTab
            students={students}
            settings={settings}
            selectedId={selectedId}
            onSelect={setSelectedId}
            privacyMode={privacyMode}
          />
        )}
        {tab === 'payments' && (
          <PaymentTab students={students} setStudents={setStudents} privacyMode={privacyMode} settings={settings} />
        )}
        {tab === 'reports' && (
          <ReportsTab students={students} settings={settings} privacyMode={privacyMode} />
        )}
        {tab === 'notice' && (
          <NoticeTab settings={settings} />
        )}
        {tab === 'policy' && (
          <PolicyTab settings={settings} />
        )}
        {tab === 'settings' && (
          <SettingsTab settings={settings} setSettings={setSettings} students={students} cloudUser={cloudUser} isAdmin={isAdmin} />
        )}
      </main>

      {showForm && (
        <StudentForm
          student={editingStudent}
          defaultSettings={settings}
          onSave={handleSaveStudent}
          onCancel={() => { setShowForm(false); setEditingStudent(null); }}
        />
      )}

      {showBulkImport && (
        <ImportStudentsModal
          onImport={handleBulkImport}
          onCancel={() => setShowBulkImport(false)}
        />
      )}

      <footer className="no-print py-4 text-center text-xs text-gray-400">
        모든 데이터는 이 브라우저에 자동 저장됩니다 · localStorage
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
