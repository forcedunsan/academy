const parseDate = (str) => {
  if (!str) return null;
  const [y, m, d] = str.split('-').map(Number);
  if (!y || !m || !d) return null;
  return new Date(y, m - 1, d);
};

const formatDateStr = (date) => {
  if (!date || isNaN(date)) return '';
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
};

const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };

const fmtKDate = (d) => d ? `${String(d.getMonth() + 1).padStart(2, '0')}월 ${String(d.getDate()).padStart(2, '0')}일` : '';
const fmtKMonth = (d) => d ? `${String(d.getMonth() + 1).padStart(2, '0')}월` : '';
const fmtKYearMonth = (d) => d ? `${d.getFullYear()}년 ${String(d.getMonth() + 1).padStart(2, '0')}월` : '';
const fmtWon = (n) => (n || 0).toLocaleString('ko-KR') + '원';

// 학생 가나다순 정렬 (이름 → 학교 → 학년)
const sortStudentsByName = (students) => {
  if (!Array.isArray(students)) return students;
  return [...students].sort((a, b) => {
    // 1순위: 이름 가나다순 (한글 우선)
    const nameCompare = (a.name || '').localeCompare(b.name || '', 'ko');
    if (nameCompare !== 0) return nameCompare;
    // 2순위: 동명이인이면 학교명
    const schoolCompare = (a.schoolName || '').localeCompare(b.schoolName || '', 'ko');
    if (schoolCompare !== 0) return schoolCompare;
    // 3순위: 학년
    return (a.grade || '').localeCompare(b.grade || '', 'ko');
  });
};

// 회차 계산 (휴일 제외)
const getClassSessions = (startDate, classDays, sessionsCount, holidaySet, skipHolidays) => {
  if (!startDate || !classDays || classDays.length === 0) return [];
  const skipSet = new Set(skipHolidays || []); // 이 과목에서 무시할 휴원일 목록
  const sessions = [];
  let current = new Date(startDate);
  let iter = 0;
  while (sessions.length < sessionsCount && iter < 365) {
    const dow = current.getDay();
    const dstr = formatDateStr(current);
    // 휴원일이지만 skipHolidays에 있으면 → 이 과목은 수업한 것으로 처리
    const isHoliday = holidaySet.has(dstr) && !skipSet.has(dstr);
    if (classDays.includes(dow) && !isHoliday) {
      sessions.push({ date: new Date(current), sessionNum: sessions.length + 1 });
    }
    current = addDays(current, 1);
    iter++;
  }
  return sessions;
};

const getNextClassDay = (afterDate, classDays, holidaySet) => {
  if (!afterDate) return null;
  let current = addDays(afterDate, 1);
  let iter = 0;
  while (iter < 60) {
    const dow = current.getDay();
    const dstr = formatDateStr(current);
    if (classDays.includes(dow) && !holidaySet.has(dstr)) return current;
    current = addDays(current, 1);
    iter++;
  }
  return null;
};

// 지난 주기 역산: beforeDate 이전으로 거슬러 올라가 sessionsCount 회차 찾기
// (진행 캘린더 계산용)
const getPreviousCycleSessions = (beforeDate, classDays, sessionsCount, holidaySet, skipHolidays) => {
  if (!beforeDate || !classDays || classDays.length === 0) return [];
  const skipSet = new Set(skipHolidays || []);
  const sessions = [];
  let current = addDays(beforeDate, -1); // 기준일 하루 전부터
  let iter = 0;
  while (sessions.length < sessionsCount && iter < 365) {
    const dow = current.getDay();
    const dstr = formatDateStr(current);
    // 휴원일이지만 skipHolidays에 있으면 → 이 과목은 수업한 것으로 처리
    const isHoliday = holidaySet.has(dstr) && !skipSet.has(dstr);
    if (classDays.includes(dow) && !isHoliday) {
      sessions.unshift({ date: new Date(current), sessionNum: 0 });
    }
    current = addDays(current, -1);
    iter++;
  }
  // 정순(과거→최근)으로 회차 번호 부여
  sessions.forEach((s, i) => { s.sessionNum = i + 1; });
  return sessions;
};

// ─── 일정 변경(수정/추가/삭제)을 자동 회차에 적용해 최종 회차 목록 산출 ───
// 날짜(originalDate) 기준으로 매칭 — 회차 번호 기준 매칭은 휴일·시작일이 바뀌면 어긋나므로 사용하지 않음
// sessions: 자동 계산 회차 [{date, sessionNum}]
// opts: { cycleStartStr, cycleEndStr(원래 날짜 매칭 범위), addFrom, addTo(추가 수업 표시 범위, ''=무제한) }
// 반환: { finals: [{dateStr, num, autoNum, originalDate, adjusted, isExtra, note, srcIdx}], deleted: [삭제 레코드+srcIdx] }
const applyScheduleAdjustments = (sessions, allAdj, opts) => {
  const list = (allAdj || []).map((a, srcIdx) => ({ ...a, srcIdx }));
  const inRange = (d, from, to) => !!d && d >= from && (!to || d <= to);
  const modifies = list.filter(a => { const t = a.type || 'modify'; return t === 'modify' && inRange(a.originalDate, opts.cycleStartStr, opts.cycleEndStr); });
  const deletes = list.filter(a => a.type === 'delete' && inRange(a.originalDate, opts.cycleStartStr, opts.cycleEndStr));
  const adds = list.filter(a => a.type === 'add' && inRange(a.date, opts.addFrom, opts.addTo));

  const sessionKeys = new Set(sessions.map(s => formatDateStr(s.date)));
  const modifyMap = new Map(); // originalDate → 수정 레코드
  const rescued = [];          // 자동 회차에 없는 날짜의 '수정' → 새 날짜의 추가 수업으로 살려서 반영 (조용히 사라지는 것 방지)
  modifies.forEach(a => {
    if (sessionKeys.has(a.originalDate)) modifyMap.set(a.originalDate, a);
    else if (inRange(a.newDate, opts.addFrom, opts.addTo)) rescued.push(a);
  });
  const deleteSet = new Set(deletes.map(a => a.originalDate));

  const finals = [];
  sessions.forEach(s => {
    const k = formatDateStr(s.date);
    if (deleteSet.has(k)) return;
    const adj = modifyMap.get(k);
    finals.push({
      dateStr: adj ? adj.newDate : k,
      autoNum: s.sessionNum,
      originalDate: k,
      adjusted: !!adj && adj.newDate !== k, // 날짜 그대로면 사유(메모)만 담긴 레코드 → 이동 표시 안 함
      isExtra: false,
      note: (adj && adj.note) || '',
      srcIdx: adj ? adj.srcIdx : -1,
    });
  });
  adds.forEach(a => finals.push({ dateStr: a.date, autoNum: 0, originalDate: null, adjusted: false, isExtra: true, note: a.note || '', srcIdx: a.srcIdx }));
  rescued.forEach(a => finals.push({ dateStr: a.newDate, autoNum: 0, originalDate: null, adjusted: false, isExtra: true, note: a.note || '일정 변경', srcIdx: a.srcIdx }));

  // 휴원일과 겹친 회차(이동·추가로 고정된 날짜에 나중에 휴원일이 등록된 경우)는
  // 다음 수업 요일(휴원일 제외)로 자동으로 밀어준다
  if (opts.holidaySet && opts.holidaySet.size > 0) {
    const skipSet2 = new Set(opts.skipHolidays || []);
    const isHol = (ds) => opts.holidaySet.has(ds) && !skipSet2.has(ds);
    finals.forEach(f => {
      if (!isHol(f.dateStr)) return;
      let d = parseDate(f.dateStr);
      let iter = 0;
      while (iter < 60) {
        d = addDays(d, 1);
        iter++;
        const ds = formatDateStr(d);
        const dow = d.getDay();
        const dayOk = !opts.classDays || opts.classDays.length === 0 || opts.classDays.includes(dow);
        if (!isHol(ds) && dayOk) {
          f.dateStr = ds;
          f.holidayShifted = true;
          break;
        }
      }
    });
  }

  if (adds.length + rescued.length > 0) finals.sort((x, y) => x.dateStr.localeCompare(y.dateStr));
  finals.forEach((f, i) => { f.num = i + 1; });
  return { finals, deleted: deletes };
};

  if (subjectName.includes('사회') || subjectName.includes('역사')) return 'chip-social';
  return 'chip-default';

const DEFAULT_SUBJECT_COLOR = { bg: '#E5E7EB', text: '#374151', badge: '#6B7280' };

function resolveSubjectColor(subjectName, settings) {
  if (!settings || !settings.subjectColors) return DEFAULT_SUBJECT_COLOR;
  // 정확히 일치하는 이름 먼저
  if (settings.subjectColors[subjectName]) return settings.subjectColors[subjectName];
  // 키워드 매칭 (예: "고등 영어" → "영어")
  for (const key of Object.keys(settings.subjectColors)) {
    if (subjectName && subjectName.includes(key)) return settings.subjectColors[key];
  }
  return DEFAULT_SUBJECT_COLOR;
}

// 특정 월의 달력 주 배열 생성
function buildMonthWeeks(year, month) {
  const firstDay = new Date(year, month - 1, 1);
  const lastDay = new Date(year, month, 0);
  const gridStart = new Date(firstDay);
  gridStart.setDate(firstDay.getDate() - firstDay.getDay());
  const gridEnd = new Date(lastDay);
  gridEnd.setDate(lastDay.getDate() + (6 - lastDay.getDay()));

  const weeks = [];
  let cur = new Date(gridStart);
  while (cur <= gridEnd) {
    const week = [];
    for (let i = 0; i < 7; i++) {
      week.push(new Date(cur));
      cur = addDays(cur, 1);
    }
    weeks.push(week);
  }
  return weeks;
}

// 수업 스케줄을 월-일자 키 맵으로 변환 (학생별 결석 포함)
function buildSessionMap(student, settings, mode) {
  const holidaySet = new Set((settings.holidays || []).map(h => h.date));
  const subjectData = [];
  const sessionMap = new Map();

  (student.subjects || []).forEach((sub, subIdx) => {
    if (!sub.startDate || !sub.classDays || sub.classDays.length === 0) {
      subjectData.push({ ...sub, index: subIdx, sessions: [], startDate: null, endDate: null });
      return;
    }

    // 입력된 startDate = 이번 청구 주기(계획)의 시작일
    const newCycleStart = parseDate(sub.startDate);
    let sessions = [];
    let cycleStart = null, cycleEnd = null;

    // 지난 주기 전용 요일·회차 (설정 안 했으면 이번 주기와 동일)
    const prevDays = (sub.prevClassDays && sub.prevClassDays.length > 0) ? sub.prevClassDays : sub.classDays;
    const prevTotal = sub.prevTotalSessions || sub.totalSessions;
    const usedDays = mode === 'plan' ? sub.classDays : prevDays;
    const usedTotal = mode === 'plan' ? sub.totalSessions : prevTotal;

    if (mode === 'plan') {
      // 계획 = 이번 청구 주기 (입력된 시작일부터 정방향)
      sessions = getClassSessions(newCycleStart, sub.classDays, sub.totalSessions, holidaySet, sub.skipHolidays);
      if (sessions.length > 0) {
        cycleStart = sessions[0].date;
        cycleEnd = sessions[sessions.length - 1].date;
      }
    } else {
      // 진행 = 지난 주기 (신규 등록이면 비움)
      if (sub.isNew) {
        subjectData.push({ ...sub, index: subIdx, sessions: [], startDate: null, endDate: null, isNew: true });
        return;
      }

      // 1) "다음 주기로 이동" 때 저장된 실제 일정 기록이 있으면 그걸 그대로 표시
      //    (📆 월별 일정의 ✏️ 수정 모드에서 고친 내용도 즉시 반영됨)
      const hists = student.cycleHistory || [];
      let histSubj = null;
      for (let i = hists.length - 1; i >= 0; i--) {
        const hs = (hists[i].subjects || []).find(x => x.name === sub.name && (x.schedule || []).length > 0);
        if (hs) { histSubj = hs; break; }
      }
      if (histSubj) {
        const histAbsent = new Set([
          ...(histSubj.absences || []).map(a => a.date),
          ...((student.absences || []).filter(a => a.subjectId === sub.id).map(a => a.date)),
        ]);
        histSubj.schedule.forEach(s => {
          if (!s.date) return;
          if (!sessionMap.has(s.date)) sessionMap.set(s.date, []);
          sessionMap.get(s.date).push({
            subjectIndex: subIdx, subjectName: sub.name, sessionNum: s.num,
            absent: histAbsent.has(s.date), adjusted: !!s.adjusted, originalDate: null,
            isExtra: !!s.isExtra, note: s.note || '',
          });
        });
        // 보강: 기록 속 보강 + 지금 새로 입력한 보강(다음 주기 시작 전 날짜) 합쳐서 표시
        const histMakeups = [...(histSubj.makeups || [])];
        const planStartStr = formatDateStr(newCycleStart);
        (sub.makeups || []).forEach(m => {
          if (!m.date) return;
          if (m.date < planStartStr && !histMakeups.some(x => x.date === m.date)) histMakeups.push(m);
        });
        histMakeups.forEach(m => {
          if (!m.date) return;
          if (!sessionMap.has(m.date)) sessionMap.set(m.date, []);
          sessionMap.get(m.date).push({ subjectIndex: subIdx, subjectName: sub.name, sessionNum: 0, absent: false, isMakeup: true, makeupNote: m.note || '' });
        });
        const ds = histSubj.schedule.map(s => s.date).filter(Boolean).sort();
        subjectData.push({
          ...sub, index: subIdx,
          classDays: prevDays,
          totalSessions: histSubj.schedule.length,
          sessions: histSubj.schedule.map(s => ({ date: parseDate(s.date), sessionNum: s.num })),
          startDate: parseDate(ds[0]),
          endDate: parseDate(ds[ds.length - 1]),
          absentCount: histSubj.schedule.filter(s => histAbsent.has(s.date)).length,
          makeupCount: histMakeups.length,
        });
        return;
      }

      // 2) 기록이 없으면 요일 패턴으로 역산 (지난 주기 전용 요일·회차 사용)
      sessions = getPreviousCycleSessions(newCycleStart, prevDays, prevTotal, holidaySet, sub.skipHolidays);
      if (sessions.length > 0) {
        cycleStart = sessions[0].date;
        cycleEnd = sessions[sessions.length - 1].date;
      }
    }

    if (sessions.length === 0) {
      subjectData.push({ ...sub, index: subIdx, sessions: [], startDate: null, endDate: null });
      return;
    }

    // 학생별 결석 정보 (과목별로 필터)
    const absencesForSubject = (student.absences || []).filter(a => a.subjectId === sub.id);
    const absentDateSet = new Set(absencesForSubject.map(a => a.date));
    
    // 주기 범위를 문자열로 안전하게 비교 (시간 포함 비교 회피)
    const cycleStartStr = cycleStart ? formatDateStr(cycleStart) : '';
    const cycleEndStr = cycleEnd ? formatDateStr(cycleEnd) : '';
    const newCycleStartStr = formatDateStr(newCycleStart);

    // 회차별 일정 변경 적용 (수정/추가/삭제 — 날짜 기준 매칭, 공용 함수)
    // 추가 수업 표시 범위: 계획=주기 시작일 이후 전부, 진행=지난 주기 시작 ~ 계획 시작 전날
    const addFrom = mode === 'plan' ? newCycleStartStr : cycleStartStr;
    const addTo = mode === 'plan' ? '' : formatDateStr(addDays(newCycleStart, -1));
    const { finals } = applyScheduleAdjustments(sessions, sub.adjustments, { cycleStartStr, cycleEndStr, addFrom, addTo, holidaySet, classDays: usedDays, skipHolidays: sub.skipHolidays });

    finals.forEach(f => {
      if (!sessionMap.has(f.dateStr)) sessionMap.set(f.dateStr, []);
      sessionMap.get(f.dateStr).push({
        subjectIndex: subIdx,
        subjectName: sub.name,
        sessionNum: f.num,
        absent: absentDateSet.has(f.dateStr) || (!!f.originalDate && absentDateSet.has(f.originalDate)),
        adjusted: f.adjusted || !!f.holidayShifted,
        originalDate: (f.adjusted || f.holidayShifted) ? f.originalDate : null,
        isExtra: f.isExtra,
        note: f.note,
      });
    });

    // 최종 일정 범위 (이동·추가·삭제 반영된 실제 시작~끝)
    const finalDateStrs = finals.map(f => f.dateStr).sort();
    const finalStartStr = finalDateStrs[0] || cycleStartStr;
    const finalEndStr = finalDateStrs[finalDateStrs.length - 1] || cycleEndStr;
    
    // 보강 일정 추가: 진행/계획 어디에도 안 들어가는 보강은
    // 가장 가까운 주기(결석 회차가 속한 주기)에 함께 표시
    const allMakeups = sub.makeups || [];
    
    const makeups = allMakeups.filter(m => {
      if (!m.date || !finalStartStr || !finalEndStr) return false;

      // 1. 이번 주기 범위 안 (이동 반영된 최종 범위) → 표시
      if (m.date >= finalStartStr && m.date <= finalEndStr) return true;

      // 2. 진행 캘린더(mode==='current')인 경우,
      //    진행 끝 ~ 다음 주기 시작일(=newCycleStart) 사이의 보강도 표시
      //    (예: 진행 끝 4/3 ~ 계획 시작 4/8 사이의 4/4 보강)
      if (mode === 'current') {
        if (m.date > finalEndStr && m.date < newCycleStartStr) return true;
      }

      return false;
    });

    // 🔍 디버깅: 보강이 있는데 모두 필터링되어 사라지면 콘솔 출력
    if (allMakeups.length > 0 && makeups.length === 0) {
      console.log(`[보강 필터링 제외] 과목: ${sub.name}, 모드: ${mode}`);
      console.log(`  주기 범위: ${finalStartStr} ~ ${finalEndStr}`);
      console.log(`  다음 주기 시작: ${newCycleStartStr}`);
      console.log(`  등록된 보강:`, allMakeups.map(m => m.date));
    }
    
    makeups.forEach(m => {
      const key = m.date;
      if (!sessionMap.has(key)) sessionMap.set(key, []);
      sessionMap.get(key).push({
        subjectIndex: subIdx,
        subjectName: sub.name,
        sessionNum: 0, // 보강은 회차 번호 없음
        absent: false,
        isMakeup: true,
        makeupNote: m.note || '',
      });
    });

    subjectData.push({
      ...sub,
      index: subIdx,
      classDays: usedDays, // 진행 캘린더는 지난 주기 요일 기준으로 표시
      totalSessions: usedTotal,
      sessions: finals.map(f => ({ date: parseDate(f.dateStr), sessionNum: f.num })),
      startDate: parseDate(finalStartStr),
      endDate: parseDate(finalEndStr),
      absentCount: absencesForSubject.filter(a => a.date >= finalStartStr && a.date <= finalEndStr).length,
      makeupCount: makeups.length, // 이번 주기에 표시되는 보강 수
    });
  });

  return { sessionMap, subjectData };
}

// 달력 표시 범위 결정: 전체 수업이 포함된 달들
function determineCalendarMonths(subjectData, sessionMap) {
  const allDates = [];
  subjectData.forEach(sd => {
    if (sd.startDate) allDates.push(sd.startDate);
    if (sd.endDate) allDates.push(sd.endDate);
  });
  // sessionMap의 모든 날짜도 포함 (보강·이동된 회차 포함)
  if (sessionMap) {
    sessionMap.forEach((_, dateStr) => {
      const d = parseDate(dateStr);
      if (d) allDates.push(d);
    });
  }
  if (allDates.length === 0) return [];
  const earliest = new Date(Math.min(...allDates.map(d => d.getTime())));
  const latest = new Date(Math.max(...allDates.map(d => d.getTime())));
  const months = [];
  const cur = new Date(earliest.getFullYear(), earliest.getMonth(), 1);
  while (cur <= latest) {
    months.push({ year: cur.getFullYear(), month: cur.getMonth() + 1 });
    cur.setMonth(cur.getMonth() + 1);
  }
  return months;
}

            {(student.subjects || []).some(s => s.makeups && s.makeups.length > 0) && (
              <span style={{ fontSize: '10px', color: '#6b7280', display: 'flex', alignItems: 'center', gap: '3px' }}>
                <span style={{ background: '#cffafe', padding: '1px 4px', borderRadius: '3px', fontWeight: 700, color: '#0891b2', border: '1px solid #67e8f9' }}>🔵보강</span>
                보강 일정
              </span>
            )}
          </div>
        )}
      </div>

      {/* 월별 캘린더 */}
      {months.map(({ year, month }) => {
        const weeks = buildMonthWeeks(year, month);
        return (
          <div key={`${year}-${month}`} style={{ padding: '12px 16px', borderBottom: '1px solid #e5e7eb' }}>
            <div style={{ fontSize: '13px', fontWeight: 700, color: '#1a2344', marginBottom: '6px', textAlign: 'center' }}>
              {year}년 {String(month).padStart(2, '0')}월
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', border: '1px solid #d1d5db', background: '#d1d5db', gap: '1px' }}>
              {DAY_NAMES_KO.map((day, i) => (
                <div key={i} style={{ background: '#f3f4f6', padding: '4px', textAlign: 'center', fontSize: '11px', fontWeight: 600, color: i === 0 ? '#dc2626' : i === 6 ? '#2563eb' : '#374151' }}>
                  {day}
                </div>
              ))}
              {weeks.flat().map((date, idx) => {
                const dstr = formatDateStr(date);
                const isCurrentMonth = date.getMonth() === month - 1;
                const holiday = holidayMap.get(dstr);
                const sessions = sessionMap.get(dstr) || [];
                const dow = date.getDay();
                const hasClass = sessions.length > 0;

                let bg = 'white';
                if (!isCurrentMonth) bg = '#f9fafb';
                else if (holiday) bg = '#FEE2E2';
                else if (hasClass) {
                  // 과목이 여러 개면 그라디언트, 하나면 단색
                  const colors = sessions.map(s => subjectColors.find(sc => sc.index === s.subjectIndex)?.color?.bg).filter(Boolean);
                  if (colors.length === 1) bg = colors[0];
                  else if (colors.length > 1) {
                    const stops = colors.map((c, i) => `${c} ${(i / colors.length) * 100}% ${((i + 1) / colors.length) * 100}%`).join(', ');
                    bg = `linear-gradient(135deg, ${stops})`;
                  }
                }

                const dateColor = !isCurrentMonth ? '#9ca3af' : holiday ? '#dc2626' : dow === 0 ? '#dc2626' : '#111827';

                return (
                  <div key={idx} style={{
                    background: bg,
                    minHeight: '60px',
                    padding: '4px 3px',
                    fontSize: '10px',
                    opacity: isCurrentMonth ? 1 : 0.5,
                    position: 'relative',
                    display: 'flex',
                    flexDirection: 'column',
                    alignItems: 'center',
                    textAlign: 'center',
                  }}>
                    <div style={{ fontSize: '11px', fontWeight: holiday ? 700 : 500, color: dateColor, lineHeight: 1 }}>
                      {date.getDate()}
                    </div>
                    {holiday && isCurrentMonth && (
                      <div style={{ fontSize: '9px', color: '#dc2626', fontWeight: 700, marginTop: '2px', lineHeight: 1.1, textAlign: 'center' }}>
                        {holiday}
                      </div>
                    )}
                    {isCurrentMonth && sessions.map((s, si) => {
                      const color = subjectColors.find(sc => sc.index === s.subjectIndex)?.color;
                      if (!color) return null;

                      // 보강 표시
                      if (s.isMakeup) {
                        return (
                          <React.Fragment key={si}>
                            <div style={{
                              fontSize: '10px',
                              color: '#0891b2',
                              fontWeight: 800,
                              lineHeight: 1.2,
                              marginTop: '2px',
                              background: '#cffafe',
                              padding: '1px 4px',
                              borderRadius: '3px',
                              border: '1px solid #67e8f9',
                              letterSpacing: '-0.02em',
                              textAlign: 'center',
                            }} title={s.makeupNote || '보강'}>
                              🔵{s.subjectName}보강
                            </div>
                            {s.makeupNote && (
                              <div style={{ fontSize: '8px', color: '#0e7490', lineHeight: 1.15, marginTop: '1px', textAlign: 'center', wordBreak: 'keep-all' }}>
                                {s.makeupNote}
                              </div>
                            )}
                          </React.Fragment>
                        );
                      }

                      return (
                        <React.Fragment key={si}>
                          <div style={{
                            fontSize: '10px',
                            color: s.absent ? '#dc2626' : color.badge,
                            fontWeight: 800,
                            lineHeight: 1.2,
                            marginTop: '2px',
                            textDecoration: s.absent ? 'line-through' : 'none',
                            textShadow: '0 0 1px rgba(255,255,255,0.5)',
                            letterSpacing: '-0.02em',
                            textAlign: 'center',
                            background: s.adjusted ? '#fef3c7' : 'transparent',
                            padding: s.adjusted ? '0 3px' : '0',
                            borderRadius: s.adjusted ? '3px' : '0',
                          }} title={s.adjusted ? `원래 ${s.originalDate}에서 변경됨` : ''}>
                            {s.adjusted && '↪'}{s.subjectName}{s.sessionNum}
                            {s.absent && <span style={{ marginLeft: '2px', color: '#dc2626', textDecoration: 'none' }}>결</span>}
                          </div>
                          {s.note && (
                            <div style={{ fontSize: '8px', color: '#6b7280', lineHeight: 1.15, marginTop: '1px', textAlign: 'center', wordBreak: 'keep-all' }}>
                              {s.note}
                            </div>
                          )}
                        </React.Fragment>
                      );
                    })}
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}

      {/* 과목별 요약 */}
      <div style={{ padding: '12px 16px', background: '#f9fafb', borderTop: '2px solid #1a2344' }}>
        <div style={{ fontSize: '12px', fontWeight: 700, color: '#1a2344', marginBottom: '6px' }}>📊 과목별 요약</div>
        {subjectColors.map((s) => (
          <div key={s.index} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', fontSize: '11px', padding: '4px 8px', background: 'white', borderLeft: `4px solid ${s.color.badge}`, marginBottom: '3px' }}>
            <div>
              <span style={{ fontWeight: 800, color: s.color.badge, marginRight: '8px' }}>{s.name}</span>
              <span style={{ color: '#6b7280' }}>
                {fmtKDate(s.startDate)} ~ {fmtKDate(s.endDate)}
              </span>
            </div>
            {(() => {
              // 직접 쓴 요약 문구가 있으면 그대로 표시 (학생 편집 > 캘린더 요약 문구)
              const ov = ((mode === 'current' ? s.summaryTextCurrent : s.summaryTextPlan) || '').trim();
              if (ov) return <div style={{ fontWeight: 600, color: '#1a2344' }}>{ov}</div>;
              return (
                <div style={{ fontWeight: 600, color: '#1a2344' }}>
                  총 {s.sessions.length}회차
                  {mode === 'current' && s.absentCount > 0 && (
                    <span style={{ color: '#dc2626', marginLeft: '6px' }}>(결석 {s.absentCount}회)</span>
                  )}
                  {s.makeupCount > 0 && (
                    <span style={{ color: '#0891b2', marginLeft: '6px' }}>(보강 {s.makeupCount}회)</span>
                  )}
                  · 주 {s.classDays.length}회
                </div>
              );
            })()}
          </div>
        ))}
      </div>

      {/* 계획 모드일 때 등록 마감 경고 박스 */}
      {mode === 'plan' && registrationDeadline && (
        <div style={{ padding: '14px 16px', background: 'white' }}>
          <div style={{ border: '3px solid #dc2626', borderRadius: '8px', padding: '12px', background: '#FEF2F2' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '6px' }}>
              <span style={{ fontSize: '18px' }}>⚠️</span>
              <span style={{ fontSize: '13px', fontWeight: 800, color: '#991B1B' }}>
                익월 등록 · 퇴원 고지 안내
              </span>
            </div>
            <div style={{ fontSize: '11px', color: '#7f1d1d', lineHeight: 1.6, fontWeight: 600 }}>
              <div style={{ marginBottom: '4px' }}>
                📅 익월 등록 마감일: <span style={{ fontSize: '14px', fontWeight: 800 }}>{fmtKDate(registrationDeadline)}까지</span>
              </div>
              <div style={{ fontSize: '10.5px', fontWeight: 500, color: '#7f1d1d', marginTop: '6px' }}>
                위 날짜까지 퇴원 의사를 전달해주셔야 온라인 수업 프로그램 결제 취소, 교재 제작 중단 등이 가능합니다.
                고지 없이 미납 시 <strong>교재·온라인 비용이 이미 집행</strong>되어 환불이 어려우며,
                원활한 학원 운영을 위해 반드시 사전 안내 부탁드립니다. 🙏
              </div>
            </div>
          </div>
        </div>
      )}

      {/* 진행 모드일 때 간단 푸터 */}
      {mode === 'current' && (
        <div style={{ padding: '10px 16px', background: '#f3f4f6', fontSize: '10px', color: '#6b7280', textAlign: 'center' }}>
          * 결석(결) 표시는 수업일이지만 결석 처리된 회차입니다
          {validSubjects.some(s => s.makeupCount > 0) && (
            <span style={{ marginLeft: '8px' }}>· 🔵보강은 결석 보강 일정입니다</span>
          )}
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════
//  4. 안내문 렌더링 (템플릿 정확히 재현)
// ═══════════════════════════════════════════════════

function InvoiceView({ student, settings, invoiceRef }) {
  if (!student) return null;

  // 기간 표시 자동 계산 (시작월 ~ 종료월) / 월정액은 대상 월만
  const periodLabel = (() => {
    if (student.periodDisplay) return student.periodDisplay;
    
    // 월정액 학생: 대상 월만 표시
    if (student.isMonthly) {
      const ym = student.monthlyYearMonth;
      if (!ym) return '';
      const [year, month] = ym.split('-');
      return `${year}년 ${month}월`;
    }
    
    // 회차제: 시작일 ~ 종료일
    if (!student.subjects || student.subjects.length === 0) return '';
    const dates = student.subjects.map(s => parseDate(s.startDate)).filter(Boolean);
    if (dates.length === 0) return '';
    const earliest = new Date(Math.min(...dates.map(d => d.getTime())));
    const holidaySet = new Set((settings.holidays || []).map(h => h.date));
    const endDates = student.subjects.map(s => {
      const sessions = getClassSessions(parseDate(s.startDate), s.classDays, s.totalSessions, holidaySet, s.skipHolidays);
      if (sessions.length === 0) return null;
      // 일정 변경(이동·추가·삭제) 반영된 실제 마지막 수업일
      const csStr = formatDateStr(sessions[0].date);
      const ceStr = formatDateStr(sessions[sessions.length - 1].date);
      const { finals } = applyScheduleAdjustments(sessions, s.adjustments, { cycleStartStr: csStr, cycleEndStr: ceStr, addFrom: s.startDate, addTo: '', holidaySet, classDays: s.classDays, skipHolidays: s.skipHolidays });
      const lastStr = finals.length > 0 ? finals.map(f => f.dateStr).sort().pop() : ceStr;
      return parseDate(lastStr);
    }).filter(Boolean);
    if (endDates.length === 0) return fmtKYearMonth(earliest);
    const latest = new Date(Math.max(...endDates.map(d => d.getTime())));
    if (earliest.getFullYear() === latest.getFullYear() && earliest.getMonth() === latest.getMonth()) {
      return `${earliest.getFullYear()}년 ${String(earliest.getMonth() + 1).padStart(2, '0')}월`;
    }
    return `${earliest.getFullYear()}년 ${String(earliest.getMonth() + 1).padStart(2, '0')}월 ~ ${String(latest.getMonth() + 1).padStart(2, '0')}월`;
  })();

  const tuitionTotal = (student.subjects || []).reduce((s, x) => s + (x.tuition || 0), 0);
  const materialTotal = (student.materials || []).reduce((s, x) => s + (x.amount || 0), 0);

  const greeting1 = settings.greetingLine1.replace('{학원명}', settings.academyName);

  return (
    <div ref={invoiceRef} className="invoice-navy" style={{ 
      width: '560px', 
      color: 'white',
    }}>
      {/* 헤더 */}
      <div className="wave-bg px-8 pt-10 pb-14 text-center relative">
        <div className="invoice-gold-text text-[11px] tracking-[0.25em] font-semibold mb-3">
          {settings.academyNameEn}
        </div>
        <h1 className="text-white text-xl font-bold leading-relaxed">
          {settings.headerTitle1}
        </h1>
        <h1 className="text-white text-xl font-bold leading-relaxed">
          <span className="invoice-gold-text">수강료 선납</span>
          {settings.headerTitle2.replace('수강료 선납', '')}
        </h1>
        <div className="invoice-gold inline-block mt-3" style={{ width: '36px', height: '3px', borderRadius: '2px' }}></div>
      </div>

      {/* 인사말 + 학생 정보 */}
      <div className="bg-white mx-5 -mt-6 rounded-lg p-5 text-gray-800 shadow-lg relative z-10">
        <p className="text-sm leading-relaxed">{greeting1}</p>
        <p className="text-sm leading-relaxed">{settings.greetingLine2}</p>
        <p className="text-sm leading-relaxed mb-4">{settings.greetingLine3}</p>
        <div className="flex items-center gap-3 flex-wrap">
          <div
            className="invoice-navy text-white rounded-full text-sm font-semibold"
            style={{
              display: 'inline-flex',
              alignItems: 'center',
              gap: '6px',
              padding: '6px 18px',
              lineHeight: 1.4,
            }}
          >
            <span className="invoice-gold-text">✦</span>
            <span>{student.name} 학생</span>
          </div>
          {(student.schoolName || student.grade) && (
            <div
              className="text-gray-700 text-xs font-medium bg-gray-100 rounded-full"
              style={{
                display: 'inline-flex',
                alignItems: 'center',
                padding: '5px 12px',
                lineHeight: 1.4,
              }}
            >
              {student.schoolName}{student.schoolName && student.grade ? ' · ' : ''}{student.grade}
            </div>
          )}
          {periodLabel && (
            <div className="text-gray-600 text-xs flex items-center gap-1">
              <span>📅</span>
              <span>{periodLabel}</span>
              {student.isMonthly && <span className="ml-1 px-1.5 py-0.5 bg-blue-100 text-blue-700 rounded font-semibold text-[10px]">월정액</span>}
            </div>
          )}
        </div>
      </div>

      {/* 수업 일정 - 월정액 학생은 숨김 */}
      {!student.isMonthly && (
      <div className="bg-white mx-5 mt-4 rounded-lg p-5 text-gray-800">
        <div className="flex items-center gap-2 mb-3">
          <span className="text-base">📊</span>
          <h2 className="font-semibold text-gray-800">수업 일정</h2>
        </div>
        <div className="border-t border-gray-200 mb-3"></div>
        <div className="space-y-2">
          {(student.subjects || []).map((sub) => {
            // 실제 1회차 날짜 + 변경 내역(사유): 요일 패턴 + 일정 변경(이동·추가·삭제·휴원일 자동 이동) 반영
            const invHolidaySet = new Set((settings.holidays || []).map(h => h.date));
            let firstDate = parseDate(sub.startDate);
            const changeLines = [];
            const fmtD2 = (ds) => `${fmtKDate(parseDate(ds))} (${DAY_NAMES_KO[parseDate(ds).getDay()]})`;
            if (sub.startDate && sub.classDays && sub.classDays.length > 0) {
              const sessions = getClassSessions(parseDate(sub.startDate), sub.classDays, sub.totalSessions, invHolidaySet, sub.skipHolidays);
              if (sessions.length > 0) {
                const cs = formatDateStr(sessions[0].date);
                const ce = formatDateStr(sessions[sessions.length - 1].date);
                const { finals, deleted } = applyScheduleAdjustments(sessions, sub.adjustments, { cycleStartStr: cs, cycleEndStr: ce, addFrom: sub.startDate, addTo: '', holidaySet: invHolidaySet, classDays: sub.classDays, skipHolidays: sub.skipHolidays });
                if (finals.length > 0) firstDate = parseDate(finals.map(f => f.dateStr).sort()[0]);
                finals.forEach(f => {
                  if (f.adjusted || f.holidayShifted) changeLines.push({ d: f.dateStr, text: `↪ ${f.num}회차 → ${fmtD2(f.dateStr)}${f.holidayShifted ? ' · 휴원일 자동 이동' : ''}${f.note ? ' · ' + f.note : ''}` });
                  else if (f.isExtra) changeLines.push({ d: f.dateStr, text: `➕ ${fmtD2(f.dateStr)} 수업 추가${f.note ? ' · ' + f.note : ''}` });
                  else if (f.note) changeLines.push({ d: f.dateStr, text: `💬 ${f.num}회차 ${fmtD2(f.dateStr)} · ${f.note}` });
                });
                (deleted || []).forEach(dl => {
                  if (dl.originalDate) changeLines.push({ d: dl.originalDate, text: `— ${fmtD2(dl.originalDate)} 수업 없음${dl.note ? ' · ' + dl.note : ''}` });
                });
                (sub.makeups || []).forEach(m => {
                  if (m.date) changeLines.push({ d: m.date, text: `🔵 ${fmtD2(m.date)} 보강${m.note ? ' · ' + m.note : ''}` });
                });
                changeLines.sort((a, b) => a.d.localeCompare(b.d));
              }
            }
            return (
              <div key={sub.id} className="py-1.5 px-2 rounded" style={{ background: '#f7f5f0' }}>
                <div className="flex items-center gap-3">
                  <span
                    className={`${getChipClass(sub.name)} text-xs font-semibold rounded-full min-w-[48px]`}
                    style={{
                      display: 'inline-flex',
                      alignItems: 'center',
                      justifyContent: 'center',
                      padding: '4px 12px',
                      lineHeight: 1.4,
                    }}
                  >
                    {sub.name}
                  </span>
                  <span className="text-sm text-gray-700 flex-1">
                    시작 <span className="font-bold">{fmtKDate(firstDate)}</span> 1회차
                  </span>
                  <span className="text-xs text-gray-500 font-medium">주 {(sub.classDays || []).length || sub.sessionsPerWeek}회</span>
                </div>
                {changeLines.length > 0 && (
                  <div className="mt-1.5 pt-1.5 text-[11px] text-gray-500 leading-relaxed" style={{ borderTop: '1px dashed #d9d4c8' }}>
                    {changeLines.map((c, i) => <div key={i}>{c.text}</div>)}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
      )}

      {/* 교습비 안내 */}
      <div className="invoice-navy-2 mx-5 mt-4 rounded-lg p-5">
        <div className="flex items-center gap-2 mb-3">
          <span>💰</span>
          <h2 className="font-semibold text-white">교습비 안내</h2>
        </div>
        <div className="border-t border-white/20 mb-3"></div>
        <div className="space-y-2">
          {(student.subjects || []).map((sub) => (
            <div key={sub.id} className="flex justify-between items-center py-1">
              <span className="text-sm">
                <span className="font-medium text-white">{sub.label || sub.name}</span>
                {sub.labelNote && <span className="text-xs text-white/60 ml-2">{sub.labelNote}</span>}
              </span>
              <span className="text-white font-bold text-sm">{fmtWon(sub.tuition)}</span>
            </div>
          ))}
        </div>
        <div
          className="invoice-gold mt-3 rounded"
          style={{
            display: 'flex',
            justifyContent: 'space-between',
            alignItems: 'center',
            padding: '14px 18px',
            lineHeight: 1.2,
          }}
        >
          <span className="font-bold text-sm" style={{ lineHeight: 1 }}>교습비 합계</span>
          <span className="font-bold text-base" style={{ lineHeight: 1 }}>{fmtWon(tuitionTotal)}</span>
        </div>
      </div>

      {/* 교재비 */}
      {(student.materials || []).length > 0 && (
        <div className="invoice-navy-2 mx-5 mt-4 rounded-lg p-5">
          <div className="flex items-center gap-2 mb-3">
            <span>📚</span>
            <h2 className="font-semibold text-white">교재비 · 컨텐츠비</h2>
          </div>
          <div className="border-t border-white/20 mb-3"></div>
          <div className="space-y-2">
            {(student.materials || []).map((m) => (
              <div key={m.id} className="flex justify-between items-center py-1">
                <span className="text-sm">
                  <span className="font-medium text-white">{m.label}</span>
                  {m.note && <span className="text-xs text-white/60 ml-2">{m.note}</span>}
                </span>
                <span className="text-white font-bold text-sm">{fmtWon(m.amount)}</span>
              </div>
            ))}
          </div>
          <div
            className="invoice-gold mt-3 rounded"
            style={{
              display: 'flex',
              justifyContent: 'space-between',
              alignItems: 'center',
              padding: '14px 18px',
              lineHeight: 1.2,
            }}
          >
            <span className="font-bold text-sm" style={{ lineHeight: 1 }}>교재비 합계</span>
            <span className="font-bold text-base" style={{ lineHeight: 1 }}>{fmtWon(materialTotal)}</span>
          </div>
          {settings.contentsLabel && (
            <div className="text-[11px] text-white/50 mt-3 pt-3 border-t border-white/10">
              <span className="text-white/70 font-medium">{settings.contentsLabel}</span>
            </div>
          )}
        </div>
      )}

      {/* 교습비 결제 방법 */}
      <div className="bg-white mx-5 mt-4 rounded-lg p-5 text-gray-800">
        <div className="flex items-center gap-2 mb-4">
          <span>💳</span>
          <h2 className="font-semibold">교습비 결제 방법</h2>
        </div>
        <div className="bg-gray-50 rounded-lg p-4 mb-3">
